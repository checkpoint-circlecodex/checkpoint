name: Vérifier

# L'invariant 11 dit « vérifié par une règle de lint, pas par la discipline ».
# Un script qu'on lance quand on y pense EST de la discipline : il faut qu'une
# machine le lance à chaque poussée, sinon la règle n'en est pas une.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        # La même version majeure qu'en local. Un essai qui passe ici et
        # casse là-bas ne vérifie rien : on mesure dans la condition où l'on sera.
        with: { node-version: "26", cache: npm }
      - run: npm ci
      - name: Dépendances entre couches
        run: npm run check:layers
      - name: Types
        run: npm run check
      - name: Essais du noyau
        run: npm test
      - name: Construction
        run: npx vite build

  # Les paquets se construisent aussi sous Windows, et la construction passe
  # par la vérification des couches. Le 12 octobre, elle y a échoué — des
  # chemins à barres inverses — alors que Mac et Linux passaient : on vérifie
  # donc là où l'on construira, à chaque poussée, et pas le jour d'une version.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "26", cache: npm }
      - run: npm ci
      - name: Dépendances entre couches
        run: npm run check:layers
      - name: Essais du noyau
        run: npm test

  natif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Dépendances système de Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Compilation et essais
        # Sans CHECKPOINT_TOKEN les essais d'intégration s'abstiennent au lieu
        # d'échouer : la CI n'a rien à écrire dans le dépôt de données, et on
        # n'y met pas de jeton.
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --nocapture
