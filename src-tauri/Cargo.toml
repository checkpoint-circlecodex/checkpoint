[package]
name = "checkpoint"
version = "0.1.0"
description = "Checkpoint — un tracker d'œuvres partagé au sein d'un cercle"
authors = ["Nathan Carmichael"]
license = ""
repository = "https://github.com/checkpoint-circlecodex/checkpoint"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "checkpoint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = [] }
tauri-plugin-log = "2"
