const flat = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"");
function suspected(){
  const by = {};
  for (const [id,m] of Object.entries(CATALOG)){
    if (!alive(id)) continue;
    for (const t of [m.title, m.titleFr]){
      if (!t) continue;
      const k = m.mediaType + ":" + flat(t);
      (by[k] = by[k] || new Set()).add(id);
    }
  }
  const out = [], done = new Set();
  for (const ids of Object.values(by)){
    if (ids.size < 2) continue;
    const key = [...ids].sort().join("|");
    if (done.has(key)) continue;
    done.add(key);
    /* Le survivant est celui qui n'a pas été inscrit à la main : il porte un
       identifiant de source, et l'identité d'une œuvre est son identifiant. */
    const sorted = [...ids].sort((a,b) => (CATALOG[a].manual?1:0) - (CATALOG[b].manual?1:0));
    out.push({ keep:sorted[0], drop:sorted.slice(1) });
  }

}

/* --- Caractère d'un ensemble, toujours mesuré contre l'ensemble du groupe --- */
function temper(rows){
  const all = ROWS;
  const a = avgOf(rows), ga = avgOf(all);
  const fin = rows.filter(r => r.status === "completed" || r.status === "mastered").length;
  const eng = rows.filter(r => r.status !== "wishlist").length;
  const gfin = all.filter(r => r.status === "completed" || r.status === "mastered").length;
  const geng = all.filter(r => r.status !== "wishlist").length;
  const k = {};
  for (const r of rows) { const t = work(r.mediaId).mediaType; k[t] = (k[t]||0) + 1; }
  const top = Object.entries(k).sort((x,y) => y[1]-x[1])[0];
  return { avg:a, gavg:ga,
    sev: (a !== null && ga !== null) ? a - ga : null,
    rate: eng ? fin/eng : 0, grate: geng ? gfin/geng : 0,
    pref: top ? top[0] : null, prefShare: top && eng ? top[1]/rows.length : 0 };
}

/* --- L'œuvre qu'un Ordre défend contre les autres --- */
function partisan(cid){
  let best = null;
  for (const id of tracked()){
    const rs = rowsFor(id);
    const ins = rs.filter(r => person(r.personId).circle === cid && typeof r.rating === "number");
    const out = rs.filter(r => person(r.personId).circle !== cid && typeof r.rating === "number");
    if (!ins.length || !out.length) continue;
    const d = avgOf(ins) - avgOf(out);
    if (!best || d > best.d) best = { id, d, mine:avgOf(ins), theirs:avgOf(out) };
  }
  return best && best.d >= 1 ? best : null;
}

const COMPLETION = ["mastered","completed","playing","paused","dropped","wishlist"];
/* Un regroupement par complétion mélange jeux, films et livres : il lui faut un
   libellé neutre, puisque aucun accord de nature ne vaut pour tous. */
const NUM_FR = ["zéro","une","deux","trois","quatre","cinq","six","sept","huit","neuf","dix"];

/* --- Ce qu'une personne défend seule contre le groupe. Même calcul que pour
   un Ordre : monté ici dès que les deux en ont eu besoin. --- */
function singularity(pid){
  let best = null;
  for (const r of rowsBy(pid)){
    if (typeof r.rating !== "number") continue;
    const others = rowsFor(r.mediaId).filter(x => x.personId !== pid && typeof x.rating === "number");
    if (others.length < 2) continue;
    const d = r.rating - avgOf(others);
    if (!best || Math.abs(d) > Math.abs(best.d))
      best = { id:r.mediaId, mine:r.rating, theirs:avgOf(others), d };
  }
  return best && Math.abs(best.d) >= 1.5 ? best : null;
}

/* --- La parenté : ce que deux personnes partagent, et où elles se séparent.
   C'est la seule chose qu'un carnet solitaire ne saura jamais dire. --- */
function kinship(meId, pid){
  const mineAll = rowsBy(meId), theirs = rowsBy(pid);
  const mineMap = new Map(mineAll.map(r => [r.mediaId, r]));
  const common = theirs.filter(r => mineMap.has(r.mediaId) && r.status !== "wishlist"
                                 && mineMap.get(r.mediaId).status !== "wishlist");
  const pairs = common
    .filter(r => typeof r.rating === "number" && typeof mineMap.get(r.mediaId).rating === "number")
    .map(r => ({ id:r.mediaId, them:r.rating, me:mineMap.get(r.mediaId).rating,
                 d:Math.abs(r.rating - mineMap.get(r.mediaId).rating) }));
  const accord = pairs.length ? pairs.reduce((s,g)=>s+g.d,0)/pairs.length : null;
  const clash  = pairs.length ? pairs.reduce((m,g)=> g.d > m.d ? g : m) : null;
  const urge = theirs.filter(r => (r.status === "completed" || r.status === "mastered")
      && typeof r.rating === "number" && r.rating >= 9)
    .filter(r => { const m = mineMap.get(r.mediaId); return !m || m.status === "wishlist"; })
    .sort((a,b) => b.rating - a.rating);
  return { common, pairs, accord, clash, urge };
}

/* Promu au deuxième usage : on décrit les catégories en créant l'œuvre, et on
   les reprend en s'y inscrivant. Même sélecteur, deux endroits. */
function gnPicker(kind, chosen){

  const extra = [...chosen].filter(x => !known.has(x));
  const groups = [...genreGroups(kind),
    ...(extra.length ? [{ g:"Déjà consigné", l:extra }] : [])];

    ? "La forme dit comment ça se joue, le thème ce dont ça parle."

}

   jaquette, et la fusion retient la première contribution. */

}
/* Refaire une œuvre n'est pas une nouvelle entrée : c'est un compteur. */
function bumpPlays(mediaId){
  const sh = SHARDS.find(x => x.user.id === ME);
  const e = sh.entries[mediaId]; if (!e) return;
  e.plays = (e.plays || 1) + 1; e.at = new Date().toISOString();
  const i = ROWS.findIndex(r => r.personId === ME && r.mediaId === mediaId);
  if (i >= 0) ROWS[i] = { ...e, mediaId, personId: ME };
}

/* --- Les favoris. Un favori N'EST PAS une note : on distingue ce à quoi on
   tient, et on peut tenir à une œuvre qu'on n'a pas finie ou en défendre une
   qu'on a jugée moyenne. Confondre les deux reviendrait à dériver les favoris
   d'un classement, c'est-à-dire à n'avoir rien ajouté.
   La liste est ORDONNÉE — le premier rang est le magnum opus de la personne —
   et plafonnée : au-delà de douze, ce n'est plus un choix, c'est un second
   registre. On ne distingue pas ce qu'on convoite : il faut l'avoir fréquenté. --- */
const FAV_MAX = 12;
const favsOf = pid => ((PEOPLE[pid] || {}).favorites || []).filter(id => CATALOG[id]);
const isFav = mid => favsOf(ME).includes(mid);
const favEligible = mid => { const r = myRow(mid); return !!r && r.status !== "wishlist"; };
function writeFavs(list){
  const sh = SHARDS.find(x => x.user.id === ME);
  sh.favorites = list; PEOPLE[ME].favorites = list;
}
function toggleFav(mid){
  const l = favsOf(ME);
  if (l.includes(mid)) return writeFavs(l.filter(x => x !== mid));
  if (l.length >= FAV_MAX || !favEligible(mid)) return;
  writeFavs([...l, mid]);
}
function moveFav(mid, d){
  const l = [...favsOf(ME)], i = l.indexOf(mid), j = i + d;
  if (i < 0 || j < 0 || j >= l.length) return;
  [l[i], l[j]] = [l[j], l[i]]; writeFavs(l);
}
/* Le Magnum opus d'un Ordre est la somme des distinctions de ses membres — ce
   qu'ils ont déclaré, jamais ce qu'ils ont le mieux noté. Ce qui réunit le plus
   de voix passe devant ; à égalité, le rang que ses tenants lui donnent
   tranche, puis le jugement de l'Ordre. */
function magnum(cid){
  const by = {};
  membersOf(cid).forEach(p => favsOf(p.id).forEach((id,rank) => {
    (by[id] ||= { id, holders:[], rank:0 });
    by[id].holders.push(p); by[id].rank += rank;
  }));
  return Object.values(by)
    .map(x => ({ ...x, avg: avgOf(ROWS.filter(r => r.mediaId === x.id && inCircle(cid)(r))) }))
    .sort((a,b) => b.holders.length - a.holders.length
       || a.rank / a.holders.length - b.rank / b.holders.length
       || (b.avg || 0) - (a.avg || 0)
       || titleOf(a.id).localeCompare(titleOf(b.id), "fr"));
}

/* --- La Grande Loge : un message board par Ordre, et surtout pas un salon.
   Il n'y a pas de serveur pour pousser quoi que ce soit — un message paraît
   à la synchronisation suivante, et l'interface doit le dire. Chacun n'écrit
   que dans son propre fragment : l'invariant premier tient sans un mot de
   code en plus, et il en découle que PERSONNE n'efface le message d'un autre.
   On y lit tous les Ordres ; on ne prend la parole que dans le sien. --- */
/* Un fil se lit dans le sens du temps, du plus ancien au plus récent : c'est
   ce qui le distingue d'un registre, qui se lit à l'envers. */
const logeOf = cid => POSTS.filter(m => m.order === cid).sort((a,b) => a.at.localeCompare(b.at));
const postById = id => POSTS.find(m => m.id === id) || null;
/* La Loge d'un Ordre ne se lit que par les siens. ⚠️ C'est une règle d'usage,
   pas une clôture : tout le monde lit le même dépôt, donc l'application fait
   respecter la convention — elle ne garantit pas le secret. Dit dans la spec. */
const speaksIn = cid => person(ME).circle === cid;

/* Surligner : une marque, rangée dans le fragment de celui qui la pose. */
const marksOf = pid => (PEOPLE[pid] || {}).marks || [];
const markers = postId => Object.values(PEOPLE).filter(p => marksOf(p.id).includes(postId));
const isMarked = postId => marksOf(ME).includes(postId);
function toggleMark(postId){
  const sh = SHARDS.find(x => x.user.id === ME);
  const l = marksOf(ME);
  const next = l.includes(postId) ? l.filter(x => x !== postId) : [...l, postId];
  sh.marks = next; PEOPLE[ME].marks = next;
}
const litIn = cid => logeOf(cid).filter(m => markers(m.id).length);

/* --- Les quêtes. Un palier est MONOTONE : une fois atteint, il ne se reperd
   pas. C'est ce qui rend une quête honnête — on ne doit jamais se réveiller
   désaccompli parce qu'on a changé un statut.
   D'où l'échelle, et elle seule : avoir renoncé ou accompli, c'est avoir
   entrepris ; accompli vaut achevé. « Suspendu » n'est pas un palier — on en
   sort —, et c'est la raison pour laquelle il n'en est pas un. --- */
const RANK   = { wishlist:1, playing:2, paused:2, dropped:2, completed:3, mastered:3 };
const RUNGS  = [
  { k:1, v:"Convoiter",    pp:"convoité",  p:"convoitée",  d:"l'avoir inscrite, au moins" },
  { k:2, v:"Entreprendre", pp:"entrepris", p:"entreprise", d:"l'avoir commencée — renoncer ou accomplir comptent aussi" },
  { k:3, v:"Achever",      pp:"achevé",    p:"achevée",    d:"l'avoir menée au bout — accompli vaut achevé" },
];
const rung = k => RUNGS.find(r => r.k === k) || RUNGS[2];
const reached = (pid, mid) => { const r = ROWS.find(x => x.personId === pid && x.mediaId === mid);
  return r ? (RANK[r.status] || 0) : 0; };
const questById = id => QUESTS.find(q => q.id === id) || null;
const questMedia = q => q.trials.flatMap(t => t.media).filter(m => CATALOG[m]);
/* Jamais stocké : un accomplissement est un calcul, comme tout le reste. */
function questScore(q, pid){
  let done = 0, all = 0;
  for (const t of q.trials) for (const m of t.media){
    if (!CATALOG[m]) continue;
    all++; if (reached(pid, m) >= t.rung) done++;
  }
  return { done, all, ok: all > 0 && done === all };
}
const questHolders = q => Object.values(PEOPLE).filter(p => questScore(q, p.id).ok);
const questsDoneBy = pid => QUESTS.filter(q => questScore(q, pid).ok);
const questsOpenFor = pid => QUESTS.filter(q => { const sc = questScore(q, pid); return !sc.ok && sc.done > 0; })
  .sort((a,b) => questScore(b,ME).done/questScore(b,ME).all - questScore(a,ME).done/questScore(a,ME).all);
const questsInCircle = cid => {
  const ms = membersOf(cid).map(p => p.id);
  return QUESTS.map(q => ({ q, holders: ms.filter(id => questScore(q, id).ok).map(id => PEOPLE[id]) }))
    .filter(x => x.holders.length)
    .sort((a,b) => b.holders.length - a.holders.length
       || a.q.title.localeCompare(b.q.title, "fr"));
};
/* --- La lignée. Une parenté se déclare DES DEUX CÔTÉS : chacun n'écrit que
   dans son fragment, donc un lien n'existe que si les deux l'ont posé. C'est ce
   qui empêche de s'inventer une famille, et c'est encore la même forme que les
   favoris, les surlignages et les quêtes — déclaré chez soi, sommé à la lecture.
   Le mot est au choix de celui qui le pose ; seul son SENS doit s'accorder. --- */
const KIN = {
  pere:   { l:"père",   d: 1 }, mere:  { l:"mère",  d: 1 }, parent:  { l:"parent",  d: 1 },
  fils:   { l:"fils",   d:-1 }, fille: { l:"fille", d:-1 }, enfant:  { l:"enfant",  d:-1 },
  frere:  { l:"frère",  d: 0 }, soeur: { l:"sœur",  d: 0 }, fratrie: { l:"fratrie", d: 0 },
};
const kinOf = pid => ((PEOPLE[pid] || {}).kin || []).filter(k => PEOPLE[k.id] && KIN[k.rel]);
/* Confirmé si les deux déclarations se répondent : « mon fils » appelle
   « mon père », « ma sœur » appelle « mon frère ». Sinon, rien. */
function kinLink(a, b){
  const ra = kinOf(a).find(k => k.id === b), rb = kinOf(b).find(k => k.id === a);
  if (!ra || !rb) return null;
  return KIN[ra.rel].d + KIN[rb.rel].d === 0 ? ra.rel : null;
}
/* La maisonnée n'est pas un objet qu'on possède : c'est la composante connexe
   des liens confirmés. Personne ne la crée, personne ne la détient. */
function household(pid){
  const seen = new Set([pid]), q = [pid], gen = { [pid]: 0 };
  while (q.length){
    const x = q.shift();
    for (const k of kinOf(x)){
      const r = kinLink(x, k.id);
      if (!r || seen.has(k.id)) continue;
      gen[k.id] = gen[x] - KIN[r].d;        /* « mon père » est un cran au-dessus */
      seen.add(k.id); q.push(k.id);
    }
  }
  const ids = [...seen];
  const lo = Math.min(...ids.map(i => gen[i]));
  ids.forEach(i => gen[i] -= lo);
  /* Une maisonnée se lit toujours pareil, quel que soit celui par qui on y
     entre : l'aîné d'abord, puis l'ordre des noms. Sinon le même foyer
     s'appellerait « Nina, Jules et Éliot » ici et « Jules, Éliot et Nina » là. */
  ids.sort((a,b) => gen[a] - gen[b]
    || person(a).firstName.localeCompare(person(b).firstName, "fr"));
  return { ids, gen, size: ids.length };
}
const hasKin = pid => household(pid).size > 1;
/* Ce que la maisonnée a fait ensemble — toujours calculé, jamais rangé. */
function kinDeeds(ids){
  const rs = ROWS.filter(r => ids.includes(r.personId));
  const seen = [...new Set(rs.map(r => r.mediaId))];
  const allDone = mid => ids.every(p => {
    const r = rs.find(x => x.personId === p && x.mediaId === mid);
    return r && (r.status === "completed" || r.status === "mastered"); });
  const by = {};
  rs.filter(r => typeof r.rating === "number").forEach(r => (by[r.mediaId] ||= []).push(r));
  let clash = null;
  for (const [mid, l] of Object.entries(by)){
    if (l.length < 2) continue;
    const hi = l.reduce((m,r) => r.rating > m.rating ? r : m);
    const lo = l.reduce((m,r) => r.rating < m.rating ? r : m);
    if (!clash || hi.rating - lo.rating > clash.d) clash = { id:mid, d:hi.rating - lo.rating, hi, lo };
  }
  return {
    common: seen.filter(allDone),
    works: seen.length,
    hours: rs.reduce((s,r) => s + (r.progress?.unit === "hours" ? r.progress.value : 0), 0),
    chronicles: rs.filter(r => r.review).length,
    quests: QUESTS.filter(q => ids.every(p => questScore(q, p).ok)),
    clash: clash && clash.d > 0 ? clash : null,
  };
}

  sh.quests = (sh.quests || []).filter(q => q.id !== id);

/* --- Titres. L'identité d'une œuvre est son identifiant externe, jamais son
   titre : deux personnes qui portent « Past Lives » et « Nos vies d'avant »
   depuis la source tombent sur le même identifiant, donc sur la même œuvre.
   Reste l'affichage, qui est une préférence de chacun — rangée dans son propre
   fragment, donc transportée d'une machine à l'autre.
   La recherche, elle, interroge TOUJOURS les deux titres : sans ça on ne
   retrouve jamais ce qu'on cherche sous le nom qu'on lui connaît. --- */
const titlePref = () => (PEOPLE[ME]?.prefs?.titles) || "fr";
function titleOf(x){
  const m = typeof x === "string" ? (CATALOG[x] || SOURCE[x]) : x;
  if (!m) return "";
  return (titlePref() === "fr" && m.titleFr) ? m.titleFr : m.title;
}
function otherTitle(x){
  const m = typeof x === "string" ? (CATALOG[x] || SOURCE[x]) : x;
  if (!m || !m.titleFr || m.titleFr === m.title) return null;
  return titlePref() === "fr" ? m.title : m.titleFr;
}
const titlesOf = x => {
  const m = typeof x === "string" ? (CATALOG[x] || SOURCE[x]) : x;
  return [m?.title, m?.titleFr].filter(Boolean);
};
const matchTitle = (x,q) => titlesOf(x).some(t => t.toLowerCase().includes(q));
function setTitlePref(v){
  const sh = SHARDS.find(u => u.user.id === ME);
  sh.user.prefs = { ...(sh.user.prefs||{}), titles:v };
  PEOPLE[ME].prefs = sh.user.prefs;
}
const UNIT_LBL = { hours:"heures", episodes:"épisodes", pages:"pages" };
const slug = t => "local:" + t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,48);

/* --- Écriture. Un seul fragment est touché : le sien. Invariant premier. --- */
function upsertMine(mediaId, patch){
  const sh = SHARDS.find(x => x.user.id === ME);
  const next = { ...(sh.entries[mediaId] || {}), ...patch, at: new Date().toISOString() };
  if (next.rating === null) delete next.rating;
  if (!next.progress || next.progress.value == null) delete next.progress;
  if (!next.review || !next.review.title) delete next.review;
  if (!next.with || !next.with.length) delete next.with;
  sh.entries[mediaId] = next;
  const row = { ...next, mediaId, personId: ME };
  const i = ROWS.findIndex(r => r.personId === ME && r.mediaId === mediaId);
  i >= 0 ? ROWS[i] = row : ROWS.push(row);
}
function removeMine(mediaId){
  const sh = SHARDS.find(x => x.user.id === ME);
  delete sh.entries[mediaId];
  const i = ROWS.findIndex(r => r.personId === ME && r.mediaId === mediaId);
  if (i >= 0) ROWS.splice(i,1);
}

   d'ordre, la seule couleur. Ici un dégradé tient lieu de photographie ;
   dans l'application ce sera l'avatar GitHub du compte. */
function tint(id){
  let h = 0; for (const c of id) h = (h*31 + c.charCodeAt(0)) >>> 0;
  const a = h % 360, b = (a + 38 + (h >> 8) % 60) % 360;
  return `linear-gradient(142deg, hsl(${a} 62% 58%), hsl(${b} 54% 40%))`;
}
function Face(p, size="f-s", link=true){
  const f = `<span class="face ${size}" style="--g:${tint(p.id)}" aria-hidden="true"><span>${p.avatar}</span></span>`;

}

/* Promu ici dès que le registre et les chambres d'ordre en ont eu besoin. */
function Register(rows, { days = true, seen = null } = {}){
  let out = "", last = "";
  rows.forEach((r,i) => {

    if (days && dayKey(r.at) !== last){ out += `<div class="day">${dayName(r.at)}</div>`; last = dayKey(r.at); }
    const fresh = seen && r.at > seen;
    out += `<button class="r r-feed${fresh?" fresh":""}" data-go="#/fiche/${r.mediaId}" ${dly(i)}>
      <span class="d">${dateShort(r.at)}</span>

/* Un ciel qui tombe, le temps de l'entrée. Ce n'est pas la trame d'un Ordre —
   on n'en a pas encore — donc tout est à l'encre : des poussières fixes qui
   respirent, et des étoiles filantes en diagonale. */
function startFalling(cv){
  const ctx = cv.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2);
  let w = 0, h = 0, raf = 0, t = 0, P = [], tid = 0, tries = 0;
  const R = (a=1,b=0) => b + Math.random()*(a-b);
  const size = () => { const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    w = r.width; h = r.height;
    cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0); return true; };
  const dust  = () => ({ c:false, x:R(w), y:R(h*.86), r:R(1.8,.5), ph:R(6.28), sp:R(.045,.013) });
  const fall  = i => ({ c:true, x:R(w*1.3,-w*.3), y:i ? R(h*.7) : R(-60,-760),
                        vx:R(6.8,3.4), vy:R(4.4,2.2), len:R(165,78) });
  const seed = () => { P = [];
    for (let i=0;i<84;i++) P.push(dust());
    for (let i=0;i<7;i++)  P.push(fall(true)); };
  const frame = () => {
    raf = 0; ctx.clearRect(0,0,w,h); t++;
    for (let i=0;i<P.length;i++){
      const p = P[i];
      if (p.c){
        p.x += p.vx; p.y += p.vy;
        if (p.y > h + 90 || p.x > w + 140){ P[i] = fall(0); continue; }
        const tx = p.x - p.vx*p.len/6, ty = p.y - p.vy*p.len/6;
        const g = ctx.createLinearGradient(p.x, p.y, tx, ty);
        g.addColorStop(0, "#141412"); g.addColorStop(1, "transparent");
        ctx.strokeStyle = g; ctx.globalAlpha = .40; ctx.lineWidth = 1.9; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(tx,ty); ctx.stroke();
        ctx.fillStyle = "#141412"; ctx.globalAlpha = .52;
        ctx.beginPath(); ctx.arc(p.x, p.y, 1.9, 0, 6.2832); ctx.fill();
        continue;
      }
      p.ph += p.sp;
      const tw = .10 + .26*(.5 + .5*Math.sin(p.ph));
      ctx.fillStyle = "#141412"; ctx.globalAlpha = tw;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(.75 + .35*tw), 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  };
  const onResize = () => { if (size()) seed(); };
  addEventListener("resize", onResize);
  const attempt = () => { tid = 0;
    if (size()){ seed();
      if (matchMedia("(prefers-reduced-motion: reduce)").matches){ frame(); if (raf) cancelAnimationFrame(raf); raf = 0; }
      else raf = requestAnimationFrame(frame);
      return; }
    if (++tries < 40) tid = setTimeout(attempt, 60); };
  attempt();
  return () => { if (tid) clearTimeout(tid); if (raf) cancelAnimationFrame(raf);
                 removeEventListener("resize", onResize); };
}

/* Changer d'étape, c'est avancer à profondeur égale : le glissement latéral,
   comme les volets d'une feuille. Jamais le zoom — on n'entre nulle part. */
function onbPaint(host, dir){
  host.classList.toggle("at-forge", ONB_STEPS[onbStep] === "forge");
  const tile = host.querySelector(".onb-tile");
  if (dir) slidePane(tile, onbTile(), dir);
  else tile.innerHTML = `<div class="pane">${onbTile()}</div>`;
  const wide = host.querySelector(".onb-wide");
  if (wide){
    wide.innerHTML = onbWide();
    const strip = wide.querySelector("#creedstrip"), rail = wide.querySelector(".creeds-rail i");
    if (strip && rail){
      const track = () => { const m = strip.scrollWidth - strip.clientWidth;
        rail.style.transform = `translateX(${m ? (strip.scrollLeft / m) * 100 : 0}%)`; };
      strip.addEventListener("scroll", track, { passive:true });
      track();
    }
  }
  const dots = host.querySelector(".onb-dots");
  if (dots) dots.innerHTML = ONB_STEPS.map((_,i) =>
    `<span class="${i === onbStep ? "on" : i < onbStep ? "past" : ""}"></span>`).join("");
}

function openOnboarding(){
  onbStep = 0;
  const el = document.createElement("div");
  el.className = "onb curtain";
  el.innerHTML = `
    <button class="onb-x" aria-label="Quitter l'essai">&times;</button>
    <canvas class="onb-fall" aria-hidden="true"></canvas>
    <canvas class="onb-sky" aria-hidden="true"></canvas>
    <div class="onb-name">${[..."Checkpoint"].map((ch,i) =>
      `<i style="--k:${i}">${ch}</i>`).join("")}<u></u></div>
    <div class="onb-stage">
      <div class="onb-tile"></div>
      <div class="onb-wide"></div>
      <div class="onb-dots"></div>
    </div>`;
  document.body.appendChild(el);
  onbPaint(el);
  /* La cité du Registre, en contrebas : on entre dans un endroit, pas dans un
     formulaire. Minuterie et non rAF — un onglet non rendu n'en produit pas. */
  let skyOff = null, fallOff = null;
  setTimeout(() => { skyOff = drawSkyline(el.querySelector(".onb-sky"));
                     fallOff = startFalling(el.querySelector(".onb-fall")); }, 60);
  /* Le nom paraît seul, puis il recule et la tuile arrive. Pas de rAF ici : un
     onglet qui n'est pas rendu n'en produit pas, et le rideau ne se lèverait
     jamais. */
  setTimeout(() => el.classList.remove("curtain"), 1750);

  const close = () => { if (skyOff) skyOff(); if (fallOff) fallOff();
                        el.remove(); removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  addEventListener("keydown", onKey);

  const keep = e => { const f = e.target.closest("[data-onbf]");
                      if (f) onbDraft[f.dataset.onbf] = f.value; };
  el.addEventListener("input", keep);
  el.addEventListener("change", keep);   /* un <select> n'émet pas toujours « input » */
  el.addEventListener("click", e => {
    if (e.target.closest(".onb-x")) return close();
    const t = e.target.closest("[data-onbtone]");
    if (t){ onbDraft.tone = t.dataset.onbtone; onbPaint(el); return; }
    const g = e.target.closest("[data-onbsign]");
    if (g){ onbDraft.sign = g.dataset.onbsign; onbPaint(el); return; }
    const c = e.target.closest("[data-onbcircle]");
    if (c){
      onbDraft.circle = c.dataset.onbcircle;
      /* La couleur naît de la pastille choisie — le même geste que la racine
         des Ordres, sans la navigation qui va avec. */
      if (!REDUCE()){
        const disc = c.querySelector(".disc2"), r = disc.getBoundingClientRect();
        const hex = CIRCLES.find(x => x.id === onbDraft.circle).color;
        const b = document.createElement("div");
        b.className = "burst";
        b.style.cssText = `--c:${hex};left:${r.left + r.width/2}px;top:${r.top + r.height/2}px;
          width:${r.width}px;height:${r.height}px;z-index:401;animation:burst 640ms var(--e) forwards`;
        document.body.appendChild(b);
        setTimeout(() => b.remove(), 680);
      }
      onbPaint(el); return;
    }
    const cr = e.target.closest("[data-creed]");
    if (cr){
      const strip = el.querySelector("#creedstrip");
      const card = strip && strip.querySelector(".creed");
      if (strip && card) strip.scrollBy({ left:(card.offsetWidth + 16) * +cr.dataset.creed, behavior:"smooth" });
      return;
    }
    const n = e.target.closest("[data-onb]");
    if (!n) return;
    if (n.dataset.onb === "done"){
      /* La MÊME onde que les pastilles d'Ordre — celle qu'on voit en entrant
         dans une chambre — simplement plus ample et plus lente. On quitte une
         séquence, pas une page : il faut qu'elle ait le temps de passer.
         Le départ ne dépend pas de l'animation : minuterie, toujours. */
      const c = CIRCLES.find(x => x.id === onbDraft.circle);
      if (!c || REDUCE()){ close(); location.hash = "#/"; return; }
      const r = n.getBoundingClientRect();
      const b = document.createElement("div");
      b.className = "onb-burst";
      b.style.cssText = `--c:${c.color};left:${r.left + r.width/2}px;top:${r.top + r.height/2}px`;
      document.body.appendChild(b);
      /* Un mot porté par l'onde, et par elle seule : il naît avec, il meurt
         avec. Hors de la tuile, puisque la tuile disparaît avant lui. */
      const hail = document.createElement("div");
      hail.className = "onb-hail";
      hail.innerHTML = `<b>Bienvenue dans le codex</b>`;
      document.body.appendChild(hail);
      setTimeout(() => { close(); location.hash = "#/"; }, 820);
      setTimeout(() => { b.remove(); hail.remove(); }, 2000);
      return;
    }
    if (onbStep < ONB_STEPS.length - 1){ onbStep++; onbPaint(el, 1);
      el.querySelector(".onb-stage").scrollTop = 0; }
  });
}

/* ---------- Ce qui s'est passé sans toi ----------
   Ce n'est PAS une notification : il n'y en a pas, et il n'y en aura pas. C'est
   ce que la synchronisation vient de révéler, dit une fois, au moment où l'on
   ouvre. Une quête n'ayant pas de date d'accomplissement — elle se recalcule —
   on la date par la dernière inscription qui l'a scellée. */
function watchLine(){
  const me = person(ME), out = [];
  const msgs = logeOf(me.circle).filter(m => m.at > SEEN && m.personId !== ME);
  if (msgs.length){
    const who = [...new Set(msgs.map(m => person(m.personId).firstName))];
    out.push({ t: msgs.length === 1
        ? `${esc(who[0])} a pris la parole dans ta Loge`
        : `${roman(msgs.length)} paroles nouvelles dans ta Loge, de ${esc(nameList(
            [...new Set(msgs.map(m => m.personId))]))}`,
      loge: me.circle });
  }
  const sealed = q => questMedia(q).reduce((mx, id) => {
    const r = ROWS.find(x => x.personId === ME && x.mediaId === id);
    return r && r.at > mx ? r.at : mx; }, "");
  QUESTS.filter(q => questScore(q, ME).ok && sealed(q) > SEEN)
    .forEach(q => out.push({ t:`Tu as accompli « ${esc(q.title)} »`, go:`#/quete/${q.id}` }));
  /* Et ce qu'une planche à soi devient entre les mains des autres. */
  QUESTS.filter(q => q.personId === ME).forEach(q => {
    const late = questHolders(q).filter(h => h.id !== ME && questMedia(q).some(id => {
      const r = ROWS.find(x => x.personId === h.id && x.mediaId === id);
      return r && r.at > SEEN; }));
    if (late.length) out.push({
      t:`${esc(nameList(late.map(h => h.id)))} ${late.length > 1 ? "ont" : "a"} accompli ta quête « ${esc(q.title)} »`,
      go:`#/quete/${q.id}` });
  });
  /* Et, pour qui tient le greffe, ce qui attend à la porte. Personne n'est
     averti d'une demande — c'est dit dans l'écran d'attente —, donc elle doit
     se voir au seul moment où on regarde quelque chose : l'ouverture. */
  if (isSteward(ME)){
    const nk = KNOCKS.filter(k => k.at > SEEN).length;
    if (nk) out.push({ t: nk === 1 ? `Quelqu'un frappe à la porte`
      : `${roman(nk)} demandes d'entrée attendent au greffe`, go:"#/greffe" });
  }
  if (!out.length) return "";
  /* Une annonce par ligne, et un fanion en guise de tiret : à trois nouvelles
     empilées sur une seule ligne, on n'en lisait aucune. */
  return `<div class="watch" style="--c:${me.circleRef.color}">
    <span class="watch-k">Depuis ta dernière visite</span>
    <div class="watch-l">${out.slice(0,4).map(a =>
      `<button ${a.loge ? `data-tologe="${a.loge}"` : `data-go="${a.go}"`}>
        <svg class="watch-f" viewBox="0 0 14 14" aria-hidden="true">
          <path d="M3 1.4 V12.6" /><path d="M3.9 2.1 L11.4 4.6 L3.9 7.1 Z" class="fl" /></svg>
        <span>${a.t}</span></button>`).join("")}</div>
  </div>`;
}

  const tabs = [[null,"Tout",all.length],["game","Jeux",cnt("game")],["film","Films",cnt("film")],["series","Séries",cnt("series")],["book","Livres",cnt("book")]]
    .map(([k,l,n]) => `<button data-kind="${k ?? ""}" class="${kind===k?"on":""}">${l}<span class="n">${n}</span></button>`).join("");

  const rows = list.map((id,i) => {
    const m = CATALOG[id], rs = rowsFor(id).filter(r => r.status !== "wishlist");
    const a = avgOf(rs), ms = myStatus(id);
    return `<button class="r r-cat" data-go="#/fiche/${id}" ${dly(i)}>
      <span class="own ${ms?SC[ms]:"own-none"}" title="${ms?STATUS[m.mediaType][ms]:"Rien de toi"}"></span>
      <span class="line" style="flex-direction:column;align-items:flex-start;gap:1px">
        <span class="ttl">${esc(titleOf(m))}</span>
        <span class="mt">${KIND[m.mediaType]} · ${m.year} · ${m.genres.join(", ")}</span></span>
      <span class="stack">${rs.slice(0,5).map(r => Face(person(r.personId),"f-xs",false)).join("")}</span>
      <span class="mt">${roman(rs.length)}</span>
      <span class="sc${a===null?" nil":""}">${a===null?"—":dec(a)}</span>
    </button>`;
  }).join("");
  return `<div class="wrap">
    <div class="eyebrow">Les Œuvres</div>
    <h1 style="margin-top:8px">${roman(list.length)} au corpus</h1>
    <p class="lede">Le corpus n'existe que parce que quelqu'un l'y a porté.</p>
    <div class="filt">${tabs}<button class="add-inline" data-inscribe>＋ Inscrire</button></div>
    <div class="filt filt-2"><span class="filt-k">Ordonner par</span>${sorts}
      <span class="filt-k vsep">Vue</span>${views}</div>
    ${workView === "jq"
      ? `<div class="jqs casc">${list.map((id,i) => Cover(id,i)).join("")}</div>`
      : `<div class="reg casc">${rows}</div>`}
    <p class="legend">${workView === "jq"
      ? `Faute de jaquette, le cadre porte le titre. La couleur revient au survol ; la marque en haut à gauche dit où <em>tu</em> en es.`
      : `La marque en tête de ligne dit où <em>tu</em> en es.`}</p>
  </div>`;
};

/* ---------- La fiche ---------- */
V.folio = id => {
  const m = work(id);
  if (!m) return `<div class="wrap"><p class="none">Œuvre absente du corpus.</p></div>`;
  const rs = rowsFor(id), rated = rs.filter(r => typeof r.rating === "number");
  const a = avgOf(rs), mine = myRow(id);
  const spread = rated.length > 1 ? Math.max(...rated.map(r=>r.rating)) - Math.min(...rated.map(r=>r.rating)) : 0;

  /* La forme du désaccord : un trait par jugement sur la réglette de I à X.
     Rien de plus qu'une règle graduée et des visages — aucune couleur. */
  const plot = rated.length > 1 ? `<div class="plot">
      <div class="plot-cols">${Array.from({length:10},(_,k) => {
        const n = k+1, hits = rated.filter(r => r.rating === n);
        return `<div class="pc ${hits.length?"has":""}">
          <span class="pf">${hits.map(r => Face(person(r.personId),"f-xs")).join("")}</span>
          <span class="pt"></span><span class="pn">${n}</span></div>`;
      }).join("")}</div>
      <div class="plot-avg" style="left:${((a-1)/9*100).toFixed(2)}%"><span>${dec(a)}</span></div>
    </div>` : "";

  const ledger = rs.map((r,i) => {
    const p = person(r.personId);
    return `<a class="r r-grp${r.personId===ME?" is-me":""}" href="#/personne/${p.id}" ${dly(i)}>
      ${Face(p,"f-s",false)}
      <span class="line"><span class="who">${esc(p.firstName)}</span>
        <span class="vb">${esc(p.circleRef.one)}${r.progress ? " · " + prog(r) : ""}${(r.plays||1)>1 ? " · " + roman(r.plays) + " fois" : ""}</span>
        ${withOf(r).length ? `<span class="stack">${withOf(r).map(q => Face(q,"f-xs",false)).join("")}</span>` : ""}</span>
      ${St(id,r.status)}${Sco(r)}</a>`;
  }).join("");

  const scrolls = rs.filter(r => r.review).map((r,i) => {
    const p = person(r.personId);
    return `<div class="chron" ${dly(i)}>
      <button class="chronH" data-open="1">
        ${Face(p,"f-s",false)}
        <span><span class="ti">${esc(r.review.title)}</span>
          <span class="au">${esc(p.firstName)} · ${typeof r.rating==="number"?r.rating+"/10":"sans jugement"} · ${ago(r.at)}</span></span>
        <span class="mk">›</span></button>
      <div class="chronB"><div>${r.review.body.split("\n\n").map(x=>`<p class="read">${esc(x)}</p>`).join("")}</div></div>
    </div>`;
  }).join("") || `<p class="none">Nul n'a encore écrit sur cette œuvre.</p>`;

  return `<div class="wrap folio-w">
    ${m.cover ? `<div class="folio-wash" style="--img:url('${esc(m.cover)}')" aria-hidden="true"></div>` : ""}
    <header class="sheetH folioH">
      <div>
      <span class="eyebrow">${KIND[m.mediaType]} · ${m.year}</span>
      <h1>${esc(titleOf(m))}</h1>
      ${otherTitle(m)?`<span class="alt-t">${esc(otherTitle(m))}</span>`:""}
      <span class="mt">${m.genres.length?m.genres.join(" · "):"sans genre consigné"}</span>
      <div class="meas">
        <div><span class="k">Jugement moyen</span><span class="v">${a===null?"—":dec(a)}</span></div>
        <div><span class="k">Témoins</span><span class="v">${roman(rs.length)}</span></div>
        <div><span class="k">Discorde</span><span class="v">${spread?roman(spread):"—"}</span></div>
      </div>
      ${spread >= 4 ? `<p class="disc">Les Ordres ne s'accordent pas sur cette œuvre.</p>` : ""}
      </div>
      <button class="folio-plate" data-plate="${id}" aria-label="Agrandir la jaquette">
        ${CoverArt(id, { marks:false })}
        <span class="plate-hint">Cliquer pour agrandir</span>
      </button>
    </header>
    ${plot ? `<div class="sect"><h2>La forme du désaccord</h2>${plot}</div>` : ""}
    <div class="sect"><h2>Ta position</h2>
      <div id="minebox">${mineBox(id)}</div>
    </div>
    <div class="sect"><h2>Les jugements</h2><div class="reg casc">${ledger}</div></div>
    ${(() => {
      const withSt = rs.filter(r => checkpointsOf(r).length);
      if (!withSt.length) return "";
      return `<div class="sect"><h2>Checkpoints</h2>
        <p class="legend" style="margin:-6px 0 14px">Des pensées prises en chemin. Elles ne valent pas jugement.</p>
        <div class="stations casc">${withSt.map((r,i) => {
          const pr = person(r.personId);
          return `<div class="stn" ${dly(i)}>
            <div class="stn-h">${Face(pr,"f-s",false)}<b>${esc(pr.firstName)}</b>
              <span class="kind">${St(id,r.status)}</span></div>
            <ol class="stn-l">${checkpointsOf(r).map(x => `<li>
              <span class="stn-d">${dateShort(x.at)}</span>
              <span class="stn-t">${esc(x.text)}</span></li>`).join("")}</ol>
          </div>`;
        }).join("")}</div></div>`;
    })()}
    <div class="sect"><h2>Chroniques</h2><div class="casc">${scrolls}</div></div>
  </div>`;
};

/* Ta position sur une fiche : extrait pour pouvoir être rejoué seul quand on
   distingue l'œuvre ou qu'on ajoute un passage — rien d'autre n'a bougé. */
function mineBox(id){
  const mine = myRow(id);
  if (!mine) return `<div class="mine-box empty"><span class="mt">Tu n'as rien dit de cette œuvre.</span>
    <button class="btn-main" data-edit="${id}">T'inscrire</button></div>`;
  const fav = isFav(id), rank = favsOf(ME).indexOf(id) + 1;
  return `<div class="mine-box">
    <div class="mine-l">${St(id,mine.status)}${Sco(mine)}
      ${prog(mine)?`<span class="mt">${prog(mine)}</span>`:""}
      ${(mine.plays||1) > 1 ? `<span class="mt">${roman(mine.plays)} fois</span>` : ""}
      ${withOf(mine).length ? `<span class="mt">avec ${withOf(mine).map(q=>esc(q.firstName)).join(", ")}</span>` : ""}
      ${fav ? `<span class="mt">distinguée au ${rank === 1 ? "premier rang" : roman(rank) + "<sup>e</sup> rang"}</span>` : ""}
      <span class="mt">consigné ${ago(mine.at)}</span></div>
    ${mine.review?`<div class="mine-r"><span class="ti">${esc(mine.review.title)}</span></div>`:""}
    ${favEligible(id) ? `<button class="btn-tiny${fav?" on":""}" data-fav="${id}"
      title="${fav?"Retirer des favoris":"Compter parmi tes favoris, indépendamment de la note"}">${fav?"◆":"◇"} Favori</button>` : ""}
    ${["completed","mastered"].includes(mine.status)
      ? `<button class="btn-tiny" data-replay="${id}" title="Ajouter un passage au compteur">＋ Refait</button>` : ""}
    <button class="btn-ghost" data-edit="${id}">Modifier</button>
  </div>`;
}

/* ---------- Distinctions : favoris et magnum opus ----------
   Les jaquettes sont ici chez elles : une distinction se montre, elle ne se
   lit pas. Noir et blanc jusqu'au survol, comme partout ailleurs. */
const standing = (mid,pid) => {
  const r = ROWS.find(x => x.personId === pid && x.mediaId === mid);
  if (!r) return "";
  return STATUS[work(mid).mediaType][r.status]
    + (typeof r.rating === "number" ? " · " + r.rating + "/10" : " · sans jugement");
};
function favCard(mid, i, { rank = null, self = false, pid = null, holders = null, last = false } = {}){
  const m = work(mid);
  return `<div class="fv" ${dly(i)}>
    <button class="fv-go" data-go="#/fiche/${mid}" aria-label="${esc(titleOf(m))}">${CoverArt(mid, { marks:false })}</button>
    <span class="fv-l">${rank ? `<span class="fv-rk">${roman(rank)}</span>` : ""}
      ${m.cover ? `<span class="fv-t">${esc(titleOf(m))}</span>` : ""}
      <span class="fv-s">${holders ? holders.map(p => esc(p.firstName)).join(" · ")
        : (pid ? esc(standing(mid,pid)) : KIND[m.mediaType])}</span></span>
    ${self ? `<span class="fv-act">
      <button data-favmv="${mid}:-1" aria-label="Monter d'un rang" title="Monter d'un rang">&uarr;</button>
      ${last ? "" : `<button data-favmv="${mid}:1" aria-label="Descendre d'un rang" title="Descendre d'un rang">&darr;</button>`}
      <button data-favdel="${mid}" aria-label="Retirer la distinction" title="Retirer">&times;</button>
    </span>` : ""}
  </div>`;
}

/* ---------- Les Quêtes ----------
   Une quête s'affiche en PANCARTE : une planche plantée, pas une jaquette.
   L'œuvre a une image, la quête n'en a pas — elle a un nom et une promesse.
   On la lit de loin ; on ne voit ses conditions qu'en s'approchant. */
let questFilter = "all";

function Sign(q, i, { force = null } = {}){
  const sc = questScore(q, ME), ok = force === null ? sc.ok : force;
  const by = person(q.personId), hold = questHolders(q).length;
  const tilt = [-1.1, .8, -.5, 1.2, -.9, .6][i % 6];
  return `<button class="sign${ok?" done":""}" data-go="#/quete/${q.id}" style="--tilt:${tilt}deg" ${dly(i)}>
    <span class="plank">
      <span class="sign-k">${ok ? "Accomplie" : "Quête"}</span>
      <span class="sign-t">${esc(q.title)}</span>
      ${q.line ? `<span class="sign-l">${esc(q.line)}</span>` : ""}
      <span class="sign-f">
        <span>${roman(questMedia(q).length)} œuvre${questMedia(q).length>1?"s":""}</span>
        <span>${hold ? roman(hold) + (hold>1?" âmes":" âme") : "nul encore"}</span>
      </span>
      ${ok ? "" : `<span class="sign-bar"><i style="width:${sc.all?Math.round(100*sc.done/sc.all):0}%"></i></span>
        <span class="sign-st">${sc.done ? roman(sc.done) + " sur " + roman(sc.all) : "aucune des " + roman(sc.all)}</span>`}
    </span>
    <span class="post"></span>
    <span class="sign-by">ouverte par ${esc(by ? by.firstName : "—")}</span>
  </button>`;
}

V.quests = () => {
  const mine = questsDoneBy(ME).map(q => q.id);
  const list = questFilter === "done" ? QUESTS.filter(q => mine.includes(q.id))
    : questFilter === "way" ? questsOpenFor(ME)
    : [...QUESTS].sort((a,b) => b.at.localeCompare(a.at));
  return `<div class="wrap">
    <div class="eyebrow">Les Quêtes</div>
    <h1 style="margin-top:8px">${roman(QUESTS.length)} planches au carrefour</h1>
    <p class="lede">Une quête est un vœu que quelqu'un a planté là : des œuvres, et un palier à atteindre sur chacune. Nul ne la valide — <strong>elle s'accomplit toute seule</strong>, à mesure que ton registre avance.</p>
    <div class="filt">
      <button data-qf="all" class="${questFilter==="all"?"on":""}">Toutes<span class="n">${roman(QUESTS.length)}</span></button>
      <button data-qf="done" class="${questFilter==="done"?"on":""}">Accomplies<span class="n">${roman(mine.length)}</span></button>
      <button data-qf="way" class="${questFilter==="way"?"on":""}">En chemin<span class="n">${roman(questsOpenFor(ME).length)}</span></button>
      <button class="add-inline" data-newquest>＋ Ouvrir une quête</button>
    </div>
    ${list.length ? `<div class="signs casc">${list.map((q,i) => Sign(q,i)).join("")}</div>`
      : `<p class="none">${questFilter==="done" ? "Tu n'as encore accompli aucune quête." : "Rien par ici."}</p>`}
  </div>`;
};

V.quest = id => {
  const q = questById(id);
  if (!q) return `<div class="wrap"><p class="none">Cette planche a été arrachée.</p></div>`;
  const by = person(q.personId), sc = questScore(q, ME), hold = questHolders(q);
  return `<div class="wrap">
    <button class="back" data-go="#/quetes">← Les Quêtes</button>
    <header class="sheetH">
      <span class="eyebrow">Quête · ouverte par ${esc(by ? by.firstName : "—")} · ${dateShort(q.at)}</span>
      <h1>${esc(q.title)}</h1>
      ${q.line ? `<p class="lede">${esc(q.line)}</p>` : ""}
      <div class="meas">
        <div><span class="k">Ta progression</span><span class="v">${roman(sc.done)} / ${roman(sc.all)}</span></div>
        <div><span class="k">Accomplie par</span><span class="v">${hold.length?roman(hold.length):"—"}</span></div>
        <div><span class="k">Épreuves</span><span class="v">${roman(q.trials.length)}</span></div>
      </div>
      ${sc.ok ? `<p class="disc">Tu l'as accomplie.</p>` : ""}
    </header>
    ${q.trials.map((t,ti) => {
      const r = rung(t.rung), got = t.media.filter(m => CATALOG[m] && reached(ME,m) >= t.rung).length;
      return `<div class="sect"><h2>Avoir ${r.pp} — ${roman(got)} sur ${roman(t.media.filter(m=>CATALOG[m]).length)}</h2>
        <p class="legend" style="margin:-6px 0 12px">${esc(r.d)}</p>
        <div class="reg casc">${t.media.filter(m => CATALOG[m]).map((m,i) => {
          const hit = reached(ME,m) >= t.rung, mr = myRow(m);
          return `<a class="r qw${hit?" hit":""}" href="#/fiche/${m}" ${dly(i)}>
            <span class="qw-m">${hit?"✓":"·"}</span>
            <span class="line"><span class="t">${esc(titleOf(m))}</span>
              <span class="kind">${KIND[work(m).mediaType]} · ${work(m).year}</span></span>
            <span class="kind">${mr ? STATUS[work(m).mediaType][mr.status] : "rien d'inscrit"}</span></a>`;
        }).join("")}</div></div>`;
    }).join("")}
    <div class="sect"><h2>Qui l'a accomplie</h2>
      ${hold.length ? `<div class="troop casc">${hold.map((p,i) => `<a class="sold" href="#/personne/${p.id}" ${dly(i)}>
        ${Face(p,"f-m",false)}<b>${esc(p.firstName)}</b><i>${esc(p.circleRef.one)}</i></a>`).join("")}</div>`
        : `<p class="none">Personne, pour l'instant. La planche attend.</p>`}
    </div>
    ${q.personId === ME ? `<div class="sect"><button class="btn-ghost" data-qdel="${q.id}">Arracher cette planche</button>
      <p class="legend">Elle est dans ton fragment : toi seul peux la retirer, et elle disparaîtra pour tout le monde.</p></div>` : ""}
  </div>`;
};

/* ---------- Le Greffe ---------- */
/* Ce qui demande une autorité, et rien d'autre. Les préférences et les outils
   de dépannage ne demandent qu'un endroit calme : ils vivent au pied de sa
   propre feuille. UNE AUTORITÉ N'EST PAS UNE DISCRÉTION — les confondre
   donnerait un panneau où une préférence d'affichage côtoie une exclusion. */

/* Ce qui vient d'être fait, et quand ça prendra effet. Un alias s'applique À
   LA LECTURE : prétendre qu'il replie les inscriptions à l'instant serait
   mentir sur l'architecture, et c'est justement ce qu'il faut qu'on voie. */
let grNote = "";
const act = (kind, what, note) => { ACTS.unshift({ at:new Date().toISOString(), by:ME, kind, what, note }); };
/* Un guichet se repeint sur place. Pas de bascule de mise au point : rien
   n'a changé de profondeur, on est resté au même endroit — et l'invariant
   dit qu'un zoom annonce une descente. Ce qui donne le retour, c'est la
   ligne qui disparaît et le journal qui en gagne une. */
/* « Nathan et Marion et Théo » ne se dit pas — même raison que l'élision de
   `de` : l'énumération fait partie du ton. */
const stewNames = bold => { const n = stewards().map(id => {
    const nm = esc(person(id) ? person(id).firstName : id); return bold ? `<b>${nm}</b>` : nm; });
  return n.length < 2 ? (n[0] || "personne") : n.slice(0,-1).join(", ") + " et " + n[n.length-1]; };

function regreffe(){
  const l = document.querySelector("#stage .layer:last-child");
  if (l) l.innerHTML = V.greffe();
  chrome(location.hash || "#/");
}

V.greffe = () => {
  /* La porte n'est pas fermée : elle n'existe pas pour qui n'a pas la charge.
     Et si quelqu'un tape l'adresse, on le lui dit sans cérémonie — ce n'est
     pas un secret, c'est une charge qu'il ne tient pas. */
  if (!isSteward(ME)) return `<div class="wrap gr-shut">
    <div class="eyebrow">Le Greffe</div>
    <h1 style="margin-top:8px">Tu ne tiens pas le greffe</h1>
    <p class="lede">Ce n'est pas une pièce fermée, c'est une charge — et elle se lit dans l'organisation, pas dans une liste de l'application. ${stewards().length ? `Elle est tenue par ${stewNames(false)}.` : ""}</p>
    <p class="legend">Rien ne s'y décide en coulisse : tout acte de greffier paraît dans l'historique du dépôt, que tout le monde lit.</p>
    <button class="btn-ghost" data-bench-role="admin" style="margin-top:22px">⌁ Banc d'essai — reprendre la charge</button>
  </div>`;

  const dups = suspected(), al = aliasList();
  const nk = KNOCKS.length;
  return `<div class="wrap">
    <div class="eyebrow">Le Greffe</div>
    <h1 style="margin-top:8px">${nk ? `${roman(nk)} ${nk>1?"coups":"coup"} à la porte` : "Personne à la porte"}</h1>
    <p class="lede">Tu tiens le registre : tu admets, tu fonds les doublons, tu passes la charge. <strong>Rien de plus</strong> — il n'y a pas de modération ici, et il n'y en aura pas : on n'a pas accès en écriture au fichier d'un autre.</p>
    <p class="legend gr-open">Et rien n'y est en coulisse : chaque acte paraît dans l'historique du dépôt, que les ${roman(Object.keys(PEOPLE).length)} membres lisent.</p>
    ${grNote ? `<p class="gr-note">${grNote}</p>` : ""}

    <div class="sect"><h2>Les admissions</h2>
      <p class="legend" style="margin:-6px 0 14px">Une demande est une issue du dépôt public — le seul geste qu'un compte étranger puisse faire. <strong>Personne n'en est averti</strong> : elles attendent ici qu'on ouvre l'application.</p>
      ${nk ? `<div class="gr-ks casc">${KNOCKS.map((k,i) => {
        const v = vouchedBy(k);
        return `<div class="gr-k" ${dly(i)}>
          <div class="gr-k-l">
            <span class="gr-login">@${esc(k.login)}</span>
            <span class="gr-nm">${k.firstName ? esc(k.firstName) : `<i>sans prénom</i>`}</span>
            <span class="kind">${ago(k.at)}</span>
          </div>
          <div class="gr-k-v">
            ${v ? `<span class="gr-v">${Face(v,"f-s",false)}<span>se réclame de <b>${esc(v.firstName)}</b>${k.vouchedAs?` — <i>${esc(k.vouchedAs)}</i>`:""}</span></span>`
              : v === false ? `<span class="gr-no">⚠ se réclame de « ${esc(k.vouchedName)} » — aucun membre de ce nom</span>`
              : `<span class="gr-no">⚠ ne se réclame de personne</span>`}
            ${k.discord ? `<span class="kind">discord · ${esc(k.discord)}</span>`
              : `<span class="kind gr-dim">aucune adresse laissée</span>`}
          </div>
          <div class="gr-k-a">
            <button class="btn-tiny" data-admit="${k.id}">Admettre</button>
            <button class="btn-ghost" data-shun="${k.id}">Écarter</button>
          </div>
        </div>`;
      }).join("")}</div>
      <p class="legend gr-what"><b>Admettre</b> fait trois choses, et on les dit : le compte entre dans l'organisation, son fragment est créé vide, l'acte est inscrit au journal. <b>Écarter</b> ferme l'issue et n'inscrit rien d'autre — on n'ouvre aucune liste noire.</p>`
      : `<p class="none">Personne à la porte. C'est l'état normal.</p>`}
    </div>

    <div class="sect"><h2>Les doublons</h2>
      <p class="legend" style="margin:-6px 0 14px">Deux personnes inscrivent la même œuvre à la main, et le catalogue en porte deux. <strong>Fondre n'est pas réécrire</strong> : leurs fichiers sont hors d'atteinte. Tu déclares un alias dans le tien, et il s'applique à la lecture — comme un favori, comme un surlignage.</p>
      ${dups.length ? `<div class="gr-ds">${dups.map(d => `<div class="gr-d">
        <div class="gr-d-p">
          <span class="gr-keep"><b>${esc(titleOf(d.keep))}</b><i>${KIND[CATALOG[d.keep].mediaType]} · ${CATALOG[d.keep].year} · ${esc(d.keep)}</i></span>
          <span class="gr-arr">←</span>
          <span class="gr-drop">${d.drop.map(x => `<b>${esc(titleOf(x))}</b><i>${esc(x)}${CATALOG[x].manual?" · inscrit à la main":""}</i>`).join("")}</span>
        </div>
        <button class="btn-tiny" data-fold="${d.drop[0]}:${d.keep}">Fondre</button>
      </div>`).join("")}</div>`
      : `<p class="none">Aucun rapprochement de titres. Le catalogue est net.</p>`}
      ${al.length ? `<div class="gr-al"><div class="lbl">Alias déclarés</div>
        ${al.map(a => `<div class="gr-a">
          <span><b>${esc(CATALOG[a.from] ? titleOf(a.from) : a.from)}</b> <span class="kind">${esc(a.from)}</span> → <b>${esc(CATALOG[a.to] ? titleOf(a.to) : a.to)}</b> <span class="kind">${esc(a.to)}</span></span>
          <button class="btn-ghost" data-unfold="${a.from}">Défaire</button></div>`).join("")}
        <p class="legend">Une déclaration se retire. <strong>Rien ici n'efface quoi que ce soit</strong> — et c'est la seule garantie qui tienne quand on se trompe.</p></div>` : ""}
    </div>

    <div class="sect"><h2>Le journal</h2>
      <div class="gr-js">${ACTS.map(a => { const by = person(a.by);
        return `<div class="gr-j">
          <span class="gr-j-d">${dateShort(a.at)}</span>
          <span class="gr-j-k">${ACT_L[a.kind] || a.kind}</span>
          <span class="gr-j-w"><b>${esc(person(a.what) ? person(a.what).firstName : a.what)}</b>${a.note?` <i>${esc(a.note)}</i>`:""}</span>
          <span class="gr-j-b">${by ? Face(by,"f-s",false) : ""}<span class="kind">${esc(by?by.firstName:a.by)}</span></span>
        </div>`; }).join("")}</div>
    </div>

    <div class="sect"><h2>La charge</h2>
      <p class="legend" style="margin:-6px 0 14px">Tenue par ${stewNames(true)}. La passer change un rôle dans l'organisation GitHub — <strong>il n'y a pas d'administrateur du côté de l'application</strong>, et c'est ce qui empêche une autorité fictive de s'y installer.</p>
      <div class="gr-pass">
        <select class="gr-sel" data-pass-sel>
          <option value="">Confier le greffe à…</option>
          ${Object.values(PEOPLE).filter(p => !isSteward(p.id)).map(p => `<option value="${p.id}">${esc(p.firstName)} — ${esc(p.circleRef.one)}</option>`).join("")}
        </select>
        <button class="btn-tiny" data-pass>Confier</button>
      </div>
    </div>

    <div class="sect gr-bench"><h2>⌁ Banc d'essai</h2>
      <p class="legend">Cette section disparaîtra au portage, comme l'onglet Onboarding. Elle sert à voir l'application <i>sans</i> la charge : l'entrée du Greffe ne doit pas être grisée, elle doit être <strong>absente</strong>.</p>
      <button class="btn-ghost" data-bench-role="member">Rendre la charge et voir l'absence</button>
    </div>
  </div>`;
};

/* ---------- Les Ordres ---------- */
/* La chambre a quatre volets. Le mouvement y est LATÉRAL, comme sur une feuille
   de personnage : changer d'onglet n'est pas descendre d'un cran. */
const ORDER_TABS = ["chamber","annals","magnum","quests","loge"];
let orderTab = "chamber", orderId = null, logeReply = null;

function paneChamber(c){
  const ms = membersOf(c.id);
  const rows = ROWS.filter(inCircle(c.id));
  const t = temper(rows), par = partisan(c.id);
  const traits = [
    t.sev === null ? null : {
      k:"Sévérité", v:signed(t.sev),
      d: Math.abs(t.sev) < .25 ? "juge comme l'ensemble"
         : t.sev < 0 ? "juge plus durement que les autres Ordres"
                     : "juge plus généreusement que les autres Ordres" },
    { k:"Achèvement", v:pct(t.rate),
      d:`contre ${pct(t.grate)} pour l'ensemble — ${t.rate >= t.grate ? "cet Ordre va au bout" : "cet Ordre se lasse"}` },
    t.pref ? { k:"Prédilection", v:KINDS[t.pref], d:`c'est ce que cet Ordre fréquente le plus` } : null,
    { k:"Volume", v:roman(rows.filter(r=>r.status!=="wishlist").length), d:"œuvres fréquentées" },
  ].filter(Boolean);
  return `<div class="traits casc">${traits.map((x,i) => `<div class="tr" ${dly(i)}>
      <span class="k">${x.k}</span><span class="v">${x.v}</span><span class="d">${x.d}</span></div>`).join("")}</div>
    ${par ? `<button class="banner" data-go="#/fiche/${par.id}">
      <span class="k">Ce que cet Ordre défend</span>
      <span class="t">${esc(titleOf(work(par.id)))}</span>
      <span class="d">${dec(par.mine)} ici, contre ${dec(par.theirs)} ailleurs. Un écart de ${dec(par.d)}.</span>
    </button>` : ""}
    <div class="sect"><h2>${roman(ms.length)} membres</h2>
      <div class="troop casc">${ms.map((p,i) => `<a class="sold" href="#/personne/${p.id}" ${dly(i)}>
        ${Face(p,"f-m",false)}<b>${esc(p.firstName)}</b><i>${esc(p.handle)}</i></a>`).join("")}</div></div>`;
}

function paneAnnals(c){
  const acts = register(inCircle(c.id)).slice(0,14);
  return acts.length ? Register(acts, { seen:SEEN }) : `<p class="none">Rien de récent.</p>`;
}

/* Le magnum opus n'est pas un classement : c'est une somme de déclarations.
   Si aucune œuvre ne réunit deux voix, on ne feint pas l'unanimité — on le dit
   et on montre ce que chacun défend. */
function paneMagnum(c){
  const l = magnum(c.id);
  if (!l.length) return `<p class="none">Cet Ordre n'a encore rien distingué.</p>`;
  const head = l[0].holders.length > 1 ? l[0] : null;
  const rest = head ? l.slice(1) : l;
  return `${head ? `<div class="mag">
      <button class="mag-art" data-go="#/fiche/${head.id}" aria-label="${esc(titleOf(head.id))}">
        ${CoverArt(head.id, { marks:false })}</button>
      <div class="mag-x">
        <span class="eyebrow">Le magnum opus de l'Ordre</span>
        <span class="mag-t">${esc(titleOf(head.id))}</span>
        <span class="kind">${KIND[work(head.id).mediaType]} · ${work(head.id).year}${head.avg!==null?" · jugé "+dec(head.avg)+" ici":""}</span>
        <div class="mag-who">${head.holders.map(p => `<a class="sold sold-s" href="#/personne/${p.id}">
          ${Face(p,"f-m",false)}<b>${esc(p.firstName)}</b></a>`).join("")}</div>
        <p class="mag-d">${head.holders.length === membersOf(c.id).length
          ? "L'Ordre entier la porte dans ses distinctions."
          : `${roman(head.holders.length)} des ${roman(membersOf(c.id).length)} âmes de l'Ordre la portent dans leurs distinctions.`}
          C'est le seul endroit de l'application où un accord se déclare au lieu d'être calculé.</p>
      </div></div>` : `<p class="legend" style="margin:0 0 20px">Aucune œuvre ne réunit encore deux voix dans cet Ordre. Voici ce que chacun défend, pour lui seul.</p>`}
    ${rest.length ? `<div class="jqs favs casc">${rest.map((x,i) =>
      favCard(x.id, i, { holders:x.holders })).join("")}</div>` : ""}
    <p class="legend">Une distinction ne dépend d'aucune note : chacun en porte douze au plus, et peut y mettre une œuvre qu'il n'a pas finie.</p>`;
}

/* Un fil de conversation, pas un forum : dense, dans le sens du temps, ouvert
   en bas — c'est là qu'est le présent. Rien ne pousse pour autant : sans
   serveur, un message paraît chez les autres à leur synchronisation suivante,
   et l'interface l'écrit plutôt que de laisser croire à un direct. */
const hhmm = i => new Intl.DateTimeFormat("fr",{hour:"2-digit",minute:"2-digit"}).format(new Date(i));
let logeFold = false, logeJump = null, logeRef = null;

/* Une liste déroulante de cent entrées n'est pas un choix, c'est une épreuve.
   On cherche, on voit la jaquette, on retire d'un geste. */
function mentionRows(cid, q){
  const term = (q || "").toLowerCase().trim();
  if (term.length < 2) return "";
  const l = [...new Set(ROWS.filter(inCircle(cid)).map(r => r.mediaId))]
    .filter(id => matchTitle(id, term))
    .sort((a,b) => titleOf(a).localeCompare(titleOf(b),"fr")).slice(0,6);
  if (!l.length) return `<span class="mention-none">Rien sous ce nom dans l'Ordre.</span>`;
  return l.map(id => { const m = CATALOG[id];
    return `<button type="button" class="mention-r" data-mpick="${id}">
      ${CoverArt(id,{marks:false})}<b>${esc(titleOf(m))}</b>
      <span class="kind">${KIND[m.mediaType]} · ${m.year}</span></button>`; }).join("");
}
function mentionHTML(cid){
  if (logeRef && CATALOG[logeRef]) return `<span class="mention-on">
    ${CoverArt(logeRef,{marks:false})}<b>${esc(titleOf(logeRef))}</b>
    <button type="button" class="btn-tiny" data-mclear="1">Retirer</button></span>`;
  return `<span class="mention">
    <input type="text" data-mq="${cid}" placeholder="Chercher une œuvre de l'Ordre" autocomplete="off">
    <span class="mention-res" id="mres"></span></span>`;
}
function paintMention(){
  const box = document.querySelector(".cmp-ref");
  if (box) box.innerHTML = `<span class="cmp-k">Joindre une œuvre</span>${mentionHTML(orderId)}`;
}

function logeLine(m, prev, cid){
  const p = person(m.personId);
  /* Deux messages de suite du même auteur à moins d'un quart d'heure ne
     réécrivent pas son nom : c'est ce qui fait la densité d'un fil. */
  const grouped = prev && prev.personId === m.personId
    && new Date(m.at) - new Date(prev.at) < 900000;
  const mk = markers(m.id), rp = m.replyTo && postById(m.replyTo);
  return `<div class="lg-m${grouped?" cont":""}${mk.length?" lit-m":""}${m.at>SEEN?" fresh":""}" data-post="${m.id}">
    <span class="lg-av">${grouped ? "" : Face(p,"f-s",false)}</span>
    <div class="lg-c">
      ${grouped ? "" : `<span class="lg-w"><b>${esc(p.firstName)}</b><span class="lg-h">${hhmm(m.at)}</span>
        ${mk.length ? `<span class="lg-mk" title="Surligné par ${mk.map(x=>esc(x.firstName)).join(", ")}">surligné${mk.length>1?" ×"+mk.length:""}</span>` : ""}</span>`}
      ${rp ? `<span class="lg-q" data-jump="${rp.id}">↩ ${esc(person(rp.personId).firstName)} — « ${esc(rp.body.slice(0,74))}${rp.body.length>74?"…":""} »</span>` : ""}
      <p class="lg-b">${esc(m.body)}</p>
      ${m.ref && CATALOG[m.ref] ? `<button class="lg-ref" data-go="#/fiche/${m.ref}">
        ${CoverArt(m.ref, { marks:false })}<b>${esc(titleOf(m.ref))}</b>
        <span class="kind">${KIND[work(m.ref).mediaType]} · ${work(m.ref).year}</span></button>` : ""}
    </div>
    <span class="lg-a">
      <button data-mark="${m.id}" class="${isMarked(m.id)?"on":""}"
        aria-label="${isMarked(m.id)?"Retirer ton surlignage":"Surligner ce message"}"
        title="${isMarked(m.id)?"Retirer ton surlignage":"Surligner — il restera visible une fois le fil replié"}">${isMarked(m.id)?"▮":"▯"}</button>
      <button data-reply="${m.id}" aria-label="Répondre" title="Répondre">↩</button>
      ${m.personId === ME ? `<button data-drop="${m.id}" aria-label="Retirer" title="Retirer">×</button>` : ""}
    </span>
  </div>`;
}

function paneLoge(c){
  /* Le refus tutoie-t-il ? Non : la porte ne te connaît pas. Le vouvoiement
     est ici le seul de l'application, et c'est exactement ce qu'il dit. */
  if (!speaksIn(c.id)) return `<div class="shut">
      <span class="shut-s">✦</span>
      <p class="shut-t">Vous ne faites pas partie de la grande loge.</p>
      <p class="shut-d">Ses secrets vous sont interdits.</p>
      <p class="legend" style="margin-top:22px">Tu es de l'${esc(person(ME).circleRef.order)}. La tienne t'attend dans ta chambre.</p>
      <button class="btn-ghost" data-go="#/cercles/${person(ME).circle}" style="margin-top:14px">Rejoindre ta Loge</button>
    </div>`;

  const posts = logeOf(c.id), lit = posts.filter(m => markers(m.id).length);
  const rep = logeReply && postById(logeReply);

  const head = `<div class="lg-head">
    <span class="lg-n">${roman(posts.length)} paroles · ${roman(lit.length)} surlignée${lit.length>1?"s":""}</span>
    <span class="lg-key"><b>▯</b> surligner <b>↩</b> répondre</span>
    <button class="lg-fold${logeFold?" on":""}" data-fold="1">
      <span class="chev">${logeFold?"▾":"▸"}</span>${logeFold?"Déplier le fil entier":"Replier — ne garder que les surlignés"}</button>
  </div>`;

  /* Replié, le fil ne garde que ce que quelqu'un a jugé digne d'être retrouvé.
     Chaque passage ramène à l'endroit exact d'où il vient. */
  if (logeFold) return `${head}
    ${lit.length ? `<div class="lg-lit casc">${lit.map((m,i) => {
      const p = person(m.personId), mk = markers(m.id);
      return `<button class="lit-row" data-jump="${m.id}" ${dly(i)}>
        ${Face(p,"f-s",false)}
        <span class="lit-x"><span class="lit-b">${esc(m.body)}</span>
          <span class="lit-w">${esc(p.firstName)} · ${dateShort(m.at)} · surligné par ${mk.map(x=>esc(x.firstName)).join(", ")}</span></span>
        <span class="lit-go">↘</span></button>`;
    }).join("")}</div>`
    : `<p class="none">Rien n'est encore surligné dans cette Loge.</p>`}
    <p class="legend">Surligner, c'est décider de pouvoir retrouver un passage. La marque se range chez celui qui la pose, et chacun ne retire que la sienne.</p>`;

  return `${head}
    <div class="loge-feed">
      ${posts.length ? posts.map((m,i) => {
        const prev = posts[i-1];
        const day = !prev || dayKey(prev.at) !== dayKey(m.at)
          ? `<div class="lg-day"><span>${dayName(m.at)}</span></div>` : "";
        return day + logeLine(m, day ? null : prev, c.id);
      }).join("") : `<p class="none">La Loge est silencieuse.</p>`}
    </div>
    <form class="compose" data-lform="${c.id}">
      ${rep ? `<div class="cmp-rep"><span class="k">En réponse à ${esc(person(rep.personId).firstName)}</span>
        <i>« ${esc(rep.body.slice(0,64))}${rep.body.length>64?"…":""} »</i>
        <button type="button" class="btn-tiny" data-unreply="1">Annuler</button></div>` : ""}
      <textarea name="body" rows="2" placeholder="Prendre la parole dans la Loge." autocomplete="off"></textarea>
      <div class="cmp-r">
        <span class="cmp-ref"><span class="cmp-k">Joindre une œuvre</span>${mentionHTML(c.id)}</span>
        <button class="btn-main" type="submit">Prendre la parole</button>
      </div>
    </form>
    <p class="loge-note">Un message n'engage rien et ne vaut pas chronique. Il paraît chez les autres à leur prochaine synchronisation — personne ne sera averti.</p>`;
}

/* Ce que l'Ordre a accompli ensemble — et combien des siens, pour chaque
   planche. C'est un décompte, jamais une note. */
function paneOrderQuests(c){
  const l = questsInCircle(c.id), n = membersOf(c.id).length;
  if (!l.length) return `<p class="none">Nul dans cet Ordre n'a encore accompli de quête.</p>
    <p class="legend">Ce n'est pas un retard : une quête s'accomplit d'elle-même, à mesure que les registres avancent.</p>`;
  return `<div class="signs casc">${l.map((x,i) => `<div class="qhold" ${dly(i)}>
      ${Sign(x.q, i, { force:true })}
      <div class="qhold-w"><span class="qhold-n">${roman(x.holders.length)} sur ${roman(n)}</span>
        <span class="stack">${x.holders.map(p => Face(p,"f-xs",false)).join("")}</span></div>
    </div>`).join("")}</div>
    <p class="legend">Le décompte dit combien des ${roman(n)} âmes de l'Ordre l'ont menée au bout.</p>`;
}

function orderPane(c, tab){
  if (tab === "annals") return paneAnnals(c);
  if (tab === "quests") return paneOrderQuests(c);
  if (tab === "magnum") return paneMagnum(c);
  if (tab === "loge")   return paneLoge(c);
  return paneChamber(c);
}

V.orders = cid => {
  if (cid){
    const c = CIRCLES.find(x => x.id === cid);
    if (!c) return `<div class="wrap"><p class="none">Ordre inconnu.</p></div>`;
    if (orderId !== cid){ orderId = cid; orderTab = "chamber"; logeReply = null; logeFold = false; logeRef = null; }
    const tabs = [
      { k:"chamber", l:"La chambre" },
      { k:"annals",  l:"Annales" },
      { k:"magnum",  l:"Magnum opus", n: magnum(c.id).length },
      { k:"quests",  l:"Quêtes", n: questsInCircle(c.id).length },
      { k:"loge",    l:"La grande loge", n: speaksIn(c.id) ? logeOf(c.id).length : 0 },
    ];
    return `<div class="chamber" style="--c:${c.color}" data-texture="${c.id}">
      <canvas class="weave" aria-hidden="true"></canvas>
      <div class="bath"></div>
      <div class="wrap">
        <button class="back" data-go="#/cercles">← Les Ordres</button>
        <div class="cHead">
          <span class="face f-l" style="--g:${c.color};box-shadow:none"><span>${c.emoji}</span></span>
          <div><span class="eyebrow">Chambre</span><h1>${c.order}</h1>
            <p class="lede">${esc(c.blurb)}</p></div>
        </div>

        <nav class="tabs2" data-tabs="order">${tabs.map(t =>
          `<button data-tab="${t.k}" class="${orderTab===t.k?"on":""}">${esc(t.l)}${t.n?`<span class="n">${roman(t.n)}</span>`:""}</button>`).join("")}</nav>
        <div class="panes" id="opanes"><div class="pane">${orderPane(c, orderTab)}</div></div>
      </div></div>`;
  }
  /* La racine des Ordres est une entrée, pas un tableau de bord : on y choisit
     une chambre, on n'y analyse rien. Les disques flottent, décalés en arc et
     déphasés les uns des autres — c'est ce qui empêche la page d'être une
     grille figée. Tout le reste attend derrière la porte. */
  return `<div class="wrap">
    <div class="eyebrow">Les Ordres</div>
    <h1 style="margin-top:8px;text-transform:capitalize">${NUM_FR[CIRCLES.length] || CIRCLES.length} chambres</h1>
    <p class="lede">${roman(Object.keys(PEOPLE).length)} âmes réparties. Entre dans l'une d'elles.</p>
    <div class="orbs casc">${CIRCLES.map((c,i) => `<button class="orb" data-chamber="${c.id}"
        style="--c:${c.color};--i:${i}" ${dly(i*2)}>
      <span class="disc2">${c.emoji}</span>
      <span class="nm">${c.name}</span>
      <span class="orb-blurb">${esc(c.blurb)}</span>
    </button>`).join("")}</div>
  </div>`;
};

/* ==========================================================================
   LA FEUILLE DE PERSONNAGE — « En cours » persistant au-dessus, puis des
   volets. Le mouvement y est LATÉRAL : le zoom dit un changement de
   profondeur, le glissement dit un déplacement à profondeur égale.
   ========================================================================== */
const SOUL_TABS = ["portrait","favorites","quests","kin","registry"];
const MODES = ["chrono","done","years","type"];
let soulTab = "portrait", soulId = null;

/* « En cours » ne descend pas dans les onglets : c'est ce qu'on vient chercher
   en premier et ce sur quoi on agit. Il reste au-dessus, toujours visible. */
function liveBox(p, self){
  const live = rowsBy(p.id).filter(r => r.status === "playing");
  if (!live.length) return `<h2 class="h2-c">En cours</h2>
    <p class="none" style="padding:16px 0">${self ? "Tu n'as rien en cours." : esc(p.firstName) + " n'a rien en cours."}</p>`;
  /* Deux lignes par œuvre et pas cinq : le titre et ses commandes sur la même,
     le dernier checkpoint sur l'autre, tronqué. C'est un tableau de bord, pas
     une lecture — on vient y agir, pas s'y attarder. */
  return `<h2 class="h2-c">En cours · ${roman(live.length)}</h2><div class="live casc">${live.map((r,i) => {
    const m = work(r.mediaId), st = lastCheckpoint(r);
    return `<div class="lv" ${dly(i)}>
      <div class="lv-top">
        <a class="lv-t" href="#/fiche/${r.mediaId}">${esc(titleOf(m))}</a>
        <span class="kind">${KIND[m.mediaType]}${prog(r)?" · "+prog(r):""}</span>
        ${self ? `<span class="lv-act">
          <button data-set="${r.mediaId}:paused" title="Mettre de côté">De côté</button>
          <button data-set="${r.mediaId}:completed" title="${STATUS[m.mediaType].completed}">${STATUS[m.mediaType].completed}</button>
          <button data-set="${r.mediaId}:dropped" title="${STATUS[m.mediaType].dropped}">${STATUS[m.mediaType].dropped}</button>
          <button class="lv-add" data-station="${r.mediaId}" title="Consigner une pensée">+</button>
        </span>` : `<span class="lv-d">entrepris ${ago(r.at)}</span>`}
      </div>
      ${st ? `<p class="lv-st"><span class="lv-q">«</span>${esc(st.text)}<span class="lv-q">»</span>
        <em>${ago(st.at)}</em></p>` : ""}
      ${self ? `<form class="lv-form" data-sform="${r.mediaId}" hidden>
        <input type="text" placeholder="Une pensée, en chemin." autocomplete="off">
        <button type="submit">Consigner</button>
      </form>` : ""}
    </div>`;
  }).join("")}</div>`;
}

/* Mettre de côté était facile, reprendre ne l'était pas : l'œuvre tombait
   dans le registre général et il fallait l'y retrouver. Le panneau d'accès
   rapide est le seul endroit où l'on pilote ce qu'on fait — il doit donc
   aussi montrer ce qu'on a laissé en suspens. */
function pausedBox(p){
  const l = rowsBy(p.id).filter(r => r.status === "paused");
  if (!l.length) return "";
  return `<h2 class="h2-c" style="margin-top:24px">Mis de côté · ${roman(l.length)}</h2>
    <div class="aside-l casc">${l.map((r,i) => {
      const m = work(r.mediaId);
      return `<div class="lv lv-q2" ${dly(i)}>
        <div class="lv-top">
          <a class="lv-t" href="#/fiche/${r.mediaId}">${esc(titleOf(m))}</a>
          <span class="kind">${KIND[m.mediaType]}${prog(r)?" · "+prog(r):""}</span>
          <span class="lv-act">
            <button data-set="${r.mediaId}:playing" title="Reprendre">Reprendre</button>
            <button data-set="${r.mediaId}:dropped" title="${STATUS[m.mediaType].dropped}">${STATUS[m.mediaType].dropped}</button>
          </span>
        </div></div>`;
    }).join("")}</div>`;
}

function panePortrait(p, self){
  const rs = rowsBy(p.id), t = temper(rs), f = figures(p.id);
  const traits = [
    t.sev === null ? null : { k:"Sévérité", v:signed(t.sev),
      d: Math.abs(t.sev) < .25 ? "juge comme l'ensemble"
         : t.sev < 0 ? `juge ${dec(Math.abs(t.sev))} point${Math.abs(t.sev)>=2?"s":""} plus durement que l'Ordre`
                     : `juge ${dec(t.sev)} point${t.sev>=2?"s":""} plus généreusement que l'Ordre` },
    { k:"Achèvement", v:pct(t.rate), d:`contre ${pct(t.grate)} pour l'ensemble` },
    t.pref ? { k:"Prédilection", v:KINDS[t.pref], d:`${pct(t.prefShare)} de ce qui est inscrit` } : null,
    { k:"Renoncements", v:roman(f.gone), d:f.gone ? "œuvres laissées en chemin" : "ne lâche jamais rien" },
    { k:"Jugement moyen", v:f.avg, d:"sur tout ce qui est noté" },
    { k:"Heures", v:roman(f.hours), d:"consacrées, jeux seulement" },
  ].filter(Boolean);
  const pk = peaks(p.id).slice(0,6), sg = singularity(p.id);
  return `<div class="traits casc">${traits.map((x,i) => `<div class="tr" ${dly(i)}>
      <span class="k">${x.k}</span><span class="v">${x.v}</span><span class="d">${x.d}</span></div>`).join("")}</div>
    ${pk.length ? `<p class="aside-note">${self ? "Ce que tu tiens" : "Ce que " + esc(p.firstName) + " tient"} pour le meilleur :</p>
      <div class="peaks casc">${pk.map((r,i) => `<a class="pk" href="#/fiche/${r.mediaId}" ${dly(i)}>
        <span class="pk-n">${r.rating}</span>
        <span class="pk-t">${esc(titleOf(work(r.mediaId)))}</span>
        <span class="kind">${KIND[work(r.mediaId).mediaType]}</span></a>`).join("")}</div>` : ""}
    ${sg ? `<button class="banner" data-go="#/fiche/${sg.id}">
      <span class="k">Seul contre le reste</span>
      <span class="t">${esc(titleOf(sg.id))}</span>
      <span class="d">${sg.d > 0 ? "Défendue" : "Déclassée"} à ${sg.mine} sur dix, quand l'Ordre la juge ${dec(sg.theirs)}.
        Un écart de ${dec(Math.abs(sg.d))}.</span></button>` : ""}
    ${self ? `<div class="pref"><span class="pref-k">Afficher les titres</span>
      <button data-pref="fr" class="${titlePref()==="fr"?"on":""}">En français</button>
      <button data-pref="vo" class="${titlePref()==="vo"?"on":""}">En version originale</button>
      <span class="pref-d">La recherche interroge les deux, quoi qu'il arrive.</span></div>` : ""}`;
}

/* Les favoris sont déclarés, les sommets du Portrait sont calculés : ce sont
   deux choses différentes et la feuille doit les tenir séparées. On peut
   distinguer une œuvre qu'on n'a pas finie, ou que l'on a jugée moyenne. */
function paneFavs(p, self){

      <div class="fav-add"><button class="btn-main" data-favpick="1">Distinguer une œuvre</button></div>` : ""}`;
  const head = l[0], m = work(head);
  return `<div class="mag">
      <button class="mag-art" data-go="#/fiche/${head}" aria-label="${esc(titleOf(m))}">
        ${CoverArt(head, { marks:false })}</button>
      <div class="mag-x">
        <span class="eyebrow">Magnum opus</span>
        <span class="mag-t">${esc(titleOf(m))}</span>
        <span class="kind">${KIND[m.mediaType]} · ${m.year} · ${esc(standing(head,p.id))}</span>
        <p class="mag-d">${self ? "Ce que tu places au premier rang" : "Ce que " + esc(p.firstName) + " place au premier rang"} — et ce qui paraît sous ce nom dans ${esc(p.circleRef.order)}.</p>
        ${self ? `<span class="fv-act">
          <button data-favmv="${head}:1" aria-label="Descendre d'un rang" title="Descendre d'un rang">&darr;</button>
          <button data-favdel="${head}" aria-label="Retirer la distinction" title="Retirer">&times;</button>
        </span>` : ""}
      </div></div>
    ${l.length > 1 ? `<div class="jqs favs casc">${l.slice(1).map((id,i) =>
      favCard(id, i, { rank:i+2, self, pid:p.id, last:i === l.length-2 })).join("")}</div>` : ""}
    ${self ? (l.length >= FAV_MAX
      ? `<p class="legend">Douze distinctions, c'est le plafond. Au-delà ce n'est plus un choix, c'est un second registre : retires-en une pour en porter une autre.</p>`
      : `<div class="fav-add"><button class="btn-main" data-favpick="1">Distinguer une œuvre</button>
         <span class="legend" style="margin:0">${roman(FAV_MAX - l.length)} place${FAV_MAX-l.length>1?"s":""} encore, sur douze.</span></div>`)
      : `<p class="legend">${roman(l.length)} distinction${l.length>1?"s":""}, dans l'ordre choisi par ${esc(p.firstName)}.</p>`}`;
}

/* Sur une feuille, on montre ce qui est accompli — et, chez soi seulement, ce
   qui est en chemin : chez un autre, ce serait lui prêter des intentions. */

  return `${done.length ? `<div class="signs casc">${done.map((q,i) => Sign(q,i,{force:true})).join("")}</div>`
      : `<p class="none">${self ? "Rien d'accompli encore." : esc(p.firstName) + " n'a rien accompli encore."}</p>`}

function registryBody(p){
  const rs = rowsBy(p.id);
  const line = (r,i,dateCol) => `<a class="r r-tl" href="#/fiche/${r.mediaId}" ${dly(i)}>
    <span class="d">${dateCol}</span>
    <span class="line"><span class="t">${esc(titleOf(work(r.mediaId)))}</span>
      <span class="kind">${KIND[work(r.mediaId).mediaType]}</span>
      ${r.review ? `<span class="kind" style="color:var(--ink2)">chronique</span>` : ""}</span>
    ${St(r.mediaId,r.status)}${Sco(r)}</a>`;
  if (mode === "chrono")
    return `<div class="reg casc">${rs.map((r,i) => line(r,i,dateShort(r.at))).join("")}</div>`;
  if (mode === "done")
    return COMPLETION.map(st => { const sub = rs.filter(r => r.status === st);
      return sub.length ? `<div class="grp"><h3 class="grp-h">${STATE_GEN[st]} · ${roman(sub.length)}</h3>
        <div class="reg casc">${sub.map((r,i) => line(r,i,dateShort(r.at))).join("")}</div></div>` : ""; }).join("");
  if (mode === "years"){
    const ys = byYear(rs.filter(r => r.status !== "wishlist"));
    return Object.keys(ys).sort().reverse().map(y => { const l = ys[y];
      const done = l.filter(r => r.status==="completed"||r.status==="mastered").length;
      return `<div class="yr"><div class="yr-h"><span class="yr-n">${y}</span>
        <span class="yr-d">${roman(done)} achevée${done>1?"s":""} · ${roman(l.length)} inscription${l.length>1?"s":""}</span></div>
        <div class="reg">${l.sort(byDate).map((r,i) => line(r,i,dateShort(r.at))).join("")}</div></div>`; }).join("");
  }
  return ["game","film","series","book"].map(k => { const sub = rs.filter(r => work(r.mediaId).mediaType === k);
    return sub.length ? `<div class="grp"><h3 class="grp-h">${KINDS[k]} · ${roman(sub.length)}</h3>
      <div class="reg casc">${sub.map((r,i) => line(r,i,work(r.mediaId).year)).join("")}</div></div>` : ""; }).join("");
}
function paneRegistry(p){
  return `<div class="filt filt-sub">
      <button data-mode="chrono" class="${mode==="chrono"?"on":""}">Chronologie</button>
      <button data-mode="done" class="${mode==="done"?"on":""}">Par complétion</button>
      <button data-mode="years" class="${mode==="years"?"on":""}">Par année</button>
