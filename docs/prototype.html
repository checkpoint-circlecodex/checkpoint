/* ==========================================================================
   PORTER UNE ŒUVRE AU CORPUS, puis s'y inscrire.
   Deux surfaces enchaînées : on cherche, puis on consigne.
   ========================================================================== */
function openSeek(){
  const S = openSurface(`
    <div class="ins-h"><span class="eyebrow">Porter une œuvre au corpus</span>
      <span class="ins-t">Chercher dans le fonds</span></div>
    <label class="find find-big">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="6.4"/><path d="M19.6 19.6l-3-3"/></svg>
      <input id="wq" type="search" placeholder="Titre, en version originale ou en français" autocomplete="off">
    </label>
    <p class="ins-note">La recherche interroge les deux titres. L'identité d'une œuvre
      est son identifiant de source, jamais son nom — deux personnes qui la portent
      sous des titres différents tombent sur la même fiche.</p>
    <div class="ins-res" id="wres"></div>
    <button class="ins-manual" data-manual>Aucune de ces œuvres ? La décrire à la main</button>`,
    "ins");
  const inp = S.body.querySelector("#wq"), out = S.body.querySelector("#wres");
  const draw = () => {
    const q = inp.value.trim().toLowerCase();
    if (q.length < 2){ out.innerHTML = `<p class="none">Trois lettres suffisent.</p>`; return; }
    const inCorpus = Object.keys(CATALOG).filter(id => alive(id) && matchTitle(id,q));
    const fromFonds = Object.keys(SOURCE).filter(id => !CATALOG[id] && matchTitle(id,q));
    const row = (id, known) => {
      const m = CATALOG[id] || SOURCE[id], o = otherTitle(id), ms = known ? myStatus(id) : null;
      return `<button class="ins-row" data-pick="${id}">
        <span class="own ${ms?SC[ms]:"own-none"}"></span>
        <span class="ins-nm"><b>${esc(titleOf(m))}</b>${o?`<i>${esc(o)}</i>`:""}</span>
        <span class="kind">${KIND[m.mediaType]} · ${m.year}</span>
        <span class="ins-tag">${known ? (ms ? "déjà tienne" : "au corpus") : "au fonds"}</span>
      </button>`;
    };
    const html = [...inCorpus.map(id => row(id,true)), ...fromFonds.map(id => row(id,false))].join("");
    out.innerHTML = html || `<p class="none">Rien sous ce nom, ni au corpus ni au fonds.</p>`;
  };
  inp.addEventListener("input", draw); draw(); inp.focus();

  S.el.addEventListener("click", e => {
    const pick = e.target.closest("[data-pick]");
    if (pick){ S.close(); openInscribe(pick.dataset.pick); return; }
    if (e.target.closest("[data-manual]")){ S.close(); openManual(); }
  });
}

function openManual(){
  const d = { kind:"game", gn:new Set() };
  const S = openSurface(`
    <div class="ins-h"><span class="eyebrow">Décrire une œuvre</span>
      <span class="ins-t">Hors du fonds</span></div>
    <p class="ins-note">Une œuvre décrite à la main ne porte pas d'identifiant de source :
      si quelqu'un la décrit aussi de son côté, le corpus aura deux fiches.
      L'onglet d'administration les fusionnera.</p>
    <div class="fld"><label>Titre</label><input id="mt" type="text" placeholder="Version originale"></div>
    <div class="fld"><label>Titre français <em>facultatif</em></label><input id="mf" type="text"></div>
    <div class="fld-2">
      <div class="fld"><label>Nature</label><select id="mk">
        <option value="game">Jeu</option><option value="film">Film</option>
        <option value="series">Série</option><option value="book">Livre</option></select></div>
      <div class="fld"><label>Année</label><input id="my" type="number" min="1900" max="2100" placeholder="2026"></div>
    </div>
    <div class="fld"><label>Catégories <em>elles suivent la nature choisie</em></label>
      <div id="mgn"></div></div>
    <div class="ins-act"><button class="btn-main" data-create>Porter au corpus</button></div>`, "ins");

  const box = S.body.querySelector("#mgn");
  const paint = () => { box.innerHTML = gnPicker(d.kind, d.gn); };
  paint();
  /* Changer de nature vide les catégories : celles d'un jeu ne veulent rien
     dire pour un livre, et les garder silencieusement serait pire. */
  S.body.querySelector("#mk").addEventListener("change", e => {
    d.kind = e.target.value; d.gn.clear(); paint();
  });
  S.body.querySelector("#mt").focus();

  S.el.addEventListener("click", e => {
    const g = e.target.closest("[data-gn]");
    if (g){ const v = g.dataset.gn;
      d.gn.has(v) ? d.gn.delete(v) : d.gn.add(v); g.classList.toggle("on"); return; }
    if (!e.target.closest("[data-create]")) return;
    const t = S.body.querySelector("#mt").value.trim();
    if (!t){ S.body.querySelector("#mt").focus(); return; }
    const fr = S.body.querySelector("#mf").value.trim();
    const y = parseInt(S.body.querySelector("#my").value,10) || new Date().getFullYear();
    const id = slug(t);
    CATALOG[id] = { mediaType:d.kind, title:t, year:y,
                    art:{game:"🎮",film:"🎞️",series:"📺",book:"📖"}[d.kind],
                    genres:[...d.gn], ...(fr ? { titleFr:fr } : {}) };
    const sh = SHARDS.find(x => x.user.id === ME);
    sh.works = sh.works || {};
    sh.works[id] = { ...(sh.works[id] || {}), genres:[...d.gn] };
    S.close(); openInscribe(id);
  });
}

/* ==========================================================================
   LA JAQUETTE : dépôt, recadrage, plafond.
   Elle appartient à l'ŒUVRE, pas à l'entrée — elle va donc dans la section
   `works` de TON fragment (et non `games` : une jaquette de film ou de livre
   n'a rien à faire dans une section nommée d'après les jeux), et la fusion
   retient la première disponible.
   Personne n'écrase celle d'un autre : l'invariant premier tient.
   Tout passe par un redimensionnement à 400 × 600 : dans un dépôt Git, un
   binaire remplacé n'est jamais effacé, donc le poids ne se rattrape pas.
   ========================================================================== */
const COVER_W = 400, COVER_H = 600, COVER_RATIO = COVER_W / COVER_H;
const weightOf = url => Math.round(url.length * 0.75 / 1024);

function setCover(mediaId, url){
  CATALOG[mediaId] = { ...CATALOG[mediaId], cover:url };
  const sh = SHARDS.find(x => x.user.id === ME);
  sh.works = sh.works || {};
  sh.works[mediaId] = { ...(sh.works[mediaId] || {}), cover:url };
}
function encode(img, ox, oy, scale, viewW){
  const c = document.createElement("canvas");
  c.width = COVER_W; c.height = COVER_H;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#15150F"; ctx.fillRect(0,0,COVER_W,COVER_H);
  const k = COVER_W / viewW;
  ctx.imageSmoothingQuality = "high";
  ctx.drawImage(img, ox*k, oy*k, img.naturalWidth*scale*k, img.naturalHeight*scale*k);
  let out = c.toDataURL("image/webp", .82);
  if (!out.startsWith("data:image/webp")) out = c.toDataURL("image/jpeg", .84);
  return out;
}

function openCrop(img, done){
  const S = openSurface(`
    <div class="ins-h"><span class="eyebrow">Cadrer la jaquette</span>
      <span class="ins-t">Trois sur quatre</span></div>
    <p class="ins-note">Fais glisser pour déplacer, la molette ou le curseur pour agrandir.
      L'image sera réduite à ${COVER_W} × ${COVER_H} avant d'être consignée.</p>
    <div class="crop" id="cv"><img id="ci" alt=""></div>
    <div class="fld"><label>Échelle</label>
      <input id="cz" type="range" min="100" max="320" value="100"></div>
    <div class="ins-act"><button class="btn-ghost" data-cancel>Annuler</button>
      <button class="btn-main" data-crop>Recadrer et consigner</button></div>`, "ins");

  const view = S.body.querySelector("#cv"), el = S.body.querySelector("#ci"), zoom = S.body.querySelector("#cz");
  el.src = img.src;

  /* On mesure le cadre avec offsetWidth/offsetHeight, et non avec
     getBoundingClientRect : la surface entre en animant une mise à l'échelle,
     et le rectangle rendu serait mesuré en cours de route — trop petit, voire
     nul en hauteur. offsetWidth ignore les transformations. */
  let vw = 0, vh = 0, base = 1, z = 1, ox = 0, oy = 0;
  const measure = () => {
    vw = view.offsetWidth; vh = view.offsetHeight;
    base = Math.max(vw / img.naturalWidth, vh / img.naturalHeight) || 1;
  };
  const clamp = () => {
    const s0 = base * z;
    ox = Math.min(0, Math.max(vw - img.naturalWidth  * s0, ox));
    oy = Math.min(0, Math.max(vh - img.naturalHeight * s0, oy));
  };
  const apply = () => { clamp();
    el.style.transformOrigin = "0 0";
    el.style.transform = `translate(${ox}px,${oy}px) scale(${base*z})`; };
  const center = () => { measure();
    ox = (vw - img.naturalWidth  * base) / 2;
    oy = (vh - img.naturalHeight * base) / 2; apply(); };
  requestAnimationFrame(center);
  addEventListener("resize", center);

  const pinch = nz => {
    const cx = vw/2, cy = vh/2;
    ox = cx - (cx - ox) * (nz/z); oy = cy - (cy - oy) * (nz/z);
    z = nz; zoom.value = Math.round(z*100); apply();
  };
  let drag = null;
  view.addEventListener("pointerdown", e => { drag = { x:e.clientX, y:e.clientY, ox, oy };
    view.setPointerCapture(e.pointerId); });
  view.addEventListener("pointermove", e => { if (!drag) return;
    ox = drag.ox + (e.clientX - drag.x); oy = drag.oy + (e.clientY - drag.y); apply(); });
  view.addEventListener("pointerup", () => drag = null);
  view.addEventListener("pointercancel", () => drag = null);
  view.addEventListener("wheel", e => { e.preventDefault();
    pinch(Math.min(3.2, Math.max(1, z * (e.deltaY < 0 ? 1.08 : .926)))); }, { passive:false });
  zoom.addEventListener("input", () => pinch(+zoom.value/100));

  const bye = () => removeEventListener("resize", center);

  S.el.addEventListener("click", e => {
    if (e.target.closest("[data-cancel]")) { bye(); S.close(); done(null); return; }
    if (e.target.closest("[data-crop]"))   { bye(); S.close(); done(encode(img, ox, oy, base*z, vw)); }
  });
}

function takeImage(file, done){
  if (!file || !file.type.startsWith("image/")) return;
  const fr = new FileReader();
  fr.onload = () => {
    const img = new Image();
    img.onload = () => {
      const r = img.naturalWidth / img.naturalHeight;
      if (Math.abs(r - COVER_RATIO) < .02) done(encode(img, 0, 0, COVER_W/img.naturalWidth, COVER_W));
      else openCrop(img, done);
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}

/* Les en-cours, atteignables de partout : c'est le geste le plus fréquent
   après la lecture, il ne doit pas imposer un détour par sa feuille. */

/* Distinguer se choisit dans ce qu'on a déjà fréquenté : on ne distingue pas
   une convoitise. La liste est typographique — ici on choisit, on ne contemple
   pas ; les jaquettes attendent dans l'onglet. */
/* Le point de lignée : neutre, et il doit l'être. Les membres d'une maisonnée
   ne sont pas du même Ordre — une marque colorée obligerait à choisir une
   teinte, et ce serait une cinquième exception au noir et blanc. */
const kinDot = pid => `<button class="kin-dot" data-kin="${pid}" title="Sa lignée">
  <span class="kin-mark">⁂</span><b>${roman(household(pid).size)}</b></button>`;

const nameList = ids => { const n = ids.map(i => esc(person(i).firstName));
  return n.length < 2 ? n[0] : n.slice(0,-1).join(", ") + " et " + n[n.length-1]; };
/* « de Éliot » ne se dit pas. L'élision fait partie du ton, pas du décor. */
const de = n => /^[aeiouyàâéèêëîïôöûüh]/i.test(n) ? `d'${n}` : `de ${n}`;

/* Une section à part, jamais un onglet : la lignée n'est pas une facette de la
   personne, c'est quelque chose qui la dépasse. On y entre par un point, on en
   ressort là où on était. */
function openKin(pid){
  const { ids, gen } = household(pid);
  const d = kinDeeds(ids);
  const rows = {};
  ids.forEach(i => (rows[gen[i]] ||= []).push(i));
  const levels = Object.keys(rows).map(Number).sort((a,b) => a - b);

  /* Le mot est toujours celui de l'AUTRE : l'enfant dit « mon père », donc on
     écrit « père de ». Personne ne se nomme soi-même dans une famille. */
  const title = i => {
    const above = (rows[gen[i] - 1] || []).find(y => kinLink(y, i));
    if (above) return `${KIN[kinLink(above, i)].l} ${de(person(above).firstName)}`;
    const below = ids.filter(y => gen[y] === gen[i] + 1 && kinLink(i, y));
    if (below.length) return `${KIN[kinLink(below[0], i)].l} ${de(nameList(below))}`;
    const side = ids.filter(y => y !== i && gen[y] === gen[i] && kinLink(i, y));
    if (side.length) return `${KIN[kinLink(side[0], i)].l} ${de(nameList(side))}`;
    return esc(person(i).circleRef.one);
  };

  /* Les générations se relient par des courbes qui s'évasent depuis le milieu,
     jamais par un trait d'équerre : une maisonnée n'est pas un organigramme.
     Les enfants étant régulièrement espacés, leurs abscisses se calculent —
     aucune mesure du DOM, donc rien qui dépende d'une mise en page faite. */
  const arc = n => {
    if (!n) return "";
    const xs = Array.from({ length:n }, (_,k) => (k + .5) / n * 100);
    return `<svg class="lign-arc" viewBox="0 0 100 34" preserveAspectRatio="none" aria-hidden="true">
      ${xs.map(x => `<path d="M50 0 C50 17 ${x.toFixed(2)} 17 ${x.toFixed(2)} 34"
        vector-effect="non-scaling-stroke" />`).join("")}</svg>`;
  };

  const tree = levels.map((g, gi) => `
    ${gi ? arc(rows[g].length) : ""}
    <div class="lign-row">${rows[g].map((i, k) => `
      <a class="kinp" href="#/personne/${i}" data-kinclose="1"
         style="--i:${gi*2 + k};--c:${person(i).circleRef.color}">
        <span class="kinp-f">${Face(person(i), "f-l", false)}</span>
        <b>${esc(person(i).firstName)}</b>
        <i>${title(i)}</i>
        <span class="kind">${esc(person(i).circleRef.one)}</span>
      </a>`).join("")}</div>`).join("");

  /* Quatre cases de statistiques, c'est un tableau de bord. Une phrase, c'est
     une maisonnée. Les chiffres romains tiennent le ton sans refroidir. */
  const orders = new Set(ids.map(i => person(i).circleRef.one));
  const say = [
    `<b>${roman(d.works)}</b> œuvres fréquentées sous ce toit`,
    d.hours ? `<b>${roman(d.hours)}</b> heures de jeu` : null,
    d.chronicles ? `<b>${roman(d.chronicles)}</b> chroniques` : null,
    d.quests.length ? `<b>${roman(d.quests.length)}</b> quêtes accomplies par tous` : null,
  ].filter(Boolean);

  openSurface(`
    <div class="lign-h">
      <span class="eyebrow">Lignée · ${NUM_FR[ids.length] || ids.length} âmes${
        orders.size === ids.length && ids.length > 1 ? `, ${NUM_FR[orders.size] || orders.size} Ordres` : ""}</span>
      <h2 class="lign-t">${nameList(ids)}</h2>
    </div>
    <div class="lign-tree">${tree}</div>
    <p class="lign-say">${say.join(", ")}.</p>
    ${d.common.length ? `<div class="lign-sect">
      <p class="lign-k">Ce qu'ils ont tous mené au bout</p>
      <div class="jqs favs">${d.common.map((m,i) => favCard(m, i)).join("")}</div></div>` : ""}
    ${d.quests.length ? `<div class="lign-sect">
      <p class="lign-k">Et ce qu'ils ont tous accompli</p>
      <div class="signs">${d.quests.map((q,i) => Sign(q, i, { force:true })).join("")}</div></div>` : ""}
    ${d.clash ? `<button class="lign-clash" data-go="#/fiche/${d.clash.id}" data-kinclose="1">
      <span class="lign-k">Là où la maisonnée se divise</span>
      <span class="t">${esc(titleOf(d.clash.id))}</span>
      <span class="d">${esc(person(d.clash.hi.personId).firstName)} la met à ${d.clash.hi.rating},
        ${esc(person(d.clash.lo.personId).firstName)} à ${d.clash.lo.rating}.
        ${d.clash.d >= 3 ? "Il y a là une conversation de table." : "On a vu pire."}</span></button>` : ""}
    <p class="lign-end">On choisit son Ordre. On ne choisit pas sa maisonnée.</p>
  `, "ins lignee");
}

/* Planter une quête. Le formulaire se redessine à chaque geste structurant —
   palier, œuvre ajoutée, épreuve — mais JAMAIS à la frappe : on ne redessine
   pas sous les doigts de quelqu'un qui écrit. */
function openQuest(){
  const st = { title:"", line:"", trials:[{ rung:3, media:[] }], q:[""] };
  const S = openSurface("", "ins quest-new");

  const hits = ti => {
    const term = (st.q[ti] || "").toLowerCase().trim();
    if (term.length < 2) return [];
    return Object.keys(CATALOG)
      .filter(id => alive(id) && matchTitle(id, term) && !st.trials[ti].media.includes(id))
      .sort((a,b) => titleOf(a).localeCompare(titleOf(b),"fr")).slice(0,6);
  };
  const resHTML = ti => hits(ti).map(id => { const m = CATALOG[id];
    return `<button class="ins-row" data-qadd="${ti}:${id}">
      <span class="own ${myStatus(id)?SC[myStatus(id)]:"own-none"}"></span>
      <span class="ins-nm"><b>${esc(titleOf(m))}</b><i>${KIND[m.mediaType]} · ${m.year}</i></span>
      <span class="ins-tag">ajouter</span><span class="ins-tag">＋</span></button>`; }).join("");

  const harvest = () => {
    const t = S.body.querySelector("[data-qt]"), l = S.body.querySelector("[data-ql]");
    if (t) st.title = t.value; if (l) st.line = l.value;
    S.body.querySelectorAll("[data-qq]").forEach(i => st.q[+i.dataset.qq] = i.value);
  };

  const paint = () => {
    S.body.innerHTML = `
      <div class="ins-h"><span class="eyebrow">Planter une quête</span>
        <span class="ins-t">Un vœu, et ses conditions</span></div>
      <p class="ins-note">Nul ne la validera : <strong>elle s'accomplit d'elle-même</strong> pour quiconque atteint le palier demandé sur chacune des œuvres. Elle restera dans ton fragment, et toi seul pourras l'arracher.</p>
      <div class="fld"><label>Le nom</label>
        <input data-qt type="text" value="${esc(st.title)}" placeholder="Istari, Le Tribunal, Les Cendres…" autocomplete="off"></div>
      <div class="fld"><label>Une ligne <em>— facultatif</em></label>
        <input data-ql type="text" value="${esc(st.line)}" placeholder="Ce qu'elle demande, en une phrase." autocomplete="off"></div>
      ${st.trials.map((t,ti) => `<div class="trial">
        <div class="trial-h"><span class="trial-n">Épreuve ${roman(ti+1)}</span>
          ${st.trials.length > 1 ? `<button class="btn-tiny" data-qtdel="${ti}">Retirer</button>` : ""}</div>
        <div class="picks">${RUNGS.map(r =>
          `<button class="pick${t.rung===r.k?" on":""}" data-qr="${ti}:${r.k}">${r.v}</button>`).join("")}</div>
        <p class="legend" style="margin:7px 0 11px">${esc(rung(t.rung).d)}</p>
        ${t.media.length ? `<div class="picks">${t.media.map(m =>
          `<button class="pick on" data-qmdel="${ti}:${m}">${esc(titleOf(m))} ×</button>`).join("")}</div>` : ""}
        <label class="find find-sm">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="6.4"/><path d="M19.6 19.6l-3-3"/></svg>
          <input data-qq="${ti}" type="search" value="${esc(st.q[ti] || "")}" placeholder="Chercher une œuvre du corpus" autocomplete="off"></label>
        <div class="ins-res" id="qres${ti}">${resHTML(ti)}</div>
      </div>`).join("")}
      <button class="btn-ghost" data-qtadd style="width:100%">＋ Une autre épreuve</button>
      <div class="ins-act">
        <button class="btn-ghost" data-qcancel>Renoncer</button>
        <button class="btn-main" data-qsave>Planter la quête</button>
      </div>`;
  };

  S.body.addEventListener("input", e => {
    const qq = e.target.closest("[data-qq]");
    if (qq){ const ti = +qq.dataset.qq; st.q[ti] = qq.value;
             const box = S.body.querySelector("#qres" + ti);
             if (box) box.innerHTML = resHTML(ti);           /* jamais de repeinte totale */
             return; }
    const t = e.target.closest("[data-qt]"); if (t){ st.title = t.value; return; }
    const l = e.target.closest("[data-ql]"); if (l) st.line = l.value;
  });

  S.body.addEventListener("click", e => {
    const r = e.target.closest("[data-qr]");
    if (r){ const [ti,k] = r.dataset.qr.split(":"); harvest(); st.trials[+ti].rung = +k; paint(); return; }
    const a = e.target.closest("[data-qadd]");
    if (a){ const i = a.dataset.qadd.indexOf(":"), ti = +a.dataset.qadd.slice(0,i), id = a.dataset.qadd.slice(i+1);
            harvest(); st.trials[ti].media.push(id); st.q[ti] = ""; paint();
            const f = S.body.querySelector(`[data-qq="${ti}"]`); if (f) f.focus(); return; }
    const d = e.target.closest("[data-qmdel]");
    if (d){ const i = d.dataset.qmdel.indexOf(":"), ti = +d.dataset.qmdel.slice(0,i), id = d.dataset.qmdel.slice(i+1);
            harvest(); st.trials[ti].media = st.trials[ti].media.filter(x => x !== id); paint(); return; }
    const td = e.target.closest("[data-qtdel]");
    if (td){ harvest(); const ti = +td.dataset.qtdel;
             st.trials.splice(ti,1); st.q.splice(ti,1); paint(); return; }
    if (e.target.closest("[data-qtadd]")){ harvest(); st.trials.push({ rung:3, media:[] }); st.q.push(""); paint(); return; }
    if (e.target.closest("[data-qcancel]")){ S.close(); return; }
    if (e.target.closest("[data-qsave]")){
      harvest();
      const trials = st.trials.filter(t => t.media.length);
      if (!st.title.trim() || !trials.length){
        const w = S.body.querySelector("[data-qt]");
        if (w){ w.focus(); w.style.borderColor = "var(--ink)"; }
        return;
      }
      const q = addQuest(st.title, st.line, trials);
      S.close();
      if (q) location.hash = "#/quete/" + q.id;
    }
  });

  paint();
  setTimeout(() => { const f = S.body.querySelector("[data-qt]"); if (f) f.focus(); }, 60);
}

    </div>`, "ins");

  const zone = S.body.querySelector("#cz0"), file = S.body.querySelector("#cf0"),
        prev = S.body.querySelector("#cp0"),  note = S.body.querySelector("#cn0");
  const accept = url => {
    if (!url) return;
    setCover(mediaId, url);
    prev.innerHTML = CoverArt(mediaId, { marks:false });
    note.innerHTML = `Consignée : ${COVER_W} × ${COVER_H}, environ <strong>${weightOf(url)} ko</strong>.
      <br><em>Clique de nouveau pour la remplacer.</em>`;
  };
  zone.addEventListener("click", () => file.click());
  zone.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); file.click(); } });
  file.addEventListener("change", () => takeImage(file.files[0], accept));
  ["dragenter","dragover"].forEach(n => zone.addEventListener(n, e => {
    e.preventDefault(); zone.classList.add("over"); }));
  ["dragleave","drop"].forEach(n => zone.addEventListener(n, e => {
    e.preventDefault(); zone.classList.remove("over"); }));
  zone.addEventListener("drop", e => takeImage(e.dataTransfer.files[0], accept));

  S.el.addEventListener("click", e => {
    const st = e.target.closest("[data-st]");
    if (st){ d.status = st.dataset.st;
      S.body.querySelectorAll("[data-st]").forEach(b => b.classList.toggle("on", b === st)); return; }
    const gn = e.target.closest("[data-gn]");
    if (gn){ const v = gn.dataset.gn;
      d.gn.has(v) ? d.gn.delete(v) : d.gn.add(v); gn.classList.toggle("on"); return; }
    const wt = e.target.closest("[data-wth]");
    if (wt){ const v = wt.dataset.wth;
      d.wt.has(v) ? d.wt.delete(v) : d.wt.add(v); wt.classList.toggle("on"); return; }
    const rt = e.target.closest("[data-rt]");
    if (rt){ d.rating = rt.dataset.rt === "" ? null : +rt.dataset.rt;
      S.body.querySelectorAll("[data-rt]").forEach(b => b.classList.toggle("on", b === rt)); return; }
    if (e.target.closest("[data-drop]")){ removeMine(mediaId); S.close(); show(location.hash||"#/"); return; }
    if (e.target.closest("[data-save]")){
      const pv = S.body.querySelector("#pv");
      setGenres(mediaId, [...d.gn]);
      upsertMine(mediaId, {
        status: d.status,
        rating: d.rating,
        with: [...d.wt],
        progress: unit && pv && pv.value !== "" ? { unit, value: +pv.value } : null,
        review: { title: S.body.querySelector("#rt").value.trim(),
                  body:  S.body.querySelector("#rb").value.trim() },
      });
      S.close();
      if (location.hash === `#/fiche/${mediaId}`) show(location.hash); else location.hash = `#/fiche/${mediaId}`;
    }
  });
}

/* La roulette ralentit, puis s'arrête sur l'œuvre où l'on part. */
function spinLot(){
  const land = drawLot(lotType);
  if (!land) return;
  const el = document.querySelector("[data-lot-title]");
  if (!el || matchMedia("(prefers-reduced-motion: reduce)").matches){
    lotId = land; location.hash = `#/fiche/${land}`; return;
  }
  const pool = tracked(lotType || null);
  const btn = document.querySelector("[data-lot-go]");
  if (btn){ btn.disabled = true; btn.textContent = "Le sort tourne…"; }
  const die = document.querySelector("canvas.d10");
  let i = 0; const n = 16;
  (function step(){
    el.textContent = titleOf(pool[Math.floor(Math.random()*pool.length)]);
    el.style.opacity = (.5 + .5*(i/n)).toFixed(2);
    if (die) drawDie(die, DIE_FACES[Math.floor(Math.random()*10)]);
    if (++i < n) setTimeout(step, 36 + i*i*2.6);
    else { el.textContent = titleOf(land); el.style.opacity = "1"; lotId = land;
           if (die) drawDie(die, "XII");
           setTimeout(() => { location.hash = `#/fiche/${land}`; }, 260); }
  })();
}

addEventListener("hashchange", () => { qa.value=""; qb.value=""; regMax = 14; show(location.hash||"#/"); });

const app = document.getElementById("app");
/* Déplier le volet, c'est reculer d'un pas : le travail passe au flou et le
   volet devient un lanceur. On y cherche, on choisit, et le volet se referme
   de lui-même sur la page atteinte. L'état replié est l'état de travail, et
   c'est lui par défaut. */
const deck = document.getElementById("deck");
function deckHTML(q){
  const n = (q || "").trim().toLowerCase();
  if (n.length < 2) return `<div class="deck-in deck-empty">
    <span class="eyebrow">Volet déployé</span>
    <p class="deck-say">Cherche une œuvre ou quelqu'un.<br>
      Choisis, et le volet se referme sur la page.</p></div>`;
  const ws = tracked().filter(id => matchTitle(id, n));
  const ps = Object.values(PEOPLE).filter(p => (p.firstName+" "+p.handle).toLowerCase().includes(n));
  return `<div class="deck-in">
    <span class="eyebrow">« ${esc(q.trim())} » · ${roman(ws.length + ps.length)} trouvailles</span>
    ${ps.length ? `<div class="troop" style="margin:18px 0 26px">${ps.map((p,i) =>
      `<a class="sold" href="#/personne/${p.id}" ${dly(i)}>${Face(p,"f-m",false)}
        <b>${esc(p.firstName)}</b><i>${esc(p.handle)}</i></a>`).join("")}</div>` : ""}
    ${ws.length ? `<div class="jqs">${ws.map((id,i) => Cover(id,i)).join("")}</div>`
                : `<p class="none">Rien sous ce nom dans le registre.</p>`}
  </div>`;
}
const paintDeck = () => { deck.innerHTML = deckHTML(qa.value); };
const setRail = v => {
  app.classList.toggle("collapsed", v);
  try{ localStorage.setItem("cp.rail", v?"1":"0"); }catch{}
  if (!v) paintDeck();
};
document.getElementById("tgl").addEventListener("click", () => setRail(!app.classList.contains("collapsed")));
try{ const v = localStorage.getItem("cp.rail"); setRail(v === null ? true : v === "1"); }
catch{ setRail(true); }
/* Volet déplié, la recherche s'affiche dans le lanceur, au-dessus du flou ;
   volet replié, elle remplace la vue comme avant. */
const onSeek = () => app.classList.contains("collapsed") ? show(location.hash||"#/") : paintDeck();
qa.addEventListener("input", onSeek);
qb.addEventListener("input", () => { qa.value = qb.value; onSeek(); });

show(location.hash || "#/");
</script>
