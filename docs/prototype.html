}

function soulPane(p, tab){
  const self = p.id === ME;
  if (tab === "favorites") return paneFavs(p, self);
  if (tab === "quests")   return paneQuests(p, self);
  if (tab === "kin")      return paneKin(p);
  if (tab === "registry") return paneRegistry(p);
  return panePortrait(p, self);
}

/* Au premier coup d'œil, une feuille doit dire QUI on lit — pas seulement
   comment il s'appelle. Une ligne, sans pronom (on ne connaît pas le genre),
   télégraphique comme une entrée de bestiaire. */
const KINDS_ART = { game:"des jeux", film:"des films", series:"des séries", book:"des livres" };
function soulLine(p){
  const rs = rowsBy(p.id).filter(r => r.status !== "wishlist");
  if (rs.length < 3) return "Vient d'arriver. Tout reste à écrire.";
  const t = temper(rowsBy(p.id)), f = figures(p.id);
  const cps = rs.reduce((n,r) => n + checkpointsOf(r).length, 0);
  const chr = rs.filter(r => r.review).length;
  /* On ne récite pas les mêmes trois traits pour tout le monde : chaque trait
     porte une SAILLANCE — son écart à la norme — et seuls les plus saillants
     sortent. Sinon toutes les feuilles se ressemblent, ce qui est le contraire
     du but. */
  const c = [];
  if (t.pref && t.prefShare > .52) c.push({ s:t.prefShare, t:`surtout ${KINDS_ART[t.pref]}` });
  if (t.sev !== null && Math.abs(t.sev) >= .35)
    c.push({ s:Math.abs(t.sev)/2.2, t:t.sev < 0 ? "juge plus durement que l'Ordre"
                                                : "juge plus généreusement que l'Ordre" });
  /* « IV œuvres laissées en chemin » dit déjà « se lasse » : on ne met pas
     deux fois le même trait dans la même phrase. */
  if (t.rate >= t.grate || f.gone < 3)
    c.push({ s:.3 + Math.abs(t.rate - t.grate)*2.2,
             t:t.rate >= t.grate ? "va au bout de ce qui est entrepris"
                                 : "se lasse plus souvent que les autres" });
  if (f.gone === 0 && rs.length > 5) c.push({ s:1.1, t:"n'a jamais rien lâché" });
  else if (f.gone >= 3) c.push({ s:.6 + f.gone/8, t:`${roman(f.gone)} œuvres laissées en chemin` });
  if (chr >= 3) c.push({ s:.55 + chr/9, t:"écrit sur presque tout" });
  else if (!chr && rs.length > 6) c.push({ s:.85, t:"n'écrit jamais une ligne" });
  if (cps >= 3) c.push({ s:.75, t:"consigne ses pensées en chemin" });
  if (f.hours >= 150) c.push({ s:.5 + f.hours/900, t:`${roman(f.hours)} heures au compteur` });
  if (favsOf(p.id).length >= 4) c.push({ s:.5, t:"distingue beaucoup" });
  const bits = c.sort((a,b) => b.s - a.s).slice(0,3).map(x => x.t);
  return bits.join(", ").replace(/^./, ch => ch.toUpperCase()) + ".";
}

/* Le glissement latéral : on reste à la même profondeur, donc rien ne floute. */
function slidePane(container, html, dir){
  const old = container.querySelector(".pane");
  const next = document.createElement("div");
  next.className = "pane in";
  next.style.setProperty("--dx", (dir > 0 ? 26 : -26) + "px");
  next.innerHTML = html;
  if (old && !matchMedia("(prefers-reduced-motion: reduce)").matches){
    old.style.setProperty("--dx", (dir > 0 ? -26 : 26) + "px");
    old.classList.add("out");
    setTimeout(() => old.remove(), 180);
  } else if (old) old.remove();
  container.appendChild(next);
  next.addEventListener("animationend", () => next.classList.remove("in"), { once:true });
  afterRender();
}

/* Un seul mécanisme d'onglets pour la feuille et pour la chambre : le noyau
   possède le geste, un bloc ne déclare que sa liste, son hôte et son corps.
   Promu ici au deuxième usage, comme le veut la règle. */
const TABSETS = {
  soul:  { tabs:SOUL_TABS,  host:"panes",  get:() => soulTab,  set:v => soulTab = v,
           body:() => soulPane(person(soulId), soulTab) },
  order: { tabs:ORDER_TABS, host:"opanes", get:() => orderTab, set:v => orderTab = v,
           body:() => orderPane(CIRCLES.find(c => c.id === orderId), orderTab) },
};
/* Rejouer un volet sans glissement : rien ne s'est déplacé. */
function redrawTab(group){
  const T = TABSETS[group], h = document.getElementById(T.host);
  if (!h) return;
  h.innerHTML = `<div class="pane">${T.body()}</div>`;
  afterRender();
}
/* Un fil s'ouvre sur son présent — sauf quand on vient d'un passage surligné,
   auquel cas il s'ouvre là d'où ce passage vient.
   ⚠️ Pas de `requestAnimationFrame` ici : un onglet qui n'est pas rendu ne le
   déclenche jamais, et le fil s'ouvrirait en haut sans que rien ne le signale.
   Même piège que le retrait des couches quittées. On agit tout de suite, puis
   une seconde fois quand les polices ont fini de décaler les hauteurs. */
function afterRender(){
  const f = document.querySelector(".loge-feed");
  if (!f) return;
  const jump = logeJump; logeJump = null;
  const run = () => {
    if (jump){
      const t = f.querySelector(`[data-post="${CSS.escape(jump)}"]`);
      if (t){ t.scrollIntoView({ block:"center" });
              t.classList.add("struck");
              setTimeout(() => t.classList.remove("struck"), 1400);
              return; }
    }
    f.scrollTop = f.scrollHeight;
  };
  run();
  setTimeout(run, 70);
}
function setTabCount(group, key, n){
  const b = document.querySelector(`.tabs2[data-tabs="${group}"] [data-tab="${key}"]`);
  if (!b) return;
  let sp = b.querySelector(".n");
  if (!n){ if (sp) sp.remove(); return; }
  if (!sp){ sp = document.createElement("span"); sp.className = "n"; b.appendChild(sp); }
  sp.textContent = roman(n);
}
function afterFav(){
  redrawTab("soul");
  setTabCount("soul","favorites",favsOf(ME).length);
}

/* ==========================================================================
   PIXEL ART — un seul module, deux usages : la silhouette de ville en tête du
   Registre, et la carte du Royaume derrière le flou. Monochrome, trois valeurs
   de gris, aucun lissage. Le dessin est engendré, jamais dessiné à la main :
   une graine fixe le rend stable d'une visite à l'autre.
   ========================================================================== */
/* Le plus sombre n'est pas un noir : à cette échelle il tamponnerait le papier
   au lieu de le dessiner. Quatre valeurs, du charbon doux au gris pâle. */
const GREY = ["#6E6E64","#929187","#B2B1A7","#D6D5CC"];
const rng = seed => { let x = (seed>>>0) || 1;
  return () => (x = (x*1664525 + 1013904223) >>> 0) / 4294967296; };

/* ---- la ville de profil, en tête de l'accueil ----
   Une scène composée, non tirée au sort : collines, rais de lumière et nuages
   derrière ; la cité se masse au milieu-gauche — remparts, cathédrale à
   arcs-boutants, château à mâchicoulis, place et fontaine ; puis elle se défait
   en fermes, moulin, champs, et une forêt où veille une tour de sorcier.
   Deux pixels par point : à trois, rien de fin ne tient. ---- */
function drawSkyline(cv){
  const dpr = Math.min(devicePixelRatio || 1, 2), S = 2;
  const w = cv.offsetWidth, h = cv.offsetHeight;
  if (!w || !h) return null;
  cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr);
  const g = cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0); g.imageSmoothingEnabled = false;
  const C = Math.ceil(w/S), R = Math.ceil(h/S);
  const P = (x,y,n,m,c) => { g.fillStyle = c; g.fillRect(Math.round(x)*S, Math.round(y)*S, Math.round(n)*S, Math.round(m)*S); };
  const r = rng(90210);
  const G = R - 6;
  const lamps = [];
  const [DARK, SHADE, WALL, PALE] = GREY;

  /* tramage : une densité de points plutôt qu'un aplat — c'est ce qui donne
     de l'air aux nuages et aux rais de lumière */
  const dith = (x,y,n,m,c,k) => {
    for (let yy = 0; yy < m; yy++) for (let xx = 0; xx < n; xx++){
      const v = ((x+xx)*7 + (y+yy)*13) % 8;
      if (v < k) P(x+xx, y+yy, 1, 1, c);
    }
  };

  /* ---- 0. collines lointaines : une crête dessinée, puis un versant tramé.
       Sans ligne de crête, le tramage seul ne lit que comme une hachure. ---- */
  for (let x = 0; x < C; x++){
    const hh = 9 + Math.round(Math.sin(x*.021)*7 + Math.sin(x*.063)*4 + Math.sin(x*.009)*5);
    const top = G - 22 - hh;
    P(x, top, 1, 1, WALL);
    P(x, top+1, 1, 2, PALE);
    dith(x, top+3, 1, hh+8, PALE, 4);
  }

  /* ---- 1. rais de lumière, venus du haut à gauche ---- */
  for (let i = 0; i < 5; i++){
    const sx = Math.round(C*.06) + i*Math.round(C*.075);
    const wd = 6 + Math.floor(r()*7);
    for (let y = 0; y < G-18; y++){
      const x = sx + Math.round(y*.58);
      dith(x, y, wd, 1, PALE, y < 10 ? 4 : (y < G*.55 ? 3 : 2));
    }
  }

  /* ---- 2. nuages ---- */
  const cloud = (cx,cy,sc,tone,dens) => {
    const lobes = [[0,0,5],[-4,1,4],[4,1,4],[-7,2,3],[7,2,3],[2,-2,3],[-2,-2,3]];
    for (const [ox,oy,rad] of lobes){
      const rx = Math.round(rad*sc*1.5), ry = Math.round(rad*sc*.72);
      for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++)
        if ((x*x)/(rx*rx) + (y*y)/(ry*ry) <= 1)
          dith(cx+ox*sc+x, cy+oy*sc+y, 1, 1, tone, dens);
    }
    for (let x = -Math.round(9*sc); x <= Math.round(9*sc); x++)
      if (r() < .5) P(cx+x, cy+Math.round(3*sc), 1, 1, WALL);
  };
  cloud(Math.round(C*.40), 12, 1.25, PALE, 6);
  cloud(Math.round(C*.70), 9,  1.0,  PALE, 5);
  cloud(Math.round(C*.14), 16, .85,  PALE, 5);

  /* ---- 3. maisons à colombages ---- */
  const gable = (x,wd,top,c) => { for (let k = 0; k*2 < wd; k++) P(x+k, top-1-k, wd-2*k, 1, c); };
  const house = (x,wd,hh) => {
    const top = G - hh, mid = top + Math.round(hh*.45);
    P(x, mid, wd, G-mid, WALL);                               /* rez-de-chaussée */
    P(x-1, top, wd+2, mid-top, WALL);                         /* étage en encorbellement */
    P(x+wd-2, mid, 2, G-mid, SHADE);
    P(x+wd-1, top, 2, mid-top, SHADE);
    P(x-1, mid-1, wd+2, 1, DARK);                             /* sablière */
    for (let bx = x+1; bx < x+wd-1; bx += 3) P(bx, mid+1, 1, G-mid-2, SHADE);
    for (let bx = x; bx < x+wd; bx += 3) P(bx, top+1, 1, mid-top-2, SHADE);
    if (wd > 7){ P(x+1, top+2, 1, 1, SHADE); P(x+2, top+3, 1, 1, SHADE); }
    gable(x-2, wd+4, top, DARK);
    P(x-2, top, wd+4, 1, DARK);
    P(x+1, G-4, 2, 4, DARK);                                  /* porte */
    P(x+1, G-5, 2, 1, DARK);
    for (let yy = mid+2; yy < G-5; yy += 4)
      for (let xx = x+4; xx < x+wd-1; xx += 4){
        const lit = r() < .5;
        P(xx, yy, 2, 2, lit ? PALE : DARK);
        P(xx-1, yy, 1, 2, DARK); P(xx+2, yy, 1, 2, DARK);
        if (lit) lamps.push([xx,yy]);
      }
    if (r() < .5){ const cx = x+wd-3; P(cx, top-5, 2, 5, DARK); P(cx-1, top-6, 4, 1, SHADE); }
  };

  /* ---- 4. sol, remparts, porte ---- */
  P(0, G, C, 1, DARK);
  dith(0, G+1, C, R-G-1, SHADE, 5);
  for (let x = 0; x < C; x += 5) P(x, G+2, 3, 1, PALE);

  const cityEnd = Math.round(C*.52);
  const wallX = Math.round(C*.05);
  P(wallX, G-14, Math.round(C*.47), 14, WALL);
  P(wallX+Math.round(C*.46), G-14, 2, 14, SHADE);
  P(wallX, G-15, Math.round(C*.47), 1, DARK);
  for (let x = wallX; x < wallX + C*.47; x += 5) P(x, G-18, 3, 3, DARK);
  for (let x = wallX+2; x < wallX + C*.47; x += 9) P(x, G-11, 1, 4, DARK);
  const gx = wallX + 7;
  P(gx, G-23, 11, 23, WALL); P(gx+8, G-23, 3, 23, SHADE);
  P(gx-1, G-24, 13, 1, DARK);
  for (let k = 0; k < 13; k += 4) P(gx-1+k, G-27, 3, 3, DARK);
  for (let k = -1; k < 12; k += 3) P(gx+k, G-25, 2, 1, DARK);
  P(gx+3, G-9, 5, 9, DARK); P(gx+4, G-10, 3, 1, DARK);
  P(gx+4, G-7, 3, 1, SHADE); P(gx+4, G-4, 3, 1, SHADE);

  /* ---- 5. la cité ---- */
  let x = wallX + 22;
  const dense = [];
  while (x < cityEnd - 6){
    const wd = 7 + Math.floor(r()*5), hh = 11 + Math.floor(r()*13);
    dense.push([x,wd,hh]); x += wd + 2;
  }
  const sq = dense[Math.round(dense.length*.46)];
  const plazaX = sq ? sq[0] : wallX+46, plazaW = 24;
  for (const [hx,hw,hh] of dense) if (hx + hw < plazaX || hx > plazaX + plazaW) house(hx,hw,hh);
  P(plazaX, G-1, plazaW, 1, DARK);
  for (let i = 0; i < plazaW; i += 3) P(plazaX+i, G-2, 2, 1, PALE);
  const fx0 = plazaX + Math.round(plazaW/2);
  P(fx0-5, G-4, 11, 3, WALL); P(fx0-5, G-5, 11, 1, DARK); P(fx0-4, G-2, 9, 1, SHADE);
  P(fx0-1, G-12, 3, 7, WALL); P(fx0-4, G-14, 9, 2, WALL); P(fx0-4, G-15, 9, 1, DARK);
  P(fx0, G-18, 1, 3, DARK); P(fx0-2, G-17, 5, 1, DARK);
  for (const dx of [-3,3]) P(fx0+dx, G-11, 1, 6, PALE);

  /* ---- 6. la cathédrale ---- */
  const caX = Math.round(C*.255), navW = 28, navH = 30, towW = 9, towH = 46;
  const nt = G - navH;
  P(caX+towW, nt, navW, navH, WALL);
  P(caX+towW+navW-4, nt, 4, navH, SHADE);
  for (let k = 0; k*2 < navW+4; k++) P(caX+towW-2+k, nt-1-k, navW+4-2*k, 1, DARK);
  for (let i = 0; i < 3; i++){                                /* arcs-boutants */
    const bx = caX+towW+5+i*9;
    P(bx, G-9, 3, 9, WALL); P(bx, G-10, 3, 1, DARK);
    for (let k = 0; k < 6; k++) P(bx+3+k, G-10-Math.round(k*1.4), 1, 1, SHADE);
    P(bx+1, G-14, 1, 4, DARK);
  }
  P(caX+towW+navW/2-4, nt+7, 9, 9, DARK);                     /* rosace */
  P(caX+towW+navW/2-3, nt+8, 7, 7, PALE);
  P(caX+towW+navW/2-1, nt+10, 3, 3, DARK);
  P(caX+towW+navW/2, nt+8, 1, 7, DARK); P(caX+towW+navW/2-3, nt+11, 7, 1, DARK);
  for (let i = 0; i < 4; i++){                                /* ogives */
    const ox = caX+towW+4+i*6;
    P(ox, G-15, 4, 15, DARK); P(ox+1, G-17, 2, 2, DARK);
    P(ox+1, G-13, 2, 9, PALE); lamps.push([ox+1, G-13]);
  }
  const spire = (cx,base,hh,halfw) => {
    for (let k = 0; k <= hh; k++){
      const hw = Math.round((hh-k)/hh * halfw);
      P(cx-hw, base-k, hw*2+1, 1, k % 3 === 0 ? SHADE : DARK);
    }
  };
  for (const tx of [caX, caX+towW+navW]){
    P(tx, G-towH, towW, towH, WALL);
    P(tx+towW-3, G-towH, 3, towH, SHADE);
    for (let yy = G-towH+6; yy < G-10; yy += 9){
      P(tx+2, yy, 2, 6, DARK); P(tx+3, yy+1, 1, 4, PALE);
    }
    P(tx-1, G-towH-1, towW+2, 1, DARK);
    for (let k = 0; k < towW+2; k += 3) P(tx-1+k, G-towH-4, 2, 3, DARK);
    spire(tx+Math.floor(towW/2), G-towH-4, 16, Math.floor(towW/2)+1);
    P(tx+Math.floor(towW/2), G-towH-22, 1, 5, DARK);
    P(tx+Math.floor(towW/2)-2, G-towH-20, 5, 1, DARK);
  }

  /* ---- 7. le château, sur sa motte ---- */
  const kX = Math.round(C*.435);
  for (let k = 0; k < 9; k++) dith(kX-14+k, G-k, 36-2*k, 1, k > 6 ? WALL : SHADE, 6);
  const kg = G-8;
  P(kX-6, kg-26, 24, 26, WALL); P(kX+14, kg-26, 4, 26, SHADE);
  for (let yy = kg-22; yy < kg-4; yy += 7){ P(kX-2, yy, 2, 5, DARK); P(kX+8, yy, 2, 5, DARK); }
  P(kX-7, kg-27, 26, 1, DARK);
  for (let k = -7; k < 19; k += 3) P(kX+k, kg-29, 1, 2, SHADE);  /* mâchicoulis */
  P(kX-7, kg-30, 26, 1, DARK);
  for (let k = 0; k < 26; k += 5) P(kX-7+k, kg-33, 3, 3, DARK);
  for (const [tx,th] of [[kX-12,34],[kX+17,30]]){
    P(tx, kg-th, 8, th, WALL); P(tx+6, kg-th, 2, th, SHADE);
    for (let yy = kg-th+7; yy < kg-5; yy += 8) P(tx+3, yy, 2, 5, DARK);
    P(tx-1, kg-th-1, 10, 1, DARK);
    for (let k = -1; k < 9; k += 3) P(tx+k, kg-th-4, 2, 3, DARK);
    spire(tx+4, kg-th-4, 11, 5);
  }
  P(kX+6, kg-44, 1, 9, DARK);
  P(kX+7, kg-44, 9, 5, SHADE); P(kX+7, kg-44, 9, 1, DARK); P(kX+13, kg-41, 3, 2, PALE);
  P(kX+2, kg-10, 5, 10, DARK); P(kX+3, kg-11, 3, 1, DARK);

  /* nuage passant DEVANT le château */
  cloud(Math.round(C*.47), 26, 1.05, PALE, 7);

  /* ---- 8. la campagne ---- */
  let fx = cityEnd + 10;
  while (fx < C*.70){
    house(fx, 6 + Math.floor(r()*3), 8 + Math.floor(r()*5));
    if (r() < .5){ const bx = fx + 12;
      P(bx, G-9, 13, 9, SHADE); gable(bx-1, 15, G-9, DARK); P(bx+5, G-5, 3, 5, DARK); }
    fx += 22 + Math.floor(r()*16);
  }
  const mlX = Math.round(C*.645), mlY = G-22;
  /* Le moulin se redessine à chaque tour. Effacer sa boîte emporterait le fond
     qui s'y trouve — collines, rais, sol. On en garde donc une empreinte prise
     AVANT que le moulin n'existe, et on la restitue à chaque image. */
  /* La boîte doit couvrir la course COMPLÈTE des ailes : centre en mlY-8,
     rayon 12, plus 2 de décalage d'ombre — soit mlY-22 au plus haut et
     mlX±14 de part et d'autre. Trop courte, elle laisse gravée la première
     position des ailes au-dessus d'elle. */
  const mill = { x: mlX-16, y: mlY-25, w: 33, h: 51 };
  const mb = {
    x: Math.max(0, Math.round(mill.x*S*dpr)),
    y: Math.max(0, Math.round(mill.y*S*dpr)),
  };
  mb.w = Math.min(cv.width  - mb.x, Math.round(mill.w*S*dpr));
  mb.h = Math.min(cv.height - mb.y, Math.round(mill.h*S*dpr));
  let millBg = null;
  const drawMill = ph => {
    if (mb.w > 0 && mb.h > 0){
      if (!millBg) millBg = g.getImageData(mb.x, mb.y, mb.w, mb.h);
      else g.putImageData(millBg, mb.x, mb.y);
    }
    P(mlX-5, mlY, 11, 22, WALL); P(mlX+3, mlY, 3, 22, SHADE);
    for (let yy = mlY+4; yy < mlY+18; yy += 7) P(mlX-1, yy, 2, 4, DARK);
    P(mlX-6, mlY-1, 13, 1, DARK);
    for (let k = 0; k < 5; k++) P(mlX-5+k, mlY-2-k, 11-2*k, 1, DARK);
    for (let i = 0; i < 4; i++){
      const a = (i*Math.PI/2) + ph*Math.PI/8;
      for (let t = 2; t <= 12; t++){
        const ax = Math.round(mlX + Math.cos(a)*t), ay = Math.round(mlY-8 + Math.sin(a)*t);
        P(ax, ay, 1, 1, DARK);
        if (t > 4){
          const nx = Math.abs(Math.cos(a)) > .5 ? 0 : 1, ny = Math.abs(Math.cos(a)) > .5 ? 1 : 0;
          P(ax+nx, ay+ny, 1, 1, SHADE); P(ax+nx*2, ay+ny*2, 1, 1, PALE);
        }
      }
    }
    P(mlX-1, mlY-9, 3, 3, DARK);
  };
  drawMill(0);

  /* ---- 9. les champs ---- */
  const fieldX = Math.round(C*.69);
  for (let i = 0; i < 9; i++){
    const y = G + 1 + i;
    for (let xx = fieldX + i*4; xx < C; xx += 6 + i) P(xx, y, 4, 1, PALE);
  }
  for (let xx = fieldX + 6; xx < C*.88; xx += 26){
    P(xx, G-6, 7, 6, SHADE); P(xx+1, G-8, 5, 2, SHADE); P(xx+2, G-9, 3, 1, SHADE);
    P(xx, G-6, 7, 1, DARK);
  }
  for (let xx = fieldX - 4; xx < C; xx += 8){ P(xx, G-4, 1, 4, SHADE); P(xx-1, G-4, 3, 1, SHADE); }

  /* ---- 10. la forêt et la tour du sorcier ---- */
  const forX = Math.round(C*.79);
  const broad = (tx,ty,sz) => {
    for (let k = 0; k < sz; k++){
      const hw = Math.round(k*.78);
      P(tx-hw, ty-sz+k, hw*2+1, 1, k < 2 ? DARK : (k % 2 ? SHADE : WALL));
    }
    P(tx-1, ty-sz+2, 1, Math.round(sz*.5), DARK);
    P(tx, ty, 1, 2, DARK);
  };
  const conif = (tx,ty,sz) => {
    for (let tier = 0; tier < 3; tier++){
      const base = ty - Math.round(sz*tier*.3), hh = Math.round(sz*(.55 - tier*.11));
      for (let k = 0; k <= hh; k++){
        const hw = Math.round((hh-k)*.9);
        P(tx-hw, base-k-Math.round(sz*.18)*tier, hw*2+1, 1, k < 1 ? DARK : (tier % 2 ? SHADE : WALL));
      }
    }
    P(tx, ty, 1, 3, DARK);
  };
  const wzX = Math.round(C*.885);
  for (let xx = forX; xx < C+8; xx++){
    if (Math.abs(xx - wzX) < 7) continue;
    const dens = (xx - forX) / Math.max(1, C - forX);
    if (r() < .34 + dens*.95){
      const sz = 7 + Math.floor(r()*9);
      r() < .45 ? conif(xx, G - Math.floor(r()*3), sz) : broad(xx, G - Math.floor(r()*3), sz);
    }
  }
  /* la tour : fine, légèrement renflée, coiffée d'un cône */
  const wzH = 40;
  for (let k = 0; k < wzH; k++){
    const wdt = 7 + Math.round(Math.sin(k*.17)*1.4);
    P(wzX - Math.floor(wdt/2), G-k, wdt, 1, k % 7 === 3 ? SHADE : WALL);
    P(wzX + Math.ceil(wdt/2) - 2, G-k, 2, 1, SHADE);
  }
  P(wzX-5, G-wzH-1, 11, 1, DARK);
  P(wzX-6, G-wzH-3, 13, 2, WALL); P(wzX-6, G-wzH-4, 13, 1, DARK);
  for (let k = 0; k <= 15; k++){                               /* cône */
    const hw = Math.round((15-k)/15 * 6);
    P(wzX-hw, G-wzH-4-k, hw*2+1, 1, k % 3 === 1 ? SHADE : DARK);
  }
  P(wzX, G-wzH-22, 1, 4, DARK);
  P(wzX-1, G-wzH-23, 3, 1, PALE);
  for (const yy of [G-10, G-20, G-30]){                        /* fenêtres */
    P(wzX-2, yy, 4, 5, DARK); P(wzX-1, yy+1, 2, 3, PALE);
    lamps.push([wzX-1, yy+1]);
  }
  for (let i = 0; i < 9; i++){                                 /* étincelles */
    const sx = wzX + Math.round((r()-.5)*24), sy = G-wzH-10-Math.floor(r()*16);
    P(sx, sy, 1, 1, PALE);
  }

  /* ---- vie ---- */
  let raf = 0, t = 0, ph = 0;
  const live = lamps.filter(() => r() < .5);
  const tick = () => {
    raf = 0; t++;
    if (t % 11 === 0){ ph = (ph+1) % 16; drawMill(ph); }
    if (t % 38 === 0)
      for (const [lx,ly] of live)
        if (Math.random() < .26) P(lx, ly, 2, 2, Math.random() < .5 ? PALE : DARK);
    raf = requestAnimationFrame(tick);
  };
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) raf = requestAnimationFrame(tick);
  return () => { if (raf) cancelAnimationFrame(raf); };
}

/* ---- le dé à douze faces, à gauche du Sort ----
   Un dodécaèdre vu de face se construit tout seul : un pentagone central, cinq
   pentagones autour, le tout inscrit dans un décagone. Les arêtes radiales
   partent des sommets du pentagone central vers la silhouette. C'est cette
   structure qui le rend reconnaissable, pas le nombre de traits.
   Il « roule » en changeant le chiffre de sa face : aucune rotation ne tombe
   sur la grille du pixel. ---- */
/* ⚠️ ÉCHAFAUDAGE DE PROTOTYPE — huit jaquettes engendrées, pour que la teinte
   du haut de fiche ait des pages où se montrer. Dans l'application, une
   jaquette vient de la source ou d'un import : rien n'y est jamais engendré,
   et rien de tout ceci ne passe le portage. */
function madeCover(id){
  let x = 0; for (const ch of id) x = (x*31 + ch.charCodeAt(0)) >>> 0;
  const r = rng(x || 7);
  const h1 = (r()*360)|0, h2 = (h1 + 30 + (r()*90|0)) % 360;
  const c = document.createElement("canvas"); c.width = 400; c.height = 600;
  const g = c.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 400, 600);
  grd.addColorStop(0,   `hsl(${h1} 64% 50%)`);
  grd.addColorStop(.52, `hsl(${h2} 56% 31%)`);
  grd.addColorStop(1,   `hsl(${h2} 46% 11%)`);
  g.fillStyle = grd; g.fillRect(0, 0, 400, 600);
  g.globalAlpha = .5; g.fillStyle = `hsl(${(h1 + 180) % 360} 78% 62%)`;
  g.beginPath(); g.arc(120 + r()*160, 180 + r()*200, 70 + r()*70, 0, 6.2832); g.fill();
  g.globalAlpha = .22; g.fillStyle = "#000";
  for (let i = 0; i < 3; i++){
    const y = r()*600;
    g.beginPath(); g.moveTo(0, y); g.lineTo(400, y - 120 + r()*240);
    g.lineTo(400, y + 60); g.lineTo(0, y + 90); g.closePath(); g.fill();
  }
  g.globalAlpha = 1;
  return c.toDataURL("image/jpeg", .72);
}
for (const id of ["g-elden","g-outer","f-dune","f-past","s-sever","s-arcane","b-horde","b-piranesi"])
  if (CATALOG[id]) CATALOG[id].cover = madeCover(id);

const DIE_FACES = ["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];
function drawDie(cv, face){
  const dpr = Math.min(devicePixelRatio || 1, 2), S = 2;
  const w = cv.offsetWidth, h = cv.offsetHeight;
  if (!w || !h) return;
  if (cv.width !== Math.round(w*dpr)){ cv.width = Math.round(w*dpr); cv.height = Math.round(h*dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0); g.imageSmoothingEnabled = false;
  g.clearRect(0,0,w,h);
  const P = (x,y,n,m,c) => { g.fillStyle = c; g.fillRect(Math.round(x)*S, Math.round(y)*S, Math.round(n)*S, Math.round(m)*S); };
  const [DARK, SHADE, WALL, PALE] = GREY;

  const line = (x0,y0,x1,y1,c) => {
    let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0);
    const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let err = dx - dy, x = x0, y = y0;
    for (let i = 0; i < 300; i++){
      P(x,y,1,1,c);
      if (x === x1 && y === y1) break;
      const e2 = 2*err;
      if (e2 > -dy){ err -= dy; x += sx; }
      if (e2 <  dx){ err += dx; y += sy; }
    }
  };
  const poly = (pts,c) => {
    const ys = pts.map(p => p[1]);
    for (let y = Math.round(Math.min(...ys)); y <= Math.round(Math.max(...ys)); y++){
      const xs = [];
      for (let i = 0; i < pts.length; i++){
        const [ax,ay] = pts[i], [bx,by] = pts[(i+1)%pts.length];
        if ((ay <= y && by > y) || (by <= y && ay > y)) xs.push(ax + (y-ay)/(by-ay)*(bx-ax));
      }
      xs.sort((a,b) => a-b);
      for (let i = 0; i+1 < xs.length; i += 2)
        P(Math.round(xs[i]), y, Math.max(1, Math.round(xs[i+1]-xs[i])), 1, c);
    }
  };

  const cx = 20, cy = 21, R = 19, ri = 10.6, rad = a => a*Math.PI/180;
  const pt = (a,r) => [cx + Math.cos(rad(a))*r, cy - Math.sin(rad(a))*r];
  const inner = [0,1,2,3,4].map(k => pt(126 + 72*k, ri));

  /* les cinq faces latérales, du plus clair en haut au plus sombre en bas */
  const sides = [];
  for (let k = 0; k < 5; k++){
    const f = [ inner[k], pt(126+72*k, R), pt(162+72*k, R), pt(198+72*k, R), inner[(k+1)%5] ];
    const my = f.reduce((s0,p0) => s0 + p0[1], 0) / 5;
    sides.push({ f, my });
  }
  const order = [...sides].sort((a,b) => a.my - b.my);
  const tones = [PALE, WALL, WALL, SHADE, SHADE];
  order.forEach((sd,i) => poly(sd.f, tones[i]));
  poly(inner, PALE);                              /* la face de devant */

  for (const sd of sides){                        /* arêtes */
    for (let i = 0; i < 5; i++){
      const [x0,y0] = sd.f[i], [x1,y1] = sd.f[(i+1)%5];
      line(Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), SHADE);
    }
  }
  for (let i = 0; i < 5; i++){                    /* le décagone, plus marqué */
    const a0 = 126 + 72*i;
    for (const [s0,s1] of [[0,36],[36,72]]){
      const [x0,y0] = pt(a0+s0, R), [x1,y1] = pt(a0+s1, R);
      line(Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), DARK);
    }
  }
  for (let i = 0; i < 5; i++){                    /* le pentagone de devant */
    const [x0,y0] = inner[i], [x1,y1] = inner[(i+1)%5];
    line(Math.round(x0), Math.round(y0), Math.round(x1), Math.round(y1), DARK);
  }

  const glyph = (ch,x,y,c) => {
    if (ch === "I"){ P(x+1,y,1,5,c); P(x,y,3,1,c); P(x,y+4,3,1,c); }
    else if (ch === "V"){ line(x,y,x+1,y+4,c); line(x+2,y,x+1,y+4,c); }
    else { line(x,y,x+2,y+4,c); line(x+2,y,x,y+4,c); }
  };
  const chars = (face || "XII").split("");
  let gx = cx - Math.floor((chars.length*4 - 1)/2);
  for (const ch of chars){ glyph(ch, gx, cy-2, SHADE); gx += 4; }

  /* un chiffre discret sur les deux faces hautes, comme sur un vrai dé */
  glyph("V", Math.round(pt(162, (R+ri)/2)[0])-1, Math.round(pt(162, (R+ri)/2)[1])-2, WALL);
  glyph("X", Math.round(pt(90,  (R+ri)/2)[0])-1, Math.round(pt(90,  (R+ri)/2)[1])-2, WALL);
}

/* ---- la carte du Royaume ----
   Une fresque, pas un semis : cinq territoires d'Ordre, chacun avec sa texture
   de terrain et son monument ; une mer à l'est dont la côte est découpée ; un
   fleuve né des cimes ; des routes sinueuses, jamais d'équerre. Les ornements
   d'une vieille carte — rose des vents, cartouche, cercle de pierres, épave —
   donnent à chaque coin quelque chose à trouver. ---- */
const KINGDOM = { C:840, R:580, S:2 };

/* Une géographie qui existe pour elle-même : les Ordres n'ont pas de fief ici,
   ils y auront peut-être une ville un jour. Rien dans ces noms ne leur
   appartient. */
const REGIONS = [
  { name:"Les Hautes Dents",    x:168, y:112 },
  { name:"Le Plateau Brûlé",    x:592, y:118 },
  { name:"La Sylve Ancienne",   x:132, y:392 },
  { name:"Les Marais d'Avren",  x:360, y:486 },
  { name:"Les Coteaux de Vèze", x:620, y:410 },
  { name:"Les Landes Grises",   x:388, y:206 },
  { name:"La Mer Close",        x:790, y:300 },
];
const PLACES = [
  { x:404, y:292, n:"Hauteclaire",            k:"keep" },
  { x:150, y:96,  n:"La Tour Veilleuse",      k:"tower" },
  { x:596, y:104, n:"Fort-Serre",             k:"citadel" },
  { x:128, y:402, n:"Le Grand Chêne",         k:"tree" },
  { x:352, y:498, n:"Le Sanctuaire Noyé",     k:"temple" },
  { x:630, y:420, n:"L'Amphithéâtre Oublié",  k:"amphi" },
  { x:742, y:432, n:"Port-Vieux",             k:"port" },
  { x:276, y:174, n:"Guéret",             k:"town", s:2 },
  { x:508, y:214, n:"Haute-Roche",        k:"town", s:2 },
  { x:232, y:330, n:"Les Futaies",        k:"town", s:1 },
  { x:548, y:328, n:"Rive-Basse",         k:"town", s:2 },
  { x:338, y:388, n:"Source-Claire",      k:"town", s:1 },
  { x:452, y:132, n:"Les Cairns",         k:"ruin" },
  { x:214, y:252, n:"Le Cercle de Pierres", k:"stones" },
  { x:668, y:238, n:"Le Pont Rompu",      k:"bridge" },
];

function buildKingdom(){
  const { C, R, S } = KINGDOM;
  const cv = document.createElement("canvas");
  cv.width = C*S; cv.height = R*S;
  const g = cv.getContext("2d"); g.imageSmoothingEnabled = false;
  const P = (x,y,n,m,c) => { g.fillStyle = c; g.fillRect(Math.round(x)*S, Math.round(y)*S, Math.round(n)*S, Math.round(m)*S); };
  const r = rng(1377);
  const [DARK, SHADE, WALL, PALE] = GREY;
  const water = [], lights = [];
  const nz = (x,y,k) => Math.sin(x*.031+k)*1 + Math.sin(y*.027-k)*1 + Math.sin((x+y)*.013+k*2)*.8;

  /* ---------- la mer, et sa côte découpée ---------- */
  const coast = y => Math.round(C*.80 + Math.sin(y*.0185)*34 + Math.sin(y*.047)*15
                     + Math.sin(y*.0075)*26 - (y > R*.62 ? 46 : 0));
  for (let y = 0; y < R; y++){
    const cx = coast(y);
    P(cx, y, 2, 1, SHADE);
    for (let x = cx+2; x < C; x++) if (((x*3 + y*5) % 11) < 3) P(x, y, 1, 1, PALE);
    if (y % 9 === 0) for (let x = cx+6; x < C-4; x += 14){            /* vaguelettes */
      const o = Math.round(Math.sin((x+y)*.08)*2);
      P(x, y+o, 4, 1, WALL); P(x+5, y+o+1, 3, 1, WALL);
      if (r() < .25) water.push([x, y+o]);
    }
  }
  for (const [ix,iy,ir] of [[806,176,9],[772,508,7],[822,392,5]]){     /* îlots */
    for (let y = -ir; y <= ir; y++) for (let x = -ir; x <= ir; x++)
      if (x*x/(ir*ir) + y*y/(ir*ir*.6) < 1) P(ix+x, iy+y, 1, 1, WALL);
    P(ix-ir, iy, ir*2, 1, SHADE);
  }

  /* ---------- textures de territoire ---------- */
  const zone = (cx,cy,rx,ry,fn) => {
    for (let y = cy-ry; y <= cy+ry; y++) for (let x = cx-rx; x <= cx+rx; x++){
      if (x < 2 || y < 2 || x > C-3 || y > R-3) continue;
      const d = ((x-cx)/rx)**2 + ((y-cy)/ry)**2 + nz(x,y,1)*.055;
      if (d < 1 && x < coast(y)-2) fn(x,y,d);
    }
  };
  /* landes : semis clairsemé */
  zone(392,208,186,112,(x,y)=>{ if (((x*5+y*3)%23)===0) P(x,y,1,1,PALE); });
  /* val chantant : terrasses */
  zone(624,414,132,96,(x,y)=>{ if (y%6===0 && ((x+Math.round(nz(x,y,3)*3))%4)<2) P(x,y,2,1,PALE); });
  /* marche rouge : hachures obliques */
  zone(588,120,146,96,(x,y)=>{ if (((x+y)%7)===0) P(x,y,1,1,WALL); });
  /* rives claires : roseaux */
  zone(356,492,152,74,(x,y)=>{ if (((x*7+y)%19)===0) P(x,y,1,2,PALE); });

  /* ---------- lacs et marais ---------- */
  const lake = (lx,ly,rx,ry) => {
    for (let y = -ry; y <= ry; y++) for (let x = -rx; x <= rx; x++){
      const d = x*x/(rx*rx) + y*y/(ry*ry) + nz(lx+x,ly+y,2)*.07;
      if (d < 1){ P(lx+x, ly+y, 1, 1, WALL); if (r() < .05) water.push([lx+x,ly+y]); }
      else if (d < 1.12) P(lx+x, ly+y, 1, 1, SHADE);
    }
  };
  lake(338,506,74,30); lake(214,462,30,16); lake(468,470,22,13); lake(560,246,26,15);

  /* ---------- le fleuve, né des cimes ---------- */
  const flow = (pts,wd) => {
    for (let i = 0; i < pts.length-1; i++){
      const [x0,y0] = pts[i], [x1,y1] = pts[i+1];
      const n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
      for (let t = 0; t <= n; t++){
        const u = t/n;
        const x = Math.round(x0 + (x1-x0)*u + Math.sin(u*Math.PI*2 + i)*7);
        const y = Math.round(y0 + (y1-y0)*u + Math.cos(u*Math.PI*3 + i)*5);
        const w = Math.max(1, Math.round(wd*(.5 + u*.6)));
        P(x, y, w, 1, WALL); P(x-1, y, 1, 1, SHADE); P(x+w, y, 1, 1, SHADE);
        if (r() < .04) water.push([x,y]);
      }
    }
  };
  flow([[176,140],[244,208],[296,268],[352,330],[404,404],[452,470],[520,520],[600,548]],4);
  flow([[560,170],[526,232],[478,282],[430,330]],2);

  /* ---------- montagnes ---------- */
  const peak = (x,y,hh) => {
    for (let k = 0; k <= hh; k++){
      const hw = Math.round((hh-k)*.84);
      P(x-hw, y-k, hw*2+1, 1, WALL);
      P(x-hw, y-k, Math.max(1,Math.round(hw*.55)), 1, SHADE);
    }
    for (let k = 0; k < Math.min(4,hh); k++) P(x-Math.round(k*.84), y-hh+k, Math.round(k*.84)*2+1, 1, PALE);
    P(x, y-hh, 1, 1, DARK);
  };
  const range = (pts,n,base) => {
    for (let i = 0; i < n; i++){
      const u = i/(n-1||1), k = Math.min(pts.length-2, Math.floor(u*(pts.length-1)));
      const v = u*(pts.length-1) - k;
      const x = Math.round(pts[k][0] + (pts[k+1][0]-pts[k][0])*v);
      const y = Math.round(pts[k][1] + (pts[k+1][1]-pts[k][1])*v + (r()-.5)*12);
      peak(x, y, base + Math.floor(r()*9));
    }
  };
  range([[62,150],[130,96],[216,70],[300,92],[356,146]], 22, 13);   /* les Cimes */
  range([[498,76],[566,62],[648,84],[700,128]], 15, 10);            /* la Marche */
  range([[690,296],[730,348],[748,406]], 7, 8);

  /* ---------- forêts ---------- */
  const tree = (x,y,sz) => {
    for (let k = 0; k < sz; k++){
      const hw = Math.round(k*.8);
      P(x-hw, y-sz+k, hw*2+1, 1, k < 1 ? SHADE : WALL);
    }
    P(x, y, 1, 1, SHADE);
  };
  const wood = (cx,cy,rx,ry,dens) => {
    for (let i = 0; i < rx*ry*dens/90; i++){
      const a = r()*6.2832, rad = Math.sqrt(r());
      const x = Math.round(cx + Math.cos(a)*rx*rad), y = Math.round(cy + Math.sin(a)*ry*rad);
      if (x > 3 && y > 3 && x < coast(y)-3 && y < R-3) tree(x, y, 4 + Math.floor(r()*4));
    }
  };
  wood(140,398,118,92,5.5); wood(250,330,62,40,3.4); wood(600,452,86,56,3);
  wood(300,160,54,34,2.4); wood(470,392,44,30,2.6); wood(688,180,50,36,2.2);

  /* ---------- routes sinueuses ---------- */
  const road = (pts) => {
    let i = 0;
    for (let s0 = 0; s0 < pts.length-1; s0++){
      const [x0,y0] = pts[s0], [x1,y1] = pts[s0+1];
      const n = Math.max(Math.abs(x1-x0), Math.abs(y1-y0));
      for (let t = 0; t <= n; t++){
        const u = t/n;
        const x = Math.round(x0 + (x1-x0)*u + Math.sin(u*Math.PI*2.2 + s0*1.7)*11);
        const y = Math.round(y0 + (y1-y0)*u + Math.cos(u*Math.PI*1.8 + s0*2.3)*9);
        if ((i++ % 5) < 3) P(x, y, 1, 1, SHADE);
      }
    }
  };
  road([[404,292],[330,228],[260,180],[180,120]]);
  road([[404,292],[470,236],[530,180],[590,116]]);
  road([[404,292],[330,330],[240,370],[146,400]]);
  road([[404,292],[386,370],[360,440],[352,492]]);
  road([[404,292],[500,320],[572,370],[628,414]]);
  road([[628,414],[700,424],[742,430]]);
  road([[276,174],[360,196],[452,180],[508,214]]);

  /* ---------- monuments et bourgs ---------- */
  const crenel = (x,y,w,c) => { for (let k = 0; k < w; k += 3) P(x+k, y, 2, 2, c); };
  const house = (x,y,w,h) => { P(x,y,w,h,WALL); P(x-1,y-1,w+2,1,SHADE); P(x,y-2,w,1,SHADE); P(x+w-1,y,1,h,SHADE); };
  const build = {
    keep(x,y){
      for (let k = 0; k < 7; k++) P(x-22+k, y+8-k, 44-2*k, 1, k > 4 ? WALL : SHADE);
      P(x-16, y-14, 32, 22, WALL); P(x+12, y-14, 4, 22, SHADE);
      P(x-17, y-15, 34, 1, SHADE); crenel(x-17, y-18, 34, SHADE);
      for (const tx of [x-22, x-4, x+14]){
        P(tx, y-30, 9, 38, WALL); P(tx+6, y-30, 3, 38, SHADE);
        P(tx-1, y-31, 11, 1, SHADE); crenel(tx-1, y-34, 11, SHADE);
        for (let k = 0; k <= 9; k++) P(tx+4-Math.round((9-k)*.45), y-35-k, Math.round((9-k)*.45)*2+1, 1, SHADE);
        P(tx+4, y-20, 2, 3, DARK); lights.push([tx+4, y-20]);
      }
      P(x+4, y-50, 1, 8, SHADE); P(x+5, y-50, 8, 4, WALL);
      P(x-4, y-4, 5, 12, DARK);
    },
    tower(x,y){
      for (let k = 0; k < 46; k++){
        const w = 9 + Math.round(Math.sin(k*.14)*2);
        P(x-Math.floor(w/2), y-k, w, 1, k%8===3 ? SHADE : WALL);
      }
      P(x-6, y-47, 13, 2, SHADE);
      for (let k = 0; k <= 17; k++) P(x-Math.round((17-k)*.42), y-49-k, Math.round((17-k)*.42)*2+1, 1, k%3===1?WALL:SHADE);
      for (const yy of [y-14, y-26, y-38]){ P(x-2, yy, 5, 6, DARK); lights.push([x-1, yy+1]); }
      for (let i = 0; i < 7; i++) P(x + Math.round((r()-.5)*30), y-56-Math.floor(r()*18), 1, 1, PALE);
    },
    citadel(x,y){
      P(x-34, y-4, 68, 12, WALL); P(x-35, y-5, 70, 1, SHADE); crenel(x-35, y-8, 70, SHADE);
      for (const tx of [-34,-14,8,26]){
        P(x+tx, y-26, 10, 34, WALL); P(x+tx+7, y-26, 3, 34, SHADE);
        P(x+tx-1, y-27, 12, 1, SHADE); crenel(x+tx-1, y-30, 12, SHADE);
        P(x+tx+4, y-16, 2, 4, DARK);
      }
      P(x-2, y-42, 1, 12, SHADE); P(x-1, y-42, 10, 5, WALL); P(x-1, y-42, 10, 1, SHADE);
      P(x-4, y-2, 7, 10, DARK);
    },
    tree(x,y){
      P(x-2, y-10, 5, 12, SHADE);
      for (let k = 0; k < 26; k++){
        const hw = Math.round(Math.sin((k/26)*Math.PI)*22);
        P(x-hw, y-12-k, hw*2+1, 1, k < 2 || k > 23 ? SHADE : (k%3===0 ? SHADE : WALL));
      }
      for (let i = 0; i < 14; i++) P(x + Math.round((r()-.5)*44), y-14-Math.floor(r()*24), 1, 1, PALE);
      for (const dx of [-16,16]) { P(x+dx, y-6, 2, 8, SHADE); }
    },
    temple(x,y){
      for (let k = 0; k < 5; k++) P(x-26+k, y+6-k, 52-2*k, 1, WALL);
      P(x-18, y-10, 36, 16, WALL); P(x+14, y-10, 4, 16, SHADE);
      for (let i = -15; i <= 13; i += 7){ P(x+i, y-9, 3, 15, SHADE); P(x+i, y-10, 3, 1, DARK); }
      P(x-20, y-12, 40, 2, SHADE);
      for (let k = 0; k <= 13; k++){                             /* coupole */
        const hw = Math.round(Math.cos((k/13)*1.57)*15);
        P(x-hw, y-13-k, hw*2+1, 1, k%4===1 ? SHADE : WALL);
      }
      P(x, y-32, 1, 6, SHADE); P(x-2, y-30, 5, 1, SHADE);
      lights.push([x, y-20]);
    },
    amphi(x,y){
      for (let k = 0; k < 9; k++){
        const rx = 30 - k*3, ry = 13 - k;
        for (let a = 0; a < 3.15; a += .04){
          const px0 = Math.round(x + Math.cos(a)*rx), py0 = Math.round(y - Math.sin(a)*ry);
          P(px0, py0, 1, 1, k%2 ? SHADE : WALL);
        }
      }
      P(x-9, y-2, 19, 3, SHADE);
      for (const dx of [-26,26]) P(x+dx, y-16, 3, 16, SHADE);
    },
    port(x,y){
      house(x-14,y-6,9,6); house(x-2,y-8,10,8); house(x+10,y-5,8,5);
      P(x-20, y+1, 42, 2, SHADE);
      for (let i = 0; i < 3; i++){                                /* quais et mâts */
        const sx = x + 10 + i*12, sy = y + 6 + i*3;
        P(sx-5, sy, 11, 2, SHADE); P(sx, sy-12, 1, 12, SHADE);
        for (let k = 0; k < 9; k++) P(sx+1, sy-11+k, Math.round(k*.6)+1, 1, WALL);
      }
    },
    town(x,y,s){
      const n = 4 + s*4;
      for (let i = 0; i < n; i++)
        house(x + Math.round((r()-.5)*s*17), y + Math.round((r()-.5)*s*13), 4+Math.floor(r()*3), 4);
      if (s >= 2){ P(x-1, y-13, 3, 12, SHADE); P(x-3, y-17, 7, 4, WALL); P(x-3, y-18, 7, 1, SHADE);
        for (let k = 0; k <= 5; k++) P(x-Math.round((5-k)*.7), y-19-k, Math.round((5-k)*.7)*2+1, 1, SHADE); }
      if (r() < .6) lights.push([x, y]);
    },
    ruin(x,y){
      for (const [dx,hh] of [[-16,14],[-4,20],[9,11],[18,16]]){
        P(x+dx, y-hh, 6, hh, WALL); P(x+dx+4, y-hh, 2, hh, SHADE);
        for (let k = 0; k < 6; k += 2) if (r() < .6) P(x+dx+k, y-hh-1, 2, 2, SHADE);
      }
      P(x-20, y, 44, 2, SHADE);
      for (let i = 0; i < 7; i++) P(x + Math.round((r()-.5)*44), y + 3 + Math.floor(r()*5), 2, 1, WALL);
    },
    stones(x,y){
      for (let i = 0; i < 9; i++){
        const a = i/9*6.2832;
        const sx = Math.round(x + Math.cos(a)*19), sy = Math.round(y + Math.sin(a)*10);
        P(sx-1, sy-9, 4, 10, WALL); P(sx+2, sy-9, 1, 10, SHADE); P(sx-1, sy-10, 4, 1, SHADE);
      }
      for (let a = 0; a < 6.28; a += .09){
        const sx = Math.round(x + Math.cos(a)*19), sy = Math.round(y + Math.sin(a)*10);
        if (((sx+sy) % 3) === 0) P(sx, sy+2, 1, 1, PALE);
      }
    },
    bridge(x,y){
      P(x-26, y, 20, 3, WALL); P(x+8, y, 18, 3, WALL);
      for (let k = 0; k < 9; k++){ P(x-24+k*2, y+3, 2, 5+k, SHADE); }
      P(x+10, y+3, 2, 9, SHADE); P(x+20, y+3, 2, 7, SHADE);
      for (let i = 0; i < 5; i++) P(x-6+Math.round((r()-.5)*12), y+9+Math.floor(r()*6), 2, 1, WALL);
    },
  };
  for (const pl of PLACES) (build[pl.k] || build.town)(pl.x, pl.y, pl.s || 1);

  /* ---------- ornements de vieille carte ---------- */
  /* rose des vents, au large */
  const rx0 = 792, ry0 = 112;
  for (let k = 0; k < 4; k++){
    const a = k*Math.PI/2;
    for (let t = 0; t <= 22; t++){
      const hw = Math.round((22-t)*.2);
      const px0 = Math.round(rx0 + Math.cos(a)*t), py0 = Math.round(ry0 + Math.sin(a)*t);
      P(px0-hw, py0-hw, hw*2+1, hw*2+1, t > 16 ? SHADE : WALL);
    }
  }
  for (let k = 0; k < 4; k++){
    const a = k*Math.PI/2 + Math.PI/4;
    for (let t = 0; t <= 13; t++)
      P(Math.round(rx0 + Math.cos(a)*t), Math.round(ry0 + Math.sin(a)*t), 1, 1, PALE);
  }
  for (let a = 0; a < 6.28; a += .05){
    P(Math.round(rx0+Math.cos(a)*26), Math.round(ry0+Math.sin(a)*26), 1, 1, PALE);
    if (((Math.round(a*20)) % 3) === 0)
      P(Math.round(rx0+Math.cos(a)*29), Math.round(ry0+Math.sin(a)*29), 1, 1, WALL);
  }
  P(rx0-1, ry0-30, 3, 5, SHADE);

  /* épave, au sud-est */
  const wx = 778, wy = 548;
  P(wx-14, wy, 26, 3, SHADE);
  for (let k = 0; k < 7; k++) P(wx-12+k, wy+3, 22-2*k, 1, WALL);
  P(wx-2, wy-16, 2, 16, SHADE); P(wx-9, wy-14, 9, 2, SHADE);
  for (let i = 0; i < 6; i++) P(wx+6+i*3, wy-4-Math.floor(r()*5), 2, 1, PALE);

  /* cartouche du titre, en haut à gauche */
  const bx = 24, by = 22, bw = 150, bh = 40;
  for (let x = 0; x < bw; x++){ P(bx+x, by, 1, 1, SHADE); P(bx+x, by+bh, 1, 1, SHADE); }
  for (let y = 0; y <= bh; y++){ P(bx, by+y, 1, 1, SHADE); P(bx+bw, by+y, 1, 1, SHADE); }
  for (let x = 2; x < bw-1; x += 1) if (x % 2 === 0){ P(bx+x, by+3, 1, 1, PALE); P(bx+x, by+bh-3, 1, 1, PALE); }
  for (const [ox,oy] of [[0,0],[bw,0],[0,bh],[bw,bh]]){
    P(bx+ox-3, by+oy-3, 7, 1, SHADE); P(bx+ox-3, by+oy+3, 7, 1, SHADE);
    P(bx+ox-3, by+oy-3, 1, 7, SHADE); P(bx+ox+3, by+oy-3, 1, 7, SHADE);
  }

  /* échelle, en bas à gauche */
  const sx0 = 32, sy0 = R-40;
  P(sx0, sy0, 96, 2, SHADE);
  for (let i = 0; i <= 4; i++){ P(sx0+i*24, sy0-4, 2, 8, SHADE); if (i%2===0) P(sx0+i*24, sy0, 24, 2, WALL); }

  return { cv, water, lights };
}

/* ⚠️ La carte du Royaume est EN SOMMEIL : jugée ratée, on y reviendra. Le code
   reste entier et se rallume en appelant mountKingdom(host) — mais le volet
   déplié sert désormais de lanceur, ce qui vaut mieux. */
let kingdomStop = null;
function mountKingdom(host){
  if (kingdomStop) return;
  const { C, R, S } = KINGDOM;
  const map = buildKingdom();
  const view = document.createElement("canvas");
  view.className = "kmap";
  host.innerHTML = "";
  host.appendChild(view);
  const labels = document.createElement("div");
  labels.className = "klabels";
  labels.innerHTML =
    REGIONS.map(x => `<span class="kreg" style="left:${x.x*S}px;top:${x.y*S}px">${x.name}</span>`).join("") +
    PLACES.map(x => `<span style="left:${x.x*S}px;top:${(x.y + (x.k==="town" ? 14 : 20))*S}px">${x.n}</span>`).join("") +
    `<span class="ktitle" style="left:${99*S}px;top:${42*S}px">Le Royaume</span>`;
  host.appendChild(labels);

  let px0 = (C*S - host.clientWidth)/2, py0 = (R*S - host.clientHeight)/2;
  let raf = 0, t = 0, drag = null;
  const clamp = () => {
    px0 = Math.max(0, Math.min(C*S - host.clientWidth, px0));
    py0 = Math.max(0, Math.min(R*S - host.clientHeight, py0));
  };
  const size = () => { const d = Math.min(devicePixelRatio||1,2);
    view.width = Math.round(host.clientWidth*d); view.height = Math.round(host.clientHeight*d);
    view.style.width = host.clientWidth+"px"; view.style.height = host.clientHeight+"px";
    const g = view.getContext("2d"); g.setTransform(d,0,0,d,0,0); g.imageSmoothingEnabled = false; };
  size(); clamp();

  const frame = () => {
    raf = 0; t++;
    const g = view.getContext("2d");
    g.clearRect(0,0,host.clientWidth,host.clientHeight);
    g.drawImage(map.cv, -px0, -py0);
    if (t % 8 === 0) frame.phase = Math.random();
    g.fillStyle = GREY[3];                                  /* miroitement de l'eau */
    for (let i = 0; i < 260; i++){
      const w = map.water[(i*7 + Math.floor(t/9)) % map.water.length];
      if (!w) break;
      g.fillRect(w[0]*S - px0, w[1]*S - py0, S, S);
    }
    g.fillStyle = GREY[0];                                  /* lumières des bourgs */
    for (const l of map.lights) if ((Math.sin(t*.06 + l[0]) > .4))
      g.fillRect(l[0]*S - px0, l[1]*S - py0, S, S);
    labels.style.transform = `translate(${-px0}px,${-py0}px)`;
    raf = requestAnimationFrame(frame);
  };
  const still = () => { const g = view.getContext("2d");
    g.clearRect(0,0,host.clientWidth,host.clientHeight); g.drawImage(map.cv,-px0,-py0);
    labels.style.transform = `translate(${-px0}px,${-py0}px)`; };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  reduced ? still() : raf = requestAnimationFrame(frame);

  const onDown = e => { drag = { x:e.clientX, y:e.clientY, px:px0, py:py0 };
    host.setPointerCapture(e.pointerId); host.style.cursor = "grabbing"; };
  const onMove = e => { if (!drag) return;
    px0 = drag.px - (e.clientX - drag.x); py0 = drag.py - (e.clientY - drag.y);
    clamp(); if (reduced) still(); };
  const onUp = () => { drag = null; host.style.cursor = "grab"; };
  const onWheel = e => { e.preventDefault();
    if (e.shiftKey) px0 += e.deltaY; else { px0 += e.deltaX; py0 += e.deltaY; }
    clamp(); if (reduced) still(); };
  const onResize = () => { size(); clamp(); if (reduced) still(); };
  host.addEventListener("pointerdown", onDown);
  host.addEventListener("pointermove", onMove);
  host.addEventListener("pointerup", onUp);
  host.addEventListener("pointercancel", onUp);
  host.addEventListener("wheel", onWheel, { passive:false });
  addEventListener("resize", onResize);

  kingdomStop = () => {
    if (raf) cancelAnimationFrame(raf);
    host.removeEventListener("pointerdown", onDown); host.removeEventListener("pointermove", onMove);
    host.removeEventListener("pointerup", onUp); host.removeEventListener("pointercancel", onUp);
    host.removeEventListener("wheel", onWheel); removeEventListener("resize", onResize);
    host.innerHTML = ""; kingdomStop = null;
  };
}

/* ==========================================================================
   LA TRAME — une texture animée par Ordre, dans sa couleur, derrière tout.
   Un seul moteur, cinq comportements. Très faible opacité : c'est une
   matière, pas un spectacle. Arrêtée dès qu'on quitte la chambre.
   ========================================================================== */
let weaveStop = null, miniStops = [];
function startWeave(canvas, kind, hex){
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w = 0, h = 0, raf = 0, t = 0, P = [];
  const R = (a=1,b=0) => b + Math.random()*(a-b);

  function size(){
    const r = canvas.getBoundingClientRect();
    if (!r.width || !r.height) return false;
    w = r.width; h = r.height;
    canvas.width = Math.round(w*dpr); canvas.height = Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    return true;
  }

  /* MAGE      un ciel fixe qui scintille, travers\u00e9 de com\u00e8tes en diagonale
     GUERRIER  une forêt de lances qui défile. Des hampes longues, inclinées,
               qui dérivent LENTEMENT d'un bord à l'autre en ondulant comme un
               pas — une troupe en marche, vue au-dessus des rangs.
     Les cinq trames se séparent par le GESTE, jamais par la teinte, et aucune
     ne peut en imiter une autre : le mage est continu et immobile, le ranger
     tombe lentement en tournoyant, le soigneur s'ouvre en cercles, le barde
     ondule à l'horizontale. Le guerrier est le seul à DÉRIVER de côté en
     masse rigide, et le seul fait de verticales.
     ⚠️ Deux versions écartées, et les deux pour l'image, jamais pour le
     mécanisme. Les braises qui montaient ne disaient que « feu ». Les gerbes
     d'étincelles, rouges et projetées, se lisaient comme du SANG, et leur
     vitesse rendait la page illisible. Une trame est un fond : si elle se
     remarque, elle a déjà échoué. Celle-ci met une minute à traverser. */
  function star(){ return { c:false, x:R(w), y:R(h), r:R(3.2,.9), ph:R(6.28), sp:R(.05,.014),
                            big:Math.random() < .34 }; }
  function comet(init){ return { c:true, x:R(w*1.15,-w*.15), y:init ? R(h) : R(-60,-420),
                                 vx:R(7.5,4), vy:R(4.6,2.4), len:R(150,80) }; }
  /* Une lance. `d` est sa distance : au premier rang elle est longue, nette et
     avance vite ; au fond elle est courte, pâle et traîne. Cette seule variable
     donne son épaisseur à la troupe. */
  function lance(init){
    const d = R(1, .34);
    return { k:"lance", d,
      x: init ? R(w + 80, -80) : -60 - R(90),
      base: R(h*1.12, h*.98),     /* le pied toujours hors champ : on ne voit que ce qui dépasse */
      len:  h*.13 + h*.26*d,
      tilt: R(.19,-.10),
      sway: R(.030,.010),
      bob:  R(3.4,1.1),
      sp:   .09 + d*.17,
      flag: Math.random() < .13 };
  }
  function seed(){
    P = [];
    if (kind === "mage"){
      for (let i = 0; i < 118; i++) P.push(star());
      for (let i = 0; i < 4; i++)   P.push(comet(true));
    } else if (kind === "guerrier"){
      for (let i = 0; i < 30; i++) P.push(lance(true));
      P.sort((a,b) => a.d - b.d);
    } else if (kind === "ranger"){
      for (let i = 0; i < 64; i++)  P.push({ x:R(w), y:R(h), a:R(6.28), va:R(.024,-.024),
        vy:R(.8,.3), sw:R(42,16), ph:R(6.28), s:R(13,6) });
    } else if (kind === "soigneur"){
      for (let i = 0; i < 11; i++)  P.push({ x:R(w*.84,w*.16), y:R(h*.8,h*.2),
        r:R(Math.min(w,h)*.55), max:R(Math.min(w,h)*.8, Math.min(w,h)*.38), sp:R(.8,.34) });
    } else if (kind === "barde"){
      for (let i = 0; i < 11; i++)  P.push({ y:R(h), ph:R(6.28), amp:R(40,14),
        len:R(.015,.005), sp:R(.011,.004), dy:R(.18,-.18) });
    }
  }

  function frame(){
    raf = 0; ctx.clearRect(0,0,w,h); t += 1;
    ctx.fillStyle = hex; ctx.strokeStyle = hex; ctx.lineCap = "round";

    for (let i = 0; i < P.length; i++){
      const p = P[i];

      if (kind === "mage"){
        if (p.c){                                   /* la com\u00e8te */
          p.x += p.vx; p.y += p.vy;
          if (p.y > h + 80 || p.x > w + 120){ P[i] = comet(false); continue; }
          const g = ctx.createLinearGradient(p.x, p.y, p.x - p.vx*p.len/6, p.y - p.vy*p.len/6);
          g.addColorStop(0, hex); g.addColorStop(1, "transparent");
          ctx.strokeStyle = g; ctx.globalAlpha = .55; ctx.lineWidth = 2.1;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x - p.vx*p.len/6, p.y - p.vy*p.len/6); ctx.stroke();
          ctx.strokeStyle = hex; ctx.globalAlpha = .66;
          ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, 6.2832); ctx.fill();
          continue;
        }
        p.ph += p.sp;                               /* l'\u00e9toile ne bouge pas, elle respire */
        const tw = .18 + .42*(0.5 + 0.5*Math.sin(p.ph));
        ctx.globalAlpha = tw;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r*(.75 + .35*tw), 0, 6.2832); ctx.fill();
        if (p.big){
          ctx.globalAlpha = tw*.55; ctx.lineWidth = 1;
          const L = p.r*3.4*tw;
          ctx.beginPath(); ctx.moveTo(p.x-L,p.y); ctx.lineTo(p.x+L,p.y);
          ctx.moveTo(p.x,p.y-L); ctx.lineTo(p.x,p.y+L); ctx.stroke();
        }
      }

      else if (kind === "guerrier"){
        p.x += p.sp;
        if (p.x > w + 70){ P[i] = lance(false); continue; }
        /* La phase se lit sur la POSITION, pas sur la particule : une houle
           traverse alors la troupe, au lieu que chacun oscille pour soi. */
        const ph = t*.0075 - p.x*.0065;
        const a  = p.tilt + Math.sin(ph)*p.sway;
        const y0 = p.base + Math.sin(ph*1.9)*p.bob;
        const sa = Math.sin(a), ca = Math.cos(a);
        const x1 = p.x + sa*p.len, y1 = y0 - ca*p.len;
        ctx.globalAlpha = .12 + p.d*.16;
        ctx.lineWidth = .7 + p.d*.6;
        ctx.beginPath(); ctx.moveTo(p.x, y0); ctx.lineTo(x1, y1); ctx.stroke();
        const fl = 7 + p.d*7;
        ctx.globalAlpha = .18 + p.d*.22; ctx.lineWidth = 1.1 + p.d*.9;
        ctx.beginPath(); ctx.moveTo(x1 - sa*fl, y1 + ca*fl); ctx.lineTo(x1, y1); ctx.stroke();
        if (p.flag){
          const bw = 10 + p.d*8, bh = 7 + p.d*5, dr = Math.sin(ph*1.5 + 1.1)*.30;
          const bx = x1 - sa*(fl + 3), by = y1 + ca*(fl + 3);
          ctx.globalAlpha = .12 + p.d*.15;
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.lineTo(bx - bw, by + bw*dr);
          ctx.lineTo(bx - bw*.72, by + bh + bw*dr*.6);
          ctx.lineTo(bx, by + bh);
          ctx.closePath(); ctx.fill();
        }
      }

      else if (kind === "ranger"){
        p.y += p.vy; p.a += p.va; p.ph += .02;
        const x = p.x + Math.sin(p.ph)*p.sw;
        if (p.y > h + 34){ p.y = -34; p.x = R(w); continue; }
        ctx.globalAlpha = .34;
        ctx.save(); ctx.translate(x, p.y); ctx.rotate(p.a + Math.sin(p.ph)*.55);
        ctx.beginPath(); ctx.ellipse(0, 0, p.s, p.s*.38, 0, 0, 6.2832); ctx.fill();
        ctx.globalAlpha = .5; ctx.lineWidth = Math.max(.7, p.s*.1);
        ctx.beginPath(); ctx.moveTo(-p.s*1.25, 0); ctx.lineTo(p.s*1.25, 0); ctx.stroke();
        ctx.restore();
      }

      else if (kind === "soigneur"){
        p.r += p.sp;
        if (p.r > p.max){ p.r = 0; p.x = R(w*.84,w*.16); p.y = R(h*.8,h*.2); continue; }
        const k = 1 - p.r/p.max;
        ctx.globalAlpha = .46*k*k; ctx.lineWidth = 1.8*k + .5;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.stroke();
      }

      else if (kind === "barde"){
        p.ph += p.sp; p.y += p.dy;
        if (p.y < -60) p.y = h + 60; if (p.y > h + 60) p.y = -60;
        ctx.globalAlpha = .32; ctx.lineWidth = 1.6;
        ctx.beginPath();
        for (let x = 0; x <= w; x += 6){
          const y = p.y + Math.sin(x*p.len + p.ph)*p.amp;
          x ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
        }
        ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }

  const onResize = () => { if (size()) seed(); };
  addEventListener("resize", onResize);

  /* La couche peut n'être pas encore mise en page quand on arrive : le canevas
     mesure alors zéro, et l'ancienne version abandonnait là — une chambre sans
     trame, sans rien pour le signaler. On réessaie, par minuterie et jamais par
     image d'animation : un onglet qui n'est pas rendu n'en produit aucune. */
  let tid = 0, tries = 0;
  const begin = () => {
    seed();
    if (matchMedia("(prefers-reduced-motion: reduce)").matches){ frame(); if (raf) cancelAnimationFrame(raf); raf = 0; }
    else raf = requestAnimationFrame(frame);
  };
  const attempt = () => {
    tid = 0;
    if (size()) return begin();
    if (++tries < 40) tid = setTimeout(attempt, 60);
  };
  attempt();
  return () => { if (tid) clearTimeout(tid);
                 if (raf) cancelAnimationFrame(raf); removeEventListener("resize", onResize); };
}

let skyStop = null;
function stopWeaves(){
  if (skyStop){ skyStop(); skyStop = null; }
  if (weaveStop){ weaveStop(); weaveStop = null; }
  miniStops.forEach(f => f()); miniStops = [];
}
/* ⚠️ Aucun requestAnimationFrame ici. Un onglet qui n'est pas rendu n'en
   déclenche jamais : la chambre restait alors sans trame, la cité sans dessin,
   et rien ne le disait. Troisième occurrence du même piège après les couches
   quittées et le fil qui s'ouvrait en haut — la règle vaut partout désormais :
   un rappel d'animation anime, il ne met jamais en place. */
function mountWeave(layer){
  stopWeaves();
  let tries = 0;
  const run = () => {
    if (cur !== layer) return;                      /* la couche a déjà été remplacée */
    const ch = layer.querySelector("[data-texture]");
    if (ch && !weaveStop){
      const c = CIRCLES.find(x => x.id === ch.dataset.texture);
      const cv = ch.querySelector("canvas.weave");
      if (c && cv) weaveStop = startWeave(cv, c.id, c.hex);
    }
    const sky = layer.querySelector("canvas.skyline");
    if (sky && !skyStop) skyStop = drawSkyline(sky);
    const die = layer.querySelector("canvas.d10");
    if (die) drawDie(die, "XII");
    if (++tries < 14 && sky && !skyStop) setTimeout(run, 70);
  };
  run();
}

/* ==========================================================================
   LA COQUE — registre de vues, navigation déduite de lui.
   ========================================================================== */
const REGISTRY = [
  { id:"orders", label:"Les Ordres", href:"#/cercles", gl:"◎", narrow:"adapt",
    subs:() => CIRCLES.map(c => ({ href:`#/cercles/${c.id}`, label:c.name, dot:c.color, n:roman(membersOf(c.id).length) })) },
  { id:"works", label:"Les Œuvres", href:"#/media", gl:"❧", narrow:"adapt",
    subs:() => ["game","film","series","book"].map(t => ({ href:`#/media/t/${t}`, label:KINDS[t], n:roman(tracked(t).length) })) },
  /* « Ma Feuille » a disparu d'ici : le visage en bas de la barre y mène déjà,
     et deux portes pour la même pièce, c'est une porte de trop. En étroit, où
     la barre n'existe pas, le visage passe dans l'en-tête — voir .mob. */
  { id:"quests", label:"Les Quêtes", href:"#/quetes", gl:"❖", narrow:"adapt" },
  /* ⚠️ TEMPORAIRE — banc d'essai de l'entrée dans le groupe. À retirer au portage. */
  { id:"onboard", label:"Onboarding", href:"#/onboarding", gl:"⌁", narrow:"adapt", bench:true },
  /* Troisième zone de la barre : ni agir, ni parcourir — TENIR. Et `only` ne
     grise pas la porte, il la retire : pour qui n'a pas la charge, elle
     n'existe pas. C'est l'inverse d'un geste secret, que l'invariant 19
     interdirait de toute façon. */
  { id:"greffe", label:"Le Greffe", href:"#/greffe", gl:"✇", narrow:"adapt",
    hold:true, only:() => isSteward(ME) },
];
const OPEN = new Set();

function chrome(h){
  const doors = REGISTRY.filter(v => !v.only || v.only());
  document.getElementById("nav").innerHTML = doors.filter(v => !v.hold).map(v => {
    const on = h.startsWith(v.href), subs = v.subs ? v.subs() : null;
    return `<div class="ngrp ${OPEN.has(v.id)?"open":""}">
      <div class="nrow ${on?"on":""}">
        <a href="${v.href}" title="${v.label}"><span class="gl">${v.gl}</span><span>${v.label}</span></a>
        ${subs?`<button class="nexp" data-exp="${v.id}" aria-expanded="${OPEN.has(v.id)}" aria-label="Déplier ${v.label}">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9.5 6l6 6-6 6"/></svg></button>`:""}
      </div>
      ${subs?`<div class="sub"><div>${subs.map(s=>`<a href="${s.href}" class="${h===s.href?"on":""}">
        ${s.dot?`<span class="cdot" style="--c:${s.dot}"></span>`:`<span class="cdot"></span>`}${s.label}<span class="n">${s.n}</span></a>`).join("")}</div></div>`:""}
    </div>`;
  }).join("");
  /* Ce qu'on TIENT, sous sa propre règle : ni une action, ni une promenade. */
  const hold = doors.filter(v => v.hold);
  const hd = document.getElementById("hold");
  if (hd) hd.innerHTML = !hold.length ? "" :
    `<div class="rail-sep"></div><div class="lbl">Tenir</div>` + hold.map(v =>
      `<a class="inscribe" href="${v.href}" title="${v.label}"><span class="gl">${v.gl}</span><span>${v.label}</span></a>`).join("");
  const me = person(ME);
  const mm = document.getElementById("mobme");
  if (mm) mm.innerHTML = Face(me,"f-m",false);
  /* En étroit la barre basse reste à quatre entrées : la charge passe donc
     dans l'en-tête, à côté du visage — le même raisonnement que « Ma Feuille ». */
  const mg = document.getElementById("mobgr");
  if (mg) mg.innerHTML = hold.map(v =>
    `<a href="${v.href}" class="mob-gr ${h.startsWith(v.href)?"on":""}" aria-label="${v.label}">${v.gl}</a>`).join("");
  document.getElementById("foot").innerHTML =
    `<a href="#/profil">${Face(me,"f-m",false)}<span class="t"><b style="display:block;font-size:12px">${esc(me.firstName)}</b>
     <span style="font-size:10px;color:var(--faint)">${esc(me.circleRef.one)}</span></span></a>`;
  const tabs = [{href:"#/",label:"Registre",gl:"☰"},
    ...REGISTRY.filter(v => !v.bench && !v.hold).map(v=>({href:v.href,label:v.label.replace(/^(Les|Le|Ma) /,""),gl:v.gl}))];
  document.getElementById("tabs").innerHTML = tabs.map(t =>
    `<a href="${t.href}" class="${t.href==="#/"?(h==="#/"?"on":""):(h.startsWith(t.href)?"on":"")}"><span class="gl">${t.gl}</span>${t.label}</a>`).join("");
}

/* ==========================================================================
   LA BASCULE DE MISE AU POINT — deux couches se croisent. Celle qu'on quitte
   se défocalise et recule ; celle qui arrive se fait nette. La profondeur du
   parcours donne le sens : on avance en s'enfonçant, on revient en remontant.
   ========================================================================== */
const stage = document.getElementById("stage");
const qa = document.getElementById("q"), qb = document.getElementById("q2");
let cur = null, prevHash = "#/";
const REDUCE = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const routeHtml = (h,q) => {
  if (q && q.length >= 2)          return V.seek(q);
  if (h.startsWith("#/fiche/"))    return V.folio(h.slice(8));
  if (h.startsWith("#/media/t/"))  { kind = h.slice(10); return V.works(); }
  if (h.startsWith("#/media"))     { kind = null; return V.works(); }
  if (h.startsWith("#/onboarding")) return V.onboard();
  if (h.startsWith("#/greffe"))    return V.greffe();
  if (h.startsWith("#/quete/"))    return V.quest(h.slice(8));
  if (h.startsWith("#/quetes"))    return V.quests();
  if (h.startsWith("#/cercles/"))  return V.orders(h.slice(10));
  if (h.startsWith("#/cercles"))   return V.orders(null);
  if (h.startsWith("#/personne/")) return V.soul(h.slice(11));
  if (h.startsWith("#/profil"))    return V.soul(ME);
  return V.home();
};
const DEPTH = h => h === "#/" ? 0
  : /^#\/(cercles|media|quetes)$/.test(h) || /^#\/media\/t\//.test(h) ? 1
  : /^#\/(cercles\/|fiche\/|quete\/)/.test(h) ? 2
  : /^#\/(personne\/|profil)/.test(h) ? 3 : 1;

function show(h){
  const q = qa.value.trim();
  const layer = document.createElement("div");
  layer.className = "layer";
  layer.innerHTML = routeHtml(h, q);
  stage.appendChild(layer);
  chrome(h);
  const old = cur; cur = layer;
  mountWeave(layer);

  afterRender();
  if (!old || REDUCE()){ if (old) old.remove(); prevHash = h; return; }
  const fwd = DEPTH(h) >= DEPTH(prevHash);
  prevHash = h;

  const a = old.animate(
    [{ opacity:1, transform:"scale(1)", filter:"blur(0px)" },
     { opacity:0, transform:`scale(${fwd?1.06:.94})`, filter:"blur(12px)" }],
    { duration:300, easing:"cubic-bezier(.6,0,.25,1)", fill:"forwards" });
  /* Le retrait ne doit pas dépendre de l'animation : un onglet en arrière-plan
     peut la geler, et les couches quittées s'empileraient en silence. */
  a.onfinish = a.oncancel = () => old.remove();
  setTimeout(() => old.remove(), 360);
  layer.animate(
    [{ opacity:0, transform:`scale(${fwd?.965:1.05})`, filter:"blur(10px)" },
     { opacity:1, transform:"scale(1)", filter:"blur(0px)" }],
    { duration:420, easing:"cubic-bezier(.2,.75,.25,1)" });
}

/* --- interactions : tout au clic. Rien ne se révèle au survol. --- */
document.addEventListener("click", e => {
  /* Choisir une destination referme le volet — mais déplier une section n'est
     pas choisir, et cliquer dans le champ de recherche encore moins. */
  if (!app.classList.contains("collapsed")
      && !e.target.closest("[data-exp]") && !e.target.closest(".find")
      && (e.target.closest(".rail a[href]") || e.target.closest(".deck [data-go]")
          || e.target.closest(".deck a[href]")))
    setRail(true);

  const exp = e.target.closest("[data-exp]");
  if (exp){ OPEN.has(exp.dataset.exp) ? OPEN.delete(exp.dataset.exp) : OPEN.add(exp.dataset.exp);
            chrome(location.hash||"#/"); return; }
  const ch = e.target.closest("[data-chamber]");
  if (ch){ burst(ch, ch.dataset.chamber); return; }
  const go = e.target.closest("[data-go]");
  if (go){ e.preventDefault(); location.hash = go.dataset.go; return; }
  const k = e.target.closest("[data-kind]");
  if (k){ location.hash = k.dataset.kind ? `#/media/t/${k.dataset.kind}` : "#/media"; return; }
  const so = e.target.closest("[data-sort]");
  if (so){ sortKey = so.dataset.sort; show(location.hash||"#/"); return; }
  const vw = e.target.closest("[data-view]");
  if (vw){ workView = vw.dataset.view; show(location.hash||"#/"); return; }
  if (e.target.closest("[data-lot-go]")){ spinLot(); return; }
  const pl = e.target.closest("[data-plate]");
  if (pl){ e.preventDefault(); openPlate(pl.dataset.plate); return; }
  if (e.target.closest("[data-inscribe]")){ openSeek(); return; }
  if (e.target.closest("[data-live]")){ openLive(); return; }
  if (e.target.closest("[data-newquest]")){ openQuest(); return; }
  if (e.target.closest("[data-onbgo]")){ openOnboarding(); return; }
  const tl = e.target.closest("[data-tologe]");
  if (tl){ orderId = tl.dataset.tologe; orderTab = "loge"; logeFold = false;
           location.hash = `#/cercles/${orderId}`; return; }
  const kn = e.target.closest("[data-kin]");
  if (kn){ e.preventDefault(); openKin(kn.dataset.kin); return; }
  /* Choisir une destination depuis la lignée la referme : on en sort là où on va. */
  if (e.target.closest("[data-kinclose]")){
    const sf = e.target.closest(".surface");
    if (sf) setTimeout(() => sf.querySelector(".surf-x")?.click(), 0);
  }
  const qf = e.target.closest("[data-qf]");
  if (qf){ questFilter = qf.dataset.qf; show(location.hash||"#/"); return; }
  /* --- Le Greffe. Rien ne s'y efface : admettre, écarter, fondre et défaire
         sont tous des actes inscrits, et un alias se retire. --- */
  const adm = e.target.closest("[data-admit]");
  if (adm){
    const k = KNOCKS.find(x => x.id === adm.dataset.admit);
    if (k){ KNOCKS = KNOCKS.filter(x => x !== k);
      act("admission", k.login, k.firstName ? `${k.firstName}, fragment créé` : "fragment créé");
      grNote = `<b>@${esc(k.login)}</b> entre dans l'organisation et son fragment est créé vide. Personne ne l'en avertit : il le verra à sa prochaine ouverture.`;
      regreffe(); }
    return;
  }
  const shn = e.target.closest("[data-shun]");
  if (shn){
    const k = KNOCKS.find(x => x.id === shn.dataset.shun);
    if (k){ KNOCKS = KNOCKS.filter(x => x !== k);
      act("ecart", k.login, k.vouchedName ? `se réclamait de « ${k.vouchedName} »` : "ne se réclamait de personne");
      grNote = `L'issue est fermée. <b>Aucune liste noire</b> ne s'ouvre pour autant — rien n'empêche de frapper encore.`;
      regreffe(); }
    return;
  }
  const fo = e.target.closest("[data-fold]");
  if (fo){
    const [from,to] = fo.dataset.fold.split(":");
    ALIAS[from] = to;
    act("alias", titleOf(to) || to, `${from} → ${to}`);
    grNote = `Alias déclaré dans <b>ton</b> fragment — celui des autres reste intact. Les inscriptions se replieront <b>au prochain chargement</b> : un alias s'applique à la lecture, il ne réécrit rien.`;
    regreffe();
    return;
  }
  const uf = e.target.closest("[data-unfold]");
  if (uf){
    const from = uf.dataset.unfold, to = ALIAS[from];
    delete ALIAS[from];
    act("defait", titleOf(from) || from, `${from} ⇸ ${to}`);
    grNote = `Alias défait. <b>Rien n'avait été perdu</b> — c'est tout l'intérêt d'une déclaration.`;
    regreffe();
    return;
  }
  const ps = e.target.closest("[data-pass]");
  if (ps){
    const sel = document.querySelector("[data-pass-sel]");
    const id = sel && sel.value;
    if (!id){ grNote = `Choisis d'abord à qui confier la charge.`; regreffe(); return; }
    ORG_ROLE[id] = "admin";
    act("greffe", id, "charge confiée");
    grNote = `<b>${esc(person(id).firstName)}</b> tient le greffe. Le rôle a changé dans l'organisation GitHub — l'application n'a fait que le demander.`;
    regreffe();
    return;
  }
  const br = e.target.closest("[data-bench-role]");
  if (br){
    BENCH_ROLE = br.dataset.benchRole;
    grNote = "";
    /* On reste sur place : l'écran devient celui d'un non-greffier, et la
       porte s'efface de la barre sous les yeux. C'est ça qu'il faut voir. */
    regreffe();
    return;
  }
  const qd = e.target.closest("[data-qdel]");
  if (qd){ dropQuest(qd.dataset.qdel); location.hash = "#/quetes"; return; }
  const rp = e.target.closest("[data-replay]");
  if (rp){ bumpPlays(rp.dataset.replay); show(location.hash||"#/"); return; }
  const ed = e.target.closest("[data-edit]");
  if (ed){ e.preventDefault(); openInscribe(ed.dataset.edit); return; }
  const tb = e.target.closest("[data-tab]");
  if (tb){
    const nav = tb.closest("[data-tabs]");
    const T = TABSETS[(nav && nav.dataset.tabs) || "soul"];
    const from = T.tabs.indexOf(T.get()), to = T.tabs.indexOf(tb.dataset.tab);
    T.set(tb.dataset.tab);
    (nav || document).querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b === tb));
    slidePane(document.getElementById(T.host), T.body(), to > from ? 1 : -1);
    return;
  }
  const fv = e.target.closest("[data-fav]");
  if (fv){ toggleFav(fv.dataset.fav);
           const b = document.getElementById("minebox");
           if (b) b.innerHTML = mineBox(fv.dataset.fav);
           return; }
  const fmv = e.target.closest("[data-favmv]");
  if (fmv){ const [mid,d] = fmv.dataset.favmv.split(":"); moveFav(mid, +d); afterFav(); return; }
  const fdl = e.target.closest("[data-favdel]");
  if (fdl){ toggleFav(fdl.dataset.favdel); afterFav(); return; }
  if (e.target.closest("[data-favpick]")){ openFavPick(); return; }
  const mk = e.target.closest("[data-mark]");
  if (mk){ toggleMark(mk.dataset.mark); redrawTab("order"); return; }
  if (e.target.closest("[data-fold]")){ logeFold = !logeFold; redrawTab("order"); return; }
  const jp = e.target.closest("[data-jump]");
  if (jp){ logeJump = jp.dataset.jump;
           if (logeFold){ logeFold = false; redrawTab("order"); } else afterRender();
           return; }
  const mp = e.target.closest("[data-mpick]");
  if (mp){ logeRef = mp.dataset.mpick; paintMention(); return; }
  if (e.target.closest("[data-mclear]")){ logeRef = null; paintMention(); return; }
  const lrp = e.target.closest("[data-reply]");
  if (lrp){ logeReply = lrp.dataset.reply; redrawTab("order");
            const t = document.querySelector(".compose textarea"); if (t) t.focus();
            return; }
  if (e.target.closest("[data-unreply]")){ logeReply = null; redrawTab("order"); return; }
  const dp = e.target.closest("[data-drop]");
  if (dp){ dropPost(dp.dataset.drop);
           if (logeReply === dp.dataset.drop) logeReply = null;
           redrawTab("order"); setTabCount("order","loge",logeOf(orderId).length);
           return; }
  const sset = e.target.closest("[data-set]");
  if (sset){ const [mid,st] = sset.dataset.set.split(":"); setStatus(mid,st); refreshPane(); return; }
  const stn = e.target.closest("[data-station]");
  if (stn){
    const f = document.querySelector(`[data-sform="${CSS.escape(stn.dataset.station)}"]`);
    if (f){ f.hidden = !f.hidden; if (!f.hidden) f.querySelector("input").focus(); }
    return;
  }
  const pf = e.target.closest("[data-pref]");
  if (pf){ setTitlePref(pf.dataset.pref); refreshPane(); return; }
  const m = e.target.closest("[data-mode]");
  if (m){
    const from = MODES.indexOf(mode), to = MODES.indexOf(m.dataset.mode);
    mode = m.dataset.mode;
    document.querySelectorAll(".filt-sub button").forEach(b => b.classList.toggle("on", b === m));
    slidePane(document.getElementById("subpane"), registryBody(person(soulId)), to > from ? 1 : -1);
    return;
  }
  if (e.target.closest("[data-more]")){ regMax = 999; show(location.hash||"#/"); return; }
  const o = e.target.closest("[data-open]");
  if (o){ o.closest(".chron").classList.toggle("open"); return; }
}, true);

/* --- la couleur naît de la pastille cliquée, puis la chambre s'ouvre --- */
function burst(el, id){
  const c = CIRCLES.find(x => x.id === id);
  if (REDUCE()){ location.hash = `#/cercles/${id}`; return; }
  const d = el.querySelector(".disc2") || el;
  const r = d.getBoundingClientRect();
  const b = document.createElement("div");
  b.className = "burst";
  b.style.cssText = `--c:${c.color};left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;
    width:${r.width}px;height:${r.height}px;animation:burst 640ms var(--e) forwards`;
  document.body.appendChild(b);
  setTimeout(() => b.remove(), 680);
  setTimeout(() => { location.hash = `#/cercles/${id}`; }, 150);
}

/* ==========================================================================
   LES SURFACES — une seule mécanique pour tout ce qui se pose par-dessus.
   Elle défocalise ce qu'elle recouvre plutôt que de l'assombrir : c'est le
   même geste que la navigation. Promue ici dès que l'agrandissement de
   jaquette et l'inscription en ont eu besoin toutes les deux.
   ========================================================================== */
/* Les surfaces s'EMPILENT, elles ne se remplacent pas : recadrer une jaquette
   ouvre une surface par-dessus la fiche d'inscription, qui doit retrouver
   intacts l'état, le jugement et la chronique déjà saisis. Celle du dessous se
   défocalise à son tour — la profondeur de champ vaut aussi entre surfaces. */
function openSurface(inner, cls){
  const open = [...document.querySelectorAll(".surface")];
  if (!open.length && cur) cur.classList.add("behind");
  open.forEach(o => o.classList.add("under"));
  const el = document.createElement("div");
  el.className = "surface " + (cls || "");
  el.style.zIndex = 300 + open.length * 10;
  el.innerHTML = `<button class="surf-x" aria-label="Fermer">&times;</button>
    <div class="surf-body">${inner}</div>`;
  document.body.appendChild(el);
  const close = () => {
    el.remove();
    const rest = [...document.querySelectorAll(".surface")];
    if (rest.length) rest[rest.length-1].classList.remove("under");
    else if (cur) cur.classList.remove("behind");
    removeEventListener("keydown", onKey);
  };
  const onKey = e => { if (e.key === "Escape") close(); };
  addEventListener("keydown", onKey);
  el.addEventListener("click", e => { if (e.target === el || e.target.closest(".surf-x")) close(); });
  return { el, close, body: el.querySelector(".surf-body") };
}

function openPlate(id){

    <div class="plate-cap${m.cover?"":" bare"}">${m.cover?esc(titleOf(m)):""}<span>${KIND[m.mediaType]} · ${m.year}</span></div>`,
    "plateview");
